name: Validate site

# The site deploys to Cloudflare Pages from main only (.github/workflows/deploy.yml).
# This workflow is the pull-request gate: it proves the site builds, that every
# internal link resolves, and that the download URLs the site advertises match the
# public release channel. Without it a broken build would only surface at deploy
# time, after the merge.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv zola /usr/local/bin
          zola --version

      - name: Build site
        # Zola fails the build on broken internal links.
        # This artifact is a test preview; production has its own deploy build.
        run: zola build --base-url http://127.0.0.1:8879

      - name: Verify editor, demo outputs and publication downloads
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify the build produced pages
        run: |
          pages=$(find public -name '*.html' | wc -l)
          echo "Generated ${pages} HTML pages"
          if [ "${pages}" -lt 10 ]; then
            echo "::error::Expected at least 10 generated pages, found ${pages}"
            exit 1
          fi
          test -f public/index.html || { echo "::error::public/index.html is missing"; exit 1; }

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public/
          retention-days: 7

  navigation:
    name: Navigation (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt

      - name: Download test preview
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public

      - name: Install browser test tools
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Verify responsive navigation and keyboard interactions
        run: |
          python -m http.server 8879 --bind 127.0.0.1 --directory public > /tmp/navigation-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 20 http://127.0.0.1:8879/
          python scripts/check-navigation.py --base-url http://127.0.0.1:8879 --browser ${{ matrix.browser }} --artifacts navigation-results

      - name: Upload navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-${{ matrix.browser }}
          path: navigation-results/
          retention-days: 7

  release-links:
    name: Check release channel links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify advertised downloads exist on the public channel
        run: python3 scripts/check-release-links.py
