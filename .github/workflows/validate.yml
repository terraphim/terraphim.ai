name: Validate site

# The site deploys to Cloudflare Pages from main only (.github/workflows/deploy.yml).
# This workflow is the pull-request gate: it proves the site builds, that every
# internal link resolves, and that the download URLs the site advertises match the
# public release channel. Without it a broken build would only surface at deploy
# time, after the merge.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.22.1"
  TERRAPHIM_PUBLICATION_URL: https://downloads.terraphim.ai/terraphim-agent/terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz
  TERRAPHIM_PUBLICATION_ARCHIVE_SHA256: 3afe1ba64dfd7f19214f2171f8cba467f674f77317c0e05af44408627eb288e1
  TERRAPHIM_PUBLICATION_BINARY_SHA256: 0680d81956350eb26ac916c426b7b5e60776e587aba624d36f5fab95f385fb09

jobs:
  build:
    name: Build and check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download checksum-verified terraphim-agent v1.21.22
        shell: bash
        run: |
          set -euo pipefail
          live_root="${RUNNER_TEMP}/terraphim-publication-v1.21.22"
          archive="${live_root}/terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz"
          binary="${live_root}/terraphim-agent"
          mkdir -p "${live_root}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(Path("scripts/tests/fixtures/terraphim-agent-v1.21.22/identity.json").read_text())
          assert identity["archive"] == "terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz"
          assert identity["archiveSha256"] == os.environ["TERRAPHIM_PUBLICATION_ARCHIVE_SHA256"]
          assert identity["binarySha256"] == os.environ["TERRAPHIM_PUBLICATION_BINARY_SHA256"]
          PY
          curl --fail --location --silent --show-error \
            "${TERRAPHIM_PUBLICATION_URL}" --output "${archive}"
          printf '%s  %s\n' "${TERRAPHIM_PUBLICATION_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "${archive}" --directory "${live_root}"
          test -f "${binary}"
          chmod +x "${binary}"
          printf '%s  %s\n' "${TERRAPHIM_PUBLICATION_BINARY_SHA256}" "${binary}" \
            | sha256sum --check --strict -
          printf 'TERRAPHIM_AGENT_BIN=%s\n' "${binary}" >> "${GITHUB_ENV}"
          printf 'TERRAPHIM_PUBLICATION_LIVE_REQUIRED=1\n' >> "${GITHUB_ENV}"

      - name: Replay published terraphim-agent commands
        run: python3 -m unittest scripts.test_checklist_publication_live -v

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv zola /usr/local/bin
          zola --version

      - name: Build site
        # Zola fails the build on broken internal links.
        # This artifact is a test preview; production has its own deploy build.
        run: zola build --base-url http://127.0.0.1:8879

      - name: Verify editor, demo outputs and publication downloads
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify the build produced pages
        run: |
          pages=$(find public -name '*.html' | wc -l)
          echo "Generated ${pages} HTML pages"
          if [ "${pages}" -lt 10 ]; then
            echo "::error::Expected at least 10 generated pages, found ${pages}"
            exit 1
          fi
          test -f public/index.html || { echo "::error::public/index.html is missing"; exit 1; }

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public/
          retention-days: 7

  navigation:
    name: Navigation (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt

      - name: Download test preview
        uses: actions/download-artifact@v4
        with:
          name: site-public
          path: public

      - name: Install browser test tools
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Verify responsive navigation and keyboard interactions
        run: |
          python -m http.server 8879 --bind 127.0.0.1 --directory public > /tmp/navigation-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --output /dev/null --retry 10 --retry-connrefused --retry-delay 1 --retry-max-time 20 http://127.0.0.1:8879/
          python scripts/check-navigation.py --base-url http://127.0.0.1:8879 --browser ${{ matrix.browser }} --artifacts navigation-results

      - name: Upload navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-${{ matrix.browser }}
          path: navigation-results/
          retention-days: 7

  release-links:
    name: Check release channel links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify advertised downloads exist on the public channel
        run: python3 scripts/check-release-links.py

  release-drift-check:
    name: Check release-link drift
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Detect drift between managed fields and admitted releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_release.py --target website --check --receipt drift-receipt.json

      - name: Upload drift receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-drift-receipt
          path: drift-receipt.json
          retention-days: 30
