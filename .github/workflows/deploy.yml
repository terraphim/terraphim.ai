name: Deploy to Cloudflare Pages

# Production deploy. Runs after a push to main (or on demand).
#
# The Cloudflare Pages project `terraphim-ai` is deployed exclusively through
# this workflow. There is no separate CDN/Git integration to keep in sync, so a
# green run here means the published site matches main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

env:
  EDITOR_MANIFEST_SHA256: e972d1c779cca709ff1a1c8e0b0c543b855d82d7e6fa26fbf14414f84c6fb1d0
  ZOLA_VERSION: "0.22.1"
  TERRAPHIM_PUBLICATION_URL: https://downloads.terraphim.ai/terraphim-agent/terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz
  TERRAPHIM_PUBLICATION_ARCHIVE_SHA256: 3afe1ba64dfd7f19214f2171f8cba467f674f77317c0e05af44408627eb288e1
  TERRAPHIM_PUBLICATION_BINARY_SHA256: 0680d81956350eb26ac916c426b7b5e60776e587aba624d36f5fab95f385fb09
  CF_PROJECT: terraphim-ai
  OP_API_TOKEN: op://TerraphimPlatform/terraphim-md-book-cloudflare/workers-api-token
  OP_ACCOUNT_ID: op://TerraphimPlatform/terraphim-md-book-cloudflare/account_id

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download checksum-verified terraphim-agent v1.21.22
        shell: bash
        run: |
          set -euo pipefail
          live_root="${RUNNER_TEMP}/terraphim-publication-v1.21.22"
          archive="${live_root}/terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz"
          binary="${live_root}/terraphim-agent"
          mkdir -p "${live_root}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(Path("scripts/tests/fixtures/terraphim-agent-v1.21.22/identity.json").read_text())
          assert identity["archive"] == "terraphim-agent-1.21.22-x86_64-unknown-linux-musl.tar.gz"
          assert identity["archiveSha256"] == os.environ["TERRAPHIM_PUBLICATION_ARCHIVE_SHA256"]
          assert identity["binarySha256"] == os.environ["TERRAPHIM_PUBLICATION_BINARY_SHA256"]
          PY
          curl --fail --location --silent --show-error \
            "${TERRAPHIM_PUBLICATION_URL}" --output "${archive}"
          printf '%s  %s\n' "${TERRAPHIM_PUBLICATION_ARCHIVE_SHA256}" "${archive}" \
            | sha256sum --check --strict -
          tar --extract --gzip --file "${archive}" --directory "${live_root}"
          test -f "${binary}"
          chmod +x "${binary}"
          printf '%s  %s\n' "${TERRAPHIM_PUBLICATION_BINARY_SHA256}" "${binary}" \
            | sha256sum --check --strict -
          printf 'TERRAPHIM_AGENT_BIN=%s\n' "${binary}" >> "${GITHUB_ENV}"
          printf 'TERRAPHIM_PUBLICATION_LIVE_REQUIRED=1\n' >> "${GITHUB_ENV}"

      - name: Replay published terraphim-agent commands
        run: python3 -m unittest scripts.test_checklist_publication_live -v

      - name: Install Zola ${{ env.ZOLA_VERSION }}
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz
          sudo mv zola /usr/local/bin
          zola --version

      - name: Verify admitted editor source assets
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/import-editor.py --verify --destination static/editor --manifest-sha256 "$EDITOR_MANIFEST_SHA256"

      - name: Build site
        run: zola build

      - name: Verify generated editor assets before deployment
        run: python3 scripts/import-editor.py --verify --destination public/editor --manifest-sha256 "$EDITOR_MANIFEST_SHA256"

      - name: Load secrets from 1Password
        id: op-load-secrets
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ env.OP_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.OP_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT }} --branch=main

      - name: Deploy qualified branch candidate to preview
        if: github.ref != 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CF_PROJECT }} --branch=editor-publication-preview

      - name: Verify the deployed site serves the committed version
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          expected=$(grep -oP '^release_version\s*=\s*"\K[^"]+' config.toml)
          url="${DEPLOY_URL:-https://${CF_PROJECT}.pages.dev}"
          echo "Expecting release_version ${expected} at ${url}"

          attempt=1
          while [ "${attempt}" -le 5 ]; do
            body=$(curl --fail --location --silent --show-error --max-time 30 "${url}/" || true)
            if printf '%s' "${body}" | grep -q "${expected}"; then
              echo "Deployment served release ${expected} on attempt ${attempt}"
              exit 0
            fi
            echo "Attempt ${attempt}: ${expected} not found yet, retrying"
            attempt=$((attempt + 1))
            sleep 15
          done

          # Surface the site content for debugging before failing.
          curl --fail --location --silent --show-error --max-time 30 "${url}/" | head -c 2000 || true
          echo "::error::Deployed site does not advertise release ${expected}"
          exit 1
