      // Rust `render_markdown` uses the markdown crate's defaults, which
      // escape raw HTML and drop dangerous link protocols.
      body.innerHTML = html;
    }
    card.append(head, body);
    return card;
  }

  /** HTML from the Rust converter, or null when it is not exposed. */
  renderMarkdown(text) {
    const api = (this.editor.config && this.editor.config.bindings) || window.wasmBindings;
    if (!api || typeof api.render_markdown !== 'function') return null;
    try {
      return api.render_markdown(text);
    } catch (e) {
      return null;
    }
  }

  cards() {
    return Array.from(this.list.querySelectorAll(':scope > .te-block'));
  }

  setCurrent(index, focus = true) {
    const cards = this.cards();
    if (cards.length === 0) return;
    const i = Math.max(0, Math.min(cards.length - 1, index));
    this.focusIndex = i;
    cards.forEach((c, k) => {
      c.tabIndex = k === i ? 0 : -1;
      for (const b of c.querySelectorAll('.te-block-action')) b.tabIndex = k === i && !b.hidden ? 0 : -1;
    });
    // Native focus scrolls the card into view only when it is off screen.
    if (focus) cards[i].focus();
  }

  focusCard(index) {
    this.setCurrent(index, true);
  }

  // ---------------------------------------------------------------------
  // View switching
  // ---------------------------------------------------------------------

  isActive() {
    return this.view === 'blocks';
  }

  writeOnActive() {
    const chrome = this.editor.chrome;
    return !!(chrome && typeof chrome.isWriteOn === 'function' && chrome.isWriteOn());
  }

  /** Whether the toolbar (with the view toggle) is shown in plain mode. */
  toolsVisible() {
    const chrome = this.editor.chrome;
    return !(chrome && typeof chrome.toolsVisible === 'function') || chrome.toolsVisible();
  }

  /**
   * Show 'text' (the editing surface) or 'blocks'. The caret follows: the
   * block containing the surface selection gets focus, and on the way back
   * the caret goes to the edited position or the start of the focused block.
   */
  setView(view, { persist = true, focus = true } = {}) {
    if (this.destroyed) return;
    const next = view === 'blocks' ? 'blocks' : 'text';
    if (next === 'blocks' && this.writeOnActive()) return;
    if (persist) BlocksView.savePreference(next);
    if (next === this.view) return;
    if (next === 'blocks') {
      const sel = this.surface.getSelectionOffsets();
      this.view = 'blocks';
      this.render(false);
      this.focusIndex = this.blockIndexAt(sel.start);
      this.surface.root.hidden = true;
      this.container.hidden = false;
      this.setCurrent(this.focusIndex, focus);
    } else {
      let target = null;
      if (this.editing) {
        target = this.commitEdit({ rerender: false });
      }
      if (!target) {
        const b = this.model.blocks[this.focusIndex];
        target = b ? { start: b.start, end: b.start } : null;
      }
      this.view = 'text';
      this.editing = null;
      this.container.hidden = true;
      this.surface.root.hidden = false;
      this.list.textContent = '';
      if (target) {
        if (focus) this.surface.root.focus({ preventScroll: true });
        this.surface.setSelectionOffsets(target.start, target.end);
      }
    }
    this.updateToggle();
    this.container.dispatchEvent(new CustomEvent('te:view-change', {
      bubbles: true,
      detail: { view: this.view, editor: this.editor },
    }));
  }

  toggle() {
    this.setView(this.isActive() ? 'text' : 'blocks');
  }

  updateToggle() {
    for (const [b, view] of [[this.textButton, 'text'], [this.blocksButton, 'blocks']]) {
      if (!b) continue;
      const on = this.view === view;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.setAttribute('variant', on ? 'primary' : 'default');
    }
    this.container.dataset.view = this.view;
  }

  /** Index of the block that owns `offset` (its text or trailing separator). */
  blockIndexAt(offset) {
    return BlocksView.indexIn(this.model, offset);
  }

  onModeChange(e) {
    const mode = e.detail && e.detail.mode;
    if (mode === 'write-on') {
      if (this.isActive()) {
        this.resumeAfterWriteOn = true;
        this.setView('text', { persist: false, focus: false });
      }
    } else if (mode === 'plain' && this.resumeAfterWriteOn && this.toolsVisible()) {
      this.resumeAfterWriteOn = false;
      this.setView('blocks', { persist: false, focus: false });
    }
  }

  /** Hiding the plain-mode tools hides the view toggle: see the header. */
  onToolsChange(e) {
    if (!e.detail || e.detail.editor !== this.editor) return;
    if (!e.detail.visible) {
      if (this.isActive()) {
        this.resumeAfterWriteOn = true;
        this.setView('text', { persist: false, focus: false });
      }
    } else if (this.resumeAfterWriteOn && !this.writeOnActive()) {
      this.resumeAfterWriteOn = false;
      this.setView('blocks', { persist: false, focus: false });
    }
  }

  onSurfaceChange(change) {
    const edit = change && change.edit;
    const whole = !!edit && BlocksView.replacesWhole(change);
    // Kept drafts follow every change, in either view.
    if (edit && this.drafts.length) this.mapDrafts(edit, whole);
    let overlapped = null;
    if (this.editing && edit && !this.mapEditing(edit, whole)) {
      overlapped = this.editing;
      this.editing = null;
    }
    const hadFocus = this.container.contains(document.activeElement);
    if (overlapped) this.keepDraft(overlapped, edit, whole);
    else if (edit && this.drafts.length) this.renderDrafts();
    if (!this.isActive()) return;
    if (this.applying) {
      this.dirty = true;
      return;
    }
    // An outside change (open, undo from elsewhere): rebuild around any open
    // editor, keeping focus in the list if it was there.
    this.render(hadFocus && !this.editing && !overlapped);
    if (overlapped && hadFocus) this.draftsElement.focus({ preventScroll: true });
  }

  /** Whether a surface change replaced the whole document. */
  static replacesWhole(change) {
    const e = change.edit;
    const oldLength = change.text.length - e.insertedText.length + e.deletedLength;
    if (change.source === 'open') return true;
    // A text move rewrites a region (possibly all of it) but keeps every
    // character: it is mapped as a move, never as a replacement.
    if (e.move) return false;
    return e.start === 0 && e.deletedLength === oldLength && oldLength > 0;
  }

  /**
   * Map the range [a, b) through a text move { start, end, to } (pre-move
   * offsets) with the model's rules (crates/terraphim_alternatives
   * document.rs, "Moves"): inside the moved range it travels with the text,
   * between the range and the destination it shifts by the moved length,
   * elsewhere it is unchanged. Returns [a', b'], or null when the range
   * spans more than one of those zones. A point is the range [x, x].
   */
  static mapThroughMove(move, a, b) {
    const { start, end, to } = move;
    const len = end - start;
    const down = to > end;
    const lo = down ? end : to;
    const hi = down ? to : start;
    const inside = down ? to - end : to - start;
    const between = down ? -len : len;
    const inZone = (zs, ze) => a >= zs && (a === b ? a < ze : b <= ze);
    if (inZone(start, end)) return [a + inside, b + inside];
    if (inZone(lo, hi)) return [a + between, b + between];
    if (b <= Math.min(start, to) || a >= Math.max(end, to)) return [a, b];
    return null;
  }

  /**
   * Map the open editor's range through `edit`. Returns false when the edit
   * overlaps the block (or replaces the document), true when the editor can
   * stay open.
   */
  mapEditing(edit, whole) {
    if (whole) return false;
    const ed = this.editing;
    if (edit.move) {
      // A move (or its undo/redo) keeps the block when it lies wholly in
      // one zone of the move; otherwise the draft is kept in the notice.
      const mapped = BlocksView.mapThroughMove(edit.move, ed.start, ed.start + ed.original.length);
      if (!mapped) return false;
      ed.start = mapped[0];
      return true;
    }
    const a = edit.start;
    const b = a + edit.deletedLength;
    const s = ed.start;
    const e = s + ed.original.length;
    if (b <= s) {
      ed.start = s + edit.insertedText.length - edit.deletedLength;
      return true;
    }
    return a >= e;
  }

  mapDrafts(edit, whole) {
    const a = edit.start;
    const b = a + edit.deletedLength;
    const delta = edit.insertedText.length - edit.deletedLength;
    for (const d of this.drafts) {
      if (d.anchor === null) continue;
      if (whole) d.anchor = null;
      // A text move (Blocks move, or its undo/redo): the anchor follows its
      // block, as the model's annotations do.
      else if (edit.move) d.anchor = BlocksView.mapThroughMove(edit.move, d.anchor, d.anchor)[0];
      else if (b <= d.anchor) d.anchor += delta;
      else if (a < d.anchor) d.anchor = a;
    }
  }

  /**
   * Keep the draft of a closed editor in the notice. A draft identical to
   * what the block held (nothing typed) is not kept: nothing is lost.
   */
  keepDraft(ed, edit, whole, reason = null) {
    const value = window.EditorSurface.normaliseNewlines(ed.textarea.value);
    if (ed.isNew ? value.trim() === '' : value === ed.original) return null;
    const draft = {
      id: this.nextDraftId++,
      value,
      // The block text when editing began; Apply replaces only this.
      originalText: ed.isNew ? '' : ed.original,
      isNew: !!ed.isNew,
      index: ed.index,
      // Where to re-apply: an offset in the body, or the block index when
      // the whole document was replaced.
      anchor: whole ? null : edit ? edit.start : ed.start,
      reason: reason || (whole ? 'replaced' : 'changed'),
    };
    this.drafts.push(draft);
    this.renderDrafts();
    return draft;
  }

  renderDrafts() {
    const el = this.draftsElement;
    el.textContent = '';
    el.hidden = this.drafts.length === 0;
    for (const d of this.drafts) {
      const item = document.createElement('div');
      item.className = 'te-blocks-draft';
      item.dataset.draftId = String(d.id);
      const msg = document.createElement('p');
      msg.className = 'te-blocks-draft-message';
      const icon = document.createElement('i');
      icon.className = 'fa-solid fa-circle-info';
      icon.setAttribute('aria-hidden', 'true');
      const messages = {
        replaced: ' The document was replaced while you were editing a block. Your draft is kept here.',
        escaped: ' You closed a block editor without saving. Your draft is kept here.',
        changed: ' The block changed while you were editing it. Your draft is kept here.',
      };
      msg.append(icon, document.createTextNode(messages[d.reason] || messages.changed));
      const pre = document.createElement('pre');
      pre.className = 'te-blocks-draft-text';
      pre.textContent = d.value;
      const actions = document.createElement('div');
      actions.className = 'te-blocks-draft-actions';
      const button = (action, label) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = `te-blocks-draft-${action}`;
        b.dataset.draftAction = action;
        b.dataset.draftId = String(d.id);
        b.textContent = label;
        actions.appendChild(b);
      };
      const target = this.draftTarget(d);
      button('apply', target.mode === 'replace' ? 'Replace block' : 'Insert as new paragraph');
      actions.querySelector('[data-draft-action="apply"]').dataset.draftMode = target.mode;
      button('discard', 'Discard');
      item.append(msg, pre, actions);
      el.appendChild(item);
    }
  }

  /** Kept drafts, oldest first (copies). */
  keptDrafts() {
    return this.drafts.map((d) => ({ ...d }));
  }

  /**
   * Every unapplied draft, read-only copies: the kept drafts (oldest first)
   * then the open editor's draft if it differs from the block's text (or is
   * a non-blank new paragraph). Each is { value, originalText, anchor,
   * index, isNew }; `anchor` is a body offset, or null after a
   * whole-document replacement (use `index`).
   */
  pendingDrafts() {
    const out = this.drafts.map((d) => ({
      value: d.value,
      originalText: d.originalText,
      anchor: d.anchor,
      index: d.index,
      isNew: d.isNew,
    }));
    const ed = this.editing;
    if (ed) {
      const value = window.EditorSurface.normaliseNewlines(ed.textarea.value);
      if (ed.isNew ? value.trim() !== '' : value !== ed.original) {
        out.push({ value, originalText: ed.isNew ? '' : ed.original, anchor: ed.start, index: ed.index, isNew: !!ed.isNew });
      }
    }
    return out;
  }

  /**
   * Where a kept draft would go now: { mode: 'replace', block } when the
   * block at the draft's position still holds exactly the draft's
   * originalText, otherwise { mode: 'insert', at } with the offset where it
   * would be inserted as a new paragraph (after the block at its position,
   * or at the block index after a whole-document replacement).
   */
  draftTarget(draft, text = this.surface.getText()) {
    const model = BlocksView.parse(text);
    const blocks = model.blocks;
    if (blocks.length === 0) return { mode: 'insert', at: text.length };
    if (draft.anchor === null) {
      const b = blocks[Math.min(draft.index, blocks.length - 1)];
      if (!draft.isNew && draft.index < blocks.length && b.text === draft.originalText) return { mode: 'replace', block: b };
      return { mode: 'insert', at: draft.index < blocks.length ? blocks[draft.index].start : blocks[blocks.length - 1].end };
    }
    const at = Math.min(draft.anchor, text.length);
    if (draft.isNew) {
      const inside = blocks.find((b) => b.start < at && at < b.end);
      return { mode: 'insert', at: inside ? inside.end : at };
    }
    const b = blocks[BlocksView.indexIn(model, at)];
    if (b.text === draft.originalText) return { mode: 'replace', block: b };
    return { mode: 'insert', at: b.end };
  }

  /**
   * Re-apply a kept draft (see draftTarget): replace the block if it still
   * holds the draft's original text, otherwise insert the draft as a new
   * paragraph. Never replaces unrelated text. One undo step. Returns
   * 'replace' or 'insert', or null when there is no such draft.
   */
  applyDraft(id) {
    const draft = this.drafts.find((d) => d.id === id);
    if (!draft) return null;
    if (this.editing) this.commitEdit({ rerender: false });
    this.drafts = this.drafts.filter((d) => d !== draft);
    this.renderDrafts();
    const target = this.draftTarget(draft);
    let caret;
    this.applying = true;
    try {
      if (target.mode === 'replace') {
        const b = target.block;
        const d = window.EditorSurface.diff(b.text, draft.value);
        caret = b.start;
        if (d) {
          this.surface.replaceRange(b.start + d.start, b.start + d.start + d.deletedLength, d.insertedText, {
            source: 'blocks',
            selectStart: b.start,
          });
        }
      } else {
        caret = this.insertParagraph(target.at, draft.value);
      }
    } finally {
      this.applying = false;
    }
    if (this.isActive()) {
      this.render(false);
      this.setCurrent(this.blockIndexAt(caret), true);
    }
    return target.mode;
  }

  /** Drop a kept draft. */
  discardDraft(id) {
    const before = this.drafts.length;
    this.drafts = this.drafts.filter((d) => d.id !== id);
    this.renderDrafts();
    if (this.isActive() && this.drafts.length === 0 && before) this.setCurrent(this.focusIndex, true);
    return this.drafts.length < before;
  }

  /**
   * Insert `value` as a paragraph at `at`, separated from its neighbours by
   * one blank line. Returns the offset where the paragraph starts.
   */
  insertParagraph(at, value) {
    const text = this.surface.getText();
    const before = text.slice(0, at);
    const after = text.slice(at);
    const pre = at === 0 || before.endsWith('\n\n') ? '' : before.endsWith('\n') ? '\n' : '\n\n';
    const post = after.trim() === '' || after.startsWith('\n\n') ? '' : after.startsWith('\n') ? '\n' : '\n\n';
    this.surface.replaceRange(at, at, pre + value + post, { source: 'blocks', selectStart: at + pre.length });
    return at + pre.length;
  }

  // ---------------------------------------------------------------------
  // Editing
  // ---------------------------------------------------------------------

  /** Open the inline editor for block `index`. Returns the textarea. */
  editBlock(index) {
    if (!this.isActive()) return null;
    if (this.editing) this.commitEdit();
    const cards = this.cards();
    const block = this.model.blocks[index];
    const card = cards[index];
    if (!block || !card) return null;
    this.setCurrent(index, false);
    return this.openEditor(card, { index, start: block.start, original: block.text, isNew: false });
  }

  openEditor(card, edit) {
    const ta = document.createElement('textarea');
    ta.className = 'te-block-editor';
    ta.value = edit.original;
    ta.spellcheck = false;
    ta.setAttribute('aria-label', 'Edit block Markdown. Ctrl+Enter to save, Escape to cancel.');
    ta.rows = Math.max(2, edit.original.split('\n').length + 1);
    const body = card.querySelector('.te-block-body');
    if (body) body.hidden = true;
    card.classList.add('te-block-editing');
    card.appendChild(ta);
    this.editing = { ...edit, card, textarea: ta, selection: null };
    this.listen(ta, 'input', () => {
      ta.rows = Math.max(2, ta.value.split('\n').length + 1);
    });
    // While the textarea has focus its selection is the document selection,
    // which an outside surface edit moves; remember it so render() can put
    // it back.
    const remember = () => {
      if (this.editing && this.editing.textarea === ta && document.activeElement === ta) {
        this.editing.selection = [ta.selectionStart, ta.selectionEnd, ta.selectionDirection];
      }
    };
    this.listen(document, 'selectionchange', remember);
    this.listen(ta, 'select', remember);
    this.listen(ta, 'keyup', remember);
    this.listen(ta, 'blur', (e) => {
      // Focus moving somewhere specific (another card, a toolbar button)
      // must not be pulled back into the list by the commit.
      if (this.editing && this.editing.textarea === ta) this.commitEdit({ focus: !e.relatedTarget });
    });
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(ta.value.length, ta.value.length);
    return ta;
  }

  /**
   * Apply the open editor's text to the body through the surface and close
   * it. Returns the body selection matching the textarea selection, or null
   * when nothing was being edited.
   */
  commitEdit({ rerender = true, focus } = {}) {
    const edit = this.editing;
    if (!edit) return null;
    this.editing = null;
    const ta = edit.textarea;
    const value = window.EditorSurface.normaliseNewlines(ta.value);
    const selStart = Math.min(ta.selectionStart, value.length);
    const selEnd = Math.min(ta.selectionEnd, value.length);
    let base = edit.start;
    this.applying = true;
    try {
      const text = this.surface.getText();
      const stale = edit.isNew
        ? edit.start > text.length
        : text.slice(edit.start, edit.start + edit.original.length) !== edit.original;
      if (stale) {
        // The block is no longer where the editor thought: keep the draft.
        this.keepDraft(edit, null, false);
      } else if (edit.isNew) {
        if (value.trim() !== '') {
          base = this.insertParagraph(edit.start, value);
          this.surface.setSelectionOffsets(base + selStart, base + selEnd);
          this.focusIndex = edit.index;
        }
      } else if (value !== edit.original) {
        const d = window.EditorSurface.diff(edit.original, value);
        const from = edit.start + d.start;
        this.surface.replaceRange(from, from + d.deletedLength, d.insertedText, {
          source: 'blocks',
          selectStart: edit.start + selStart,
          selectEnd: edit.start + selEnd,
        });
      }
    } finally {
      this.applying = false;
    }
    if (rerender && this.isActive()) {
      const hadFocus = focus === undefined ? this.container.contains(document.activeElement) || document.activeElement === document.body : focus;
      this.render(false);
      if (this.model.blocks.length) {
        this.focusIndex = this.blockIndexAt(base + selStart);
        this.setCurrent(this.focusIndex, hadFocus);
      }
    }
    return { start: base + selStart, end: base + selEnd };
  }

  /**
   * Close the open editor without applying it (Escape). Escape never
   * discards typed text: a draft that differs from the block (or a non-blank
   * new paragraph) moves to the kept-drafts notice, announced through its
   * aria-live region, where "Replace block" / "Insert as new paragraph"
   * applies it and "Discard" drops it. Focus returns to the card. Returns
   * the kept draft, or null when nothing was typed.
   */
  cancelEdit() {
    const edit = this.editing;
    if (!edit) return null;
    this.editing = null;
    const kept = this.keepDraft(edit, null, false, 'escaped');
    this.render(false);
    this.setCurrent(edit.index, true);
    return kept;
  }

  /** Open an editor for a new paragraph after block `index` (-1: at the top). */
  insertBlockAfter(index) {
    if (!this.isActive()) return null;
    if (this.editing) this.commitEdit();
    const blocks = this.model.blocks;
    const text = this.surface.getText();
    let at;
    if (index + 1 < blocks.length) at = blocks[index + 1].start;
    else if (blocks.length) at = blocks[blocks.length - 1].end;
    else at = text.length;
    const card = document.createElement('div');
    card.className = 'te-block te-block-paragraph te-block-new';
    card.setAttribute('role', 'listitem');
    card.dataset.index = String(index + 1);
    const cards = this.cards();
    const ref = cards[index + 1] || null;
    if (ref) this.list.insertBefore(card, ref);
    else this.list.appendChild(card);
    const empty = this.list.querySelector('.te-blocks-empty');
    if (empty) empty.remove();
    return this.openEditor(card, { index: index + 1, start: at, original: '', isNew: true });
  }

  /** Delete block `index` together with one adjoining separator. */
  deleteBlock(index) {
    const blocks = this.model.blocks;
    const b = blocks[index];
    if (!b) return;
    let from = b.start;
    let to = b.end + b.sep.length;
    if (index === blocks.length - 1) {
      // Keep the document's trailing text; take the separator before instead.
      to = b.end;
      if (index > 0) from = blocks[index - 1].end;
    }
    this.apply(from, to, '');
    this.focusIndex = Math.max(0, Math.min(index, this.model.blocks.length - 1));
    this.setCurrent(this.focusIndex, true);
  }

  /**
   * Plan swapping blocks j and j + 1 of `model` (parsed from `text`) by
   * moving block `index` (j for down, j + 1 for up). Pure: returns
   * { range: [start, end, to], fixes, text, movedStart } where `fixes` are
   * whitespace edits [{ at, from, to }] in the post-move text (later offset
   * first) that put the separators back in place, `text` the predicted
   * result and `movedStart` where the moved block starts; { error } when
   * the swapped blocks would not parse back as the same blocks; or null
   * when there is no neighbour in that direction.
   */
  static planMove(model, text, index, dir) {
    const blocks = model.blocks;
    const j = dir < 0 ? index - 1 : index;
    const p = blocks[j];
    const q = blocks[j + 1];
    if (!p || !q) return null;
    const r = blocks[j + 2];
    const pairEnd = r ? r.start : text.length;
    const range = dir < 0 ? [q.start, pairEnd, p.start] : [p.start, q.start, pairEnd];
    // A pure move gives Q.text Q.sep P.text P.sep; the separators are put
    // back where they were: P.sep between the pair, Q.sep after it.
    const blank = (sep) => /\n[ \t\r]*\n/.test(sep);
    const between = blank(p.sep) ? p.sep : '\n\n';
    const after = !r || blank(q.sep) ? q.sep : '\n\n';
    const base = p.start;
    const predicted = text.slice(0, base) + q.text + between + p.text + after + text.slice(pairEnd);
    const expected = blocks.map((b) => b.text);
    expected[j] = q.text;
    expected[j + 1] = p.text;
    const got = BlocksView.parse(predicted);
    if (got.lead !== model.lead || got.blocks.length !== expected.length || got.blocks.some((b, k) => b.text !== expected[k])) {
      return { error: 'Block not moved: it would merge with the block next to it.' };
    }
    const fixes = [];
    const sepAfter = base + q.text.length + q.sep.length + p.text.length;
    if (p.sep !== after) fixes.push({ at: sepAfter, from: p.sep, to: after });
    if (q.sep !== between) fixes.push({ at: base + q.text.length, from: q.sep, to: between });
    const movedStart = dir < 0 ? base : base + q.text.length + between.length;
    return { range, fixes, text: predicted, movedStart };
  }

  /**
   * Move block `index` one place 'up' or 'down' (see "Moving blocks" in the
   * header). Returns true when it moved; false at the first or last block,
   * when there is no such block, or when the move is refused (the message
   * is then in the notice region and nothing changed). `options.focusAction`
   * puts focus on that action button of the moved card instead of the card.
   */
  moveBlock(index, direction, { focusAction = null } = {}) {
    if (this.destroyed) return false;
    const dir = direction === 'up' || direction < 0 ? -1 : 1;
    let i = index;
    if (this.editing) {
      // Apply (or keep, if its block changed) the open draft first; that
      // can add or remove blocks before the one being moved.
      const ed = this.editing;
      const before = BlocksView.parse(this.surface.getText()).blocks.length;
      this.commitEdit({ rerender: false });
      const after = BlocksView.parse(this.surface.getText()).blocks.length;
      if (ed.index < i || (ed.isNew && ed.index <= i)) i += after - before;
    }
    const text = this.surface.getText();
    this.model = BlocksView.parse(text);
    const count = this.model.blocks.length;
    const target = i + dir;
    const plan = i >= 0 && i < count ? BlocksView.planMove(this.model, text, i, dir) : null;
    if (!plan) {
      // First block up, last block down, or no such block: a no-op.
      if (this.isActive()) {
        this.render(false);
        if (count) this.setCurrent(Math.max(0, Math.min(i, count - 1)), true);
      }
      return false;
    }
    let refused = plan.error || this.fixUpBlocker(plan);
    if (!refused) {
      let steps = 0;
      this.applying = true;
      try {
        // The model validates first: a refusal throws and changes nothing.
        const moved = this.editor.moveRange(...plan.range);
        if (moved.moved) steps += 1;
        for (const fix of plan.fixes) {
          const d = window.EditorSurface.diff(fix.from, fix.to);
          this.surface.replaceRange(fix.at + d.start, fix.at + d.start + d.deletedLength, d.insertedText, {
            source: 'blocks',
            selectStart: plan.movedStart,
          });
          steps += 1;
        }
        // The move and its separator fix-ups are one undo step.
        if (steps > 1) this.surface.squashHistory(steps, 'move');
        this.surface.setSelectionOffsets(plan.movedStart, plan.movedStart);
      } catch (err) {
        refused = 'Block not moved: ' + String(err && err.message ? err.message : err);
        if (steps > 0) {
          // A fix-up failed after the move: take back what was recorded.
          if (steps > 1) this.surface.squashHistory(steps, 'move');
          this.surface.undo();
        }
      } finally {
        this.applying = false;
      }
    }
    this.showNotice(refused);
    if (this.isActive()) {
      this.render(false);
      const at = refused ? i : target;
      const card = this.cards()[at];
      const button = focusAction && card ? card.querySelector(`.te-block-action[data-action="${focusAction}"]`) : null;
      this.setCurrent(at, !(button && !button.hidden));
      if (button && !button.hidden) button.focus();
    }
    return !refused;
  }

  /**
   * The separator fix-ups of `plan` are ordinary edits, which the model
   * would apply to any span or ghost they touch (trimming or growing it)
   * instead of refusing. So before anything changes, every annotation is
   * mapped through the planned move and each fix-up is checked against it:
   * an insertion strictly inside an item, or a deletion overlapping one,
   * refuses the whole move. Returns the refusal message naming the item, or
   * null. Items the move itself would split are left to moveRange, which
   * refuses them by name.
   */
  fixUpBlocker(plan) {
    if (!plan.fixes.length || typeof this.editor.annotations !== 'function') return null;
    let annotations;
    try {
      annotations = this.editor.annotations();
    } catch (err) {
      return null;
    }
    const [start, end, to] = plan.range;
    const move = { start, end, to };
    const items = [...(annotations.spans || []), ...(annotations.ghosts || [])];
    for (const item of items) {
      const a = item.anchor.start;
      const b = item.anchor.end;
      let mapped = BlocksView.mapThroughMove(move, a, b);
      if (!mapped) {
        // A ghost holding both the range and the destination keeps its
        // extent; anything else straddles and moveRange refuses it.
        if (a <= Math.min(start, to) && b >= Math.max(end, to)) mapped = [a, b];
        else continue;
      }
      const [gs, ge] = mapped;
      for (const fix of plan.fixes) {
        const d = window.EditorSurface.diff(fix.from, fix.to);
        const at = fix.at + d.start;
        const touches = d.deletedLength === 0 ? gs < at && at < ge : at < ge && at + d.deletedLength > gs;
        if (touches) {
          return `Block not moved: restoring the blank line between the blocks would change the text of "${item.id}"; move whole spans and ghosts only.`;
        }
      }
    }
    return null;
  }

  /** Show `message` in the notice region, or hide it (null). */
  showNotice(message) {
    if (!this.noticeElement) return;
    this.noticeElement.hidden = !message;
    this.noticeDismiss.tabIndex = message ? 0 : -1;
    this.noticeText.textContent = message || '';
  }

  apply(from, to, insert) {
    if (this.editing) this.commitEdit({ rerender: false });
    this.applying = true;
    try {
      this.surface.replaceRange(from, to, insert, { source: 'blocks', selectStart: from });
    } finally {
      this.applying = false;
    }
    this.render(false);
  }

  undo() {
    if (this.editing) this.commitEdit({ rerender: false });
    this.applying = true;
    let done;
    try {
      done = this.surface.undo();
    } finally {
      this.applying = false;
    }
    if (done) this.afterHistory();
    return done;
  }

  redo() {
    if (this.editing) this.commitEdit({ rerender: false });
    this.applying = true;
    let done;
    try {
      done = this.surface.redo();
    } finally {
      this.applying = false;
    }
    if (done) this.afterHistory();
    return done;
  }

  afterHistory() {
    // The surface put its caret on the restored edit; follow it.
    const { start } = this.surface.getSelectionOffsets();
    this.render(false);
    this.focusIndex = this.blockIndexAt(start);
    this.setCurrent(this.focusIndex, true);
  }

  onClick(e) {
    const button = e.target.closest('.te-block-action');
    if (!button) return;
    const card = button.closest('.te-block');
    const index = Number(card.dataset.index);
    switch (button.dataset.action) {
      case 'edit': this.editBlock(index); break;
      case 'insert': this.insertBlockAfter(index); break;
      case 'up': this.moveBlock(index, 'up', { focusAction: 'up' }); break;
      case 'down': this.moveBlock(index, 'down', { focusAction: 'down' }); break;
      case 'delete': this.deleteBlock(index); break;
      default: break;
    }
  }

  onKeyDown(e) {
    if (e.isComposing) return;
    const mod = e.ctrlKey || e.metaKey;
    if (e.target.classList && e.target.classList.contains('te-block-editor')) {
      if (e.key === 'Escape') {
        e.preventDefault();
        this.cancelEdit();
      } else if (e.key === 'Enter' && mod) {
        e.preventDefault();
        this.commitEdit();
      }
      return;
    }
    const card = e.target.closest && e.target.closest('.te-block');
    if (card && e.key === 'Escape' && e.target.classList && e.target.classList.contains('te-block-action')) {
      e.preventDefault();
      card.focus();
      return;
    }
    if (!card || e.target !== card) return;
    const index = Number(card.dataset.index);
    const key = e.key;
    if (e.altKey && !mod && !e.shiftKey && (key === 'ArrowUp' || key === 'ArrowDown')) {
      e.preventDefault();
      this.moveBlock(index, key === 'ArrowUp' ? 'up' : 'down');
      return;
    }
    if (e.altKey) return;
    if (mod) {
      const k = key.toLowerCase();
      if (k === 'z' && !e.shiftKey) {
        e.preventDefault();
        this.undo();
      } else if ((k === 'z' && e.shiftKey) || (k === 'y' && !e.shiftKey)) {
        e.preventDefault();
        this.redo();
      }
      return;
    }
    switch (key) {
      case 'ArrowDown':
        e.preventDefault();
        this.setCurrent(index + 1);
        break;
      case 'ArrowUp':
        e.preventDefault();
        this.setCurrent(index - 1);
        break;
      case 'Home':
        e.preventDefault();
        this.setCurrent(0);
        break;
      case 'End':
        e.preventDefault();
        this.setCurrent(this.model.blocks.length - 1);
        break;
      case 'Enter':
        e.preventDefault();
        if (e.shiftKey) this.insertBlockAfter(index);
        else this.editBlock(index);
        break;
      case 'F2':
        e.preventDefault();
        this.editBlock(index);
        break;
      case 'Delete':
        e.preventDefault();
        this.deleteBlock(index);
        break;
      default:
        break;
    }
  }

  // ---------------------------------------------------------------------
  // Lifecycle
  // ---------------------------------------------------------------------

  /**
   * Remove the view's DOM and subscription and show the surface again. The
   * document is never changed here: pending drafts (see pendingDrafts) are
   * reported in one bubbling `te:blocks-drafts` event from the surface root,
   * dispatched before the DOM goes, and returned. No event when there are
   * none; the return value is then []. A second call returns [].
   */
  destroy() {
    if (this.destroyed) return [];
    const drafts = this.pendingDrafts();
    if (drafts.length && this.surface.root) {
      this.surface.root.dispatchEvent(new CustomEvent('te:blocks-drafts', {
        bubbles: true,
        detail: { editor: this.editor, drafts: drafts.map((d) => ({ ...d })) },
      }));
    }
    this.destroyed = true;
    this.editing = null;
    this.offChange();
    if (this.surface.root) this.surface.root.hidden = false;
    this.container.remove();
    this.draftsElement.remove();
    if (this.toggleGroup) this.toggleGroup.remove();
    if (this.toggleDivider) this.toggleDivider.remove();
    this.drafts = [];
    return drafts;
  }
}

window.BlocksView = BlocksView;
window.BLOCKS_VIEW_STORAGE_KEY = BLOCKS_VIEW_STORAGE_KEY;
</script>
    <!-- The alternatives side panel (issue #10): after the selection menu
         it registers with, before editor.js, which instantiates it. -->
    <script>/*
 * The alternatives side panel (issue #10; spec R-4.1 to R-4.6, R-7.3)
 * ====================================================================
 *
 * TeAlternativesPanel (`editor.altPanel`) is the left-hand panel that lists
 * the alternatives of one span, one per line, and lets the author add, edit,
 * delete, reorder and choose them. Full design notes:
 * docs/design/alternatives-panel.md
 *
 *   editor.altPanel.open()                    // span at the caret (or the word there)
 *   editor.altPanel.open({ spanId })          // a given span
 *   editor.altPanel.open({ start, end, kind })  // text without a span yet (pending)
 *   editor.altPanel.toggle() / close() / isOpen()
 *   editor.altPanel.setTab('word' | 'sentence' | 'paragraph')
 *   editor.altPanel.addAlternative(text, { source: 'human' | 'ai' })
 *   editor.altPanel.editAlternative(index, text)
 *   editor.altPanel.removeAlternative(index)
 *   editor.altPanel.moveAlternative(from, to)
 *   editor.altPanel.setActiveIndex(index)
 *   editor.altPanel.lines()                   // [{ text, source, active }]
 *
 * Opening
 * -------
 * - The `●●●` chrome control (`te:open-panel` { panel: 'alternatives' })
 *   toggles the panel and moves focus into it.
 * - "Alternatives for selection" (Ctrl+Shift+A, registered in the R-7.3
 *   selection menu) opens it on the selection: an existing span when the
 *   selection lies inside one, otherwise the trimmed selection as a pending
 *   span whose kind is inferred from the text. The menu item is offered
 *   for selections only; Ctrl+Shift+A with a collapsed caret (handled
 *   here) opens on the span at the caret, or the word there.
 * - A dot click (`te:dot`) opens or retargets the panel on that span without
 *   moving focus and without cancelling the event (issue #9 jumps to the
 *   alternative as its default action).
 * - The panel belongs to Write_On mode. Ctrl+Shift+A in plain mode turns
 *   Write_On mode on first; leaving Write_On mode closes the panel.
 *
 * Which span is shown
 * -------------------
 * Spans never overlap, so at most one span contains the caret. The tabs
 * choose the granularity: the panel shows the span at the reference point
 * (the caret when opened, or the shown span) if its kind matches the tab;
 * otherwise it offers the word, sentence or paragraph around that point as
 * a *pending* span: its text is listed as the original line and the first
 * alternative typed creates the span and that alternative in one model call
 * (one undo step). A pending range that would overlap an existing span is
 * refused with a message naming the tab to use instead. An inert span (only
 * its original) is never created: it would draw nothing and be detached,
 * with a warning, by the first keystroke inside it (R-2.7).
 * While the panel is open and the surface has focus, moving the caret into
 * another span retargets the panel; moving into plain text does not.
 *
 * Lines
 * -----
 * One `<input>` per alternative (documented choice: inputs give native,
 * accessible single-line editing; Enter, arrows and Escape are handled
 * here). Line 0 is the original and is read-only. A line is committed on
 * Enter, when it loses focus, when the tab changes and when the panel
 * closes (Escape included): changed text edits the alternative, empty text
 * deletes it, and text in the empty last line is added (whitespace-only is
 * ignored). Typed text is never silently lost: destroy() does not edit the
 * document, it reports uncommitted text as `te:alt-drafts` and returns it.
 * The last line is always empty, and a new alternative is typed there live
 * (issue #106, R-4.3, video 1:24-1:30): the first character adds it and
 * makes it active, so the document shows it at once with a new dot, and
 * each further keystroke updates the document. Enter (which then offers a
 * fresh empty line), leaving the line or closing the panel keeps it as ONE
 * undo step; Escape cancels it and brings back the previous active
 * alternative and its text. Each line has a leading glyph from the `source`
 * field: a dim dot for the original and the author's lines, a robot
 * (FontAwesome `fa-robot`) for AI lines; the active line is brighter with a
 * lavender glyph (R-4.4).
 *
 * Keyboard (R-4.5)
 * ----------------
 * ArrowUp/ArrowDown on a line commit it and make the previous/next line the
 * active alternative, with a live document update; focus follows. ArrowDown
 * on the last alternative goes to the empty line. Alt+ArrowUp/Alt+ArrowDown
 * reorder the focused line (never above the original). Ctrl/Cmd+Z and
 * Ctrl/Cmd+Shift+Z / Ctrl+Y undo and redo the document while the focused
 * line has no uncommitted typing. Tabs: Left/Right/Home/End (automatic
 * activation). Escape closes (cancelling a new alternative being typed) and
 * returns focus to what last opened or showed the panel: the surface with
 * its selection when that was the text, a shortcut, the menu, a dot or
 * Ctrl+Shift+G (even with the panel first opened from `●●●`), so Ctrl+Z
 * works straight away; the chrome control when it was `●●●`.
 *
 * Model first
 * -----------
 * Every change goes through `editor.alternativeOp()` (src/document.rs,
 * `alt_*` exports): the model changes first and the surface applies the
 * resulting text edit, if any, as ONE undo step that replays the span
 * snapshot on undo/redo. Making a line active goes through
 * `editor.swapAlternative()` (issue #9, its own `swap` history step).
 *
 * Listeners use the editor's AbortController signal plus the panel's own;
 * `destroy()` removes the DOM and every listener.
 */

let teAltPanelInstances = 0;

const TE_ALT_KINDS = ['word', 'sentence', 'paragraph'];
const TE_ALT_KIND_LABEL = { word: 'Word', sentence: 'Sentence', paragraph: 'Paragraph' };

/** Shared Rust targeting adapters, exposed for tests as TeAlternativesPanel.text. */
const teAltText = {
  binding(api, name) {
    if (!api || typeof api[name] !== 'function') {
      throw new Error('Shared text WASM bindings are unavailable. Reload with the current editor WASM package.');
    }
    return api[name];
  },

  /** [start, end) of the word at `pos`, or null. */
  wordAt(text, pos, api = window.wasmBindings) {
    return teAltText.rangeFor('word', text, pos, api);
  },

  /** Trim whitespace and a leading Markdown heading or list marker. */
  trimRange(text, start, end) {
    let s = start;
    let e = end;
    while (s < e && /\s/.test(text[s])) s += 1;
    const lead = /^(#{1,6}\s+|[-*+]\s+|\d+[.)]\s+|>\s*)/.exec(text.slice(s, e));
    if (lead) s += lead[0].length;
    while (e > s && /\s/.test(text[e - 1])) e -= 1;
    return e > s ? { start: s, end: e } : null;
  },

  /** The mdast prose paragraph/title around `pos`, in original UTF-16. */
  paragraphAt(text, pos, api = window.wasmBindings) {
    return teAltText.rangeFor('paragraph', text, pos, api);
  },

  /**
   * Shared Unicode/Markdown sentence policy, not a second JavaScript parser.
   */
  sentenceAt(text, pos, api = window.wasmBindings) {
    return teAltText.rangeFor('sentence', text, pos, api);
  },

  rangeFor(kind, text, pos, api = window.wasmBindings) {
    if (!Number.isInteger(pos) || pos < 0 || pos > text.length) throw new Error('Caret offset is outside the current text.');
    return teAltText.binding(api, 'text_range_at')(text, pos, kind);
  },

  /**
   * Kind of a selected text: several sentences or lines -> paragraph; a
   * phrase of up to four words without closing punctuation -> word;
   * anything else -> sentence.
   */
  inferKind(text, api = window.wasmBindings) {
    return teAltText.binding(api, 'text_infer_kind')(text);
  },
};

class TeAlternativesPanel {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.instance = ++teAltPanelInstances;
    this.destroyed = false;
    this.opened = false;
    this.tab = 'word';
    // { spanId } | { pending: { kind, start, end, text } } | { message } | null
    this.target = null;
    // Body offset the tabs resolve around.
    this.reference = 0;
    // Last span shown: { id, kind, start, end } (to follow it through undo).
    this.lastSpan = null;
    this.span = null;
    this.returnFocus = null;
    this.frame = 0;
    this.retargetFrame = 0;
    // The new alternative being typed in the add line (issue #106), or null:
    // { spanId, index, base } where base is the surface history entry from
    // before it began (so its steps can be folded into one, or undone).
    this.live = null;
    // Set while a live addition is being changed: the model step moves the
    // surface selection, which blurs the line being typed in, and that blur
    // must not end the addition.
    this.liveBusy = false;
    // Diagnostics for tests.
    this.renderCount = 0;

    this.abortController = new AbortController();
    const signal = this.abortController.signal;
    this.signal = signal;
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal });
    }

    this.build();

    document.addEventListener('te:open-panel', (e) => {
      const d = e.detail || {};
      if (d.panel !== 'alternatives' || (d.editor && d.editor !== this.editor)) return;
      this.returnFocus = this.chromeControl();
      this.toggle({ focus: true, fromControl: true });
    }, { signal });
    document.addEventListener('te:dot', (e) => {
      const d = e.detail || {};
      if (d.editor && d.editor !== this.editor) return;
      if (!d.spanId) return;
      // Not cancelled: the default action (issue #9) still jumps to the
      // alternative; the panel only shows the span, keeping focus where it is.
      // A dot is in the text, so Escape goes back to the text, where the
      // jump leaves the caret (no saved selection), even when focus is in a
      // panel line opened from `●●●`.
      this.open({ spanId: String(d.spanId) }, { focus: false, fromControl: true });
      this.returnFocus = this.surface.root;
      this.savedSelection = null;
    }, { signal });
    document.addEventListener('te:mode-change', (e) => {
      const d = e.detail || {};
      if (d.editor && d.editor !== this.editor) return;
      if (d.mode !== 'write-on') this.close({ restoreFocus: false });
    }, { signal });
    document.addEventListener('selectionchange', () => this.onSelectionChange(), { signal });
    this.offChange = this.surface.onChange(() => this.scheduleRefresh());
    this.surface.root.addEventListener('keydown', (e) => this.onSurfaceKeyDown(e), { signal });

    this.registerMenuItem();
  }

  static get text() {
    return teAltText;
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  build() {
    const signal = this.signal;
    const id = (name) => `te-alt-${this.instance}-${name}`;
    const root = document.createElement('aside');
    root.className = 'te-alt-panel';
    root.id = id('panel');
    root.hidden = true;
    root.setAttribute('aria-label', 'Alternatives');

    const tablist = document.createElement('div');
    tablist.className = 'te-alt-tabs';
    tablist.setAttribute('role', 'tablist');
    tablist.setAttribute('aria-label', 'Granularity');
    this.tabs = {};
    for (const kind of TE_ALT_KINDS) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'te-alt-tab';
      tab.id = id(`tab-${kind}`);
      tab.dataset.kind = kind;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-controls', id('tabpanel'));
      tab.textContent = TE_ALT_KIND_LABEL[kind];
      tab.addEventListener('click', () => this.setTab(kind, { focusTab: true }), { signal });
      tablist.appendChild(tab);
      this.tabs[kind] = tab;
    }
    tablist.addEventListener('keydown', (e) => this.onTabKeyDown(e), { signal });

    const tabpanel = document.createElement('div');
    tabpanel.className = 'te-alt-tabpanel';
    tabpanel.id = id('tabpanel');
    tabpanel.setAttribute('role', 'tabpanel');

    const status = document.createElement('p');
    status.className = 'te-alt-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');

    const list = document.createElement('ul');
    list.className = 'te-alt-list';
    list.setAttribute('aria-label', 'Alternatives, one per line');
    list.addEventListener('keydown', (e) => this.onLineKeyDown(e), { signal });
    list.addEventListener('focusout', (e) => this.onLineBlur(e), { signal });
    list.addEventListener('input', (e) => this.onLineInput(e), { signal });
    list.addEventListener('compositionend', (e) => this.onLineInput(e), { signal });
    list.addEventListener('click', (e) => this.onListClick(e), { signal });

    const hint = document.createElement('p');
    hint.className = 'te-alt-hint';
    hint.textContent = '↑↓ choose · Alt+↑↓ reorder · Enter adds · Esc closes';

    tabpanel.append(status, list, hint);
    root.append(tablist, tabpanel);
    root.addEventListener('keydown', (e) => this.onPanelKeyDown(e), { signal });

    this.root = root;
    this.tablist = tablist;
    this.tabpanel = tabpanel;
    this.statusEl = status;
    this.list = list;
    this.ids = { panel: root.id };
    // The editor's own root (#app on the full page, the embed container
    // otherwise, issue #77).
    const host = this.editor.root || (this.editor.input && this.editor.input.closest('.te-app')) || document.body;
    host.appendChild(root);
    this.host = host;
  }

  chromeControl() {
    const chrome = this.editor.chrome;
    return chrome && chrome.root ? chrome.root.querySelector('[data-control="alternatives"]') : null;
  }

  // ---------------------------------------------------------------------
  // Model access
  // ---------------------------------------------------------------------

  modelAvailable() {
    const api = this.editor.documentApi ? this.editor.documentApi() : null;
    return !!(api && typeof api.alt_create_span === 'function' && typeof api.document_annotations === 'function');
  }

  liveSpans() {
    if (!this.modelAvailable()) return [];
    const ann = this.editor.annotations();
    return (ann && Array.isArray(ann.spans)) ? ann.spans : [];
  }

  /** The live span containing (or touching) [start, end], if any. */
  static spanAround(spans, start, end) {
    return spans.find((s) => s.anchor.start <= start && end <= s.anchor.end) || null;
  }

  // ---------------------------------------------------------------------
  // Opening and closing
  // ---------------------------------------------------------------------

  isOpen() {
    return this.opened;
  }

  isWriteOn() {
    const chrome = this.editor.chrome;
    if (chrome && typeof chrome.isWriteOn === 'function') return chrome.isWriteOn();
    return document.body.dataset.mode === 'write-on';
  }

  ensureWriteOn() {
    if (this.isWriteOn()) return;
    const chrome = this.editor.chrome;
    if (chrome && typeof chrome.setMode === 'function') chrome.setMode('write-on');
  }

  toggle(options = {}) {
    if (this.opened) {
      this.close({ restoreFocus: true });
      return false;
    }
    this.open(undefined, options);
    return true;
  }

  /**
   * Open (or retarget) the panel. `where`: undefined (the caret), { spanId },
   * or { start, end, kind? } (a range, pending unless a span holds it).
   * Options: focus (default true) moves focus to the active line.
   */
  open(where, options = {}) {
    if (this.destroyed || !this.modelAvailable()) return false;
    this.ensureWriteOn();
    const wasOpen = this.opened;
    if (!wasOpen) this.savedSelection = this.surface.getSelectionOffsets();
    if (!options.fromControl) {
      // Opened, or shown again, from anywhere but the panel itself: from
      // the text (a shortcut, the menu, a dot, Ctrl+Shift+G showing a span),
      // Escape goes back to the text with this selection, so Ctrl+Z works
      // straight away, even when the panel was first opened from the `●●●`
      // control; from a chrome control, back to that control.
      const active = document.activeElement;
      if (!wasOpen || !(active && this.root.contains(active))) {
        const chromeRoot = this.editor.chrome && this.editor.chrome.root;
        const fromChrome = !!active && !!chromeRoot && chromeRoot.contains(active);
        this.returnFocus = fromChrome ? active : this.surface.root;
        if (!fromChrome) this.savedSelection = this.surface.getSelectionOffsets();
      }
    }
    this.resolve(where);
    this.opened = true;
    this.root.hidden = false;
    this.host.classList.add('te-alt-open');
    const control = this.chromeControl();
    if (control) {
      control.setAttribute('aria-expanded', 'true');
      control.setAttribute('aria-controls', this.root.id);
    }
    this.render();
    if (options.focus !== false) this.focusLine(this.activeLineIndex());
    return true;
  }

  close({ restoreFocus = true } = {}) {
    if (!this.opened) return;
    // Typed text is never silently lost: the focused line is committed
    // (Escape, Ctrl+Shift+A, the chrome control, leaving Write_On mode), and
    // a new alternative being typed is kept as one undo step.
    this.finishLive();
    this.commitFocused();
    this.opened = false;
    this.root.hidden = true;
    this.host.classList.remove('te-alt-open');
    const control = this.chromeControl();
    if (control) control.setAttribute('aria-expanded', 'false');
    const back = this.returnFocus;
    this.returnFocus = null;
    if (!restoreFocus) return;
    if (!back || back === this.surface.root || !back.isConnected) {
      this.surface.focus();
      const sel = this.savedSelection;
      if (sel) this.surface.setSelectionOffsets(sel.start, sel.end);
    } else if (typeof back.focus === 'function') {
      back.focus();
    }
  }

  /** Ctrl+Shift+A / the menu item: open on the selection. */
  openForSelection(ctx) {
    this.returnFocus = this.surface.root;
    this.savedSelection = ctx && ctx.selection ? ctx.selection : this.surface.getSelectionOffsets();
    if (!ctx || ctx.collapsed) return this.open(undefined, { fromControl: true });
    const text = this.surface.getText();
    const range = teAltText.trimRange(text, ctx.start, ctx.end) || { start: ctx.start, end: ctx.end };
    return this.open({ start: range.start, end: range.end }, { fromControl: true });
  }

  /**
   * Ctrl+Shift+A with a collapsed caret (the menu item covers selections):
   * open on the span or word at the caret. Always cancelled while the model
   * is available, so the browser's own Ctrl+Shift+A (tab search in Chrome)
   * does not fire from the editor.
   */
  onSurfaceKeyDown(e) {
    if (this.destroyed || e.defaultPrevented || e.isComposing) return;
    if (typeof teShortcutMatches !== 'function' || !teShortcutMatches(e, 'ctrl+shift+a')) return;
    if (!this.modelAvailable()) return;
    const sel = this.surface.getSelectionOffsets();
    if (sel.start !== sel.end && this.editor.selectionMenu) return;
    e.preventDefault();
    this.openForSelection({ collapsed: sel.start === sel.end, start: sel.start, end: sel.end, selection: sel });
  }

  registerMenuItem() {
    const menu = this.editor.selectionMenu;
    if (!menu || typeof menu.register !== 'function') return;
    this.offMenu = menu.register({
      id: 'alternatives',
      label: 'Alternatives for selection',
      key: 'ctrl+shift+a',
      // Offered for a selection only, so a right-click on a bare caret
      // still gets the browser's menu. Ctrl+Shift+A with a collapsed caret
      // is handled (and cancelled) by onSurfaceKeyDown.
      available: (ctx) => this.modelAvailable() && !!ctx && !ctx.collapsed,
      run: (ctx) => this.openForSelection(ctx),
    });
  }

  // ---------------------------------------------------------------------
  // Targets
  // ---------------------------------------------------------------------

  /** Work out what to show for `where` (see open()). */
  resolve(where) {
    try {
      this.resolveTarget(where);
    } catch (error) {
      this.targetingRefusal(error);
    }
  }

  targetingRefusal(error) {
    this.span = null;
    this.target = { message: String(error && error.message ? error.message : error) };
  }

  resolveTarget(where) {
    const spans = this.liveSpans();
    const text = this.surface.getText();
    if (where && where.spanId) {
      const span = spans.find((s) => s.id === where.spanId);
      if (span) {
        this.showSpan(span);
        return;
      }
    }
    if (where && Number.isInteger(where.start) && Number.isInteger(where.end) && where.end > where.start) {
      const inside = TeAlternativesPanel.spanAround(spans, where.start, where.end);
      if (inside) {
        this.showSpan(inside);
        return;
      }
      if (where.start < 0 || where.end > text.length) throw new Error('Selected range is outside the current text.');
      const kind = where.kind || teAltText.inferKind(text.slice(where.start, where.end), this.editor.documentApi());
      if (!TE_ALT_KINDS.includes(kind)) throw new Error(`Unknown text kind: ${kind}`);
      this.tab = kind;
      this.reference = where.start;
      this.setPending(spans, kind, where.start, where.end);
      return;
    }
    const sel = this.surface.getSelectionOffsets();
    this.reference = sel.start;
    const at = TeAlternativesPanel.spanAround(spans, sel.start, sel.start);
    if (at) {
      this.showSpan(at);
      return;
    }
    this.resolveTab(spans);
  }

  /** Resolve the current tab around this.reference. */
  resolveTab(spans = this.liveSpans()) {
    const text = this.surface.getText();
    const pos = this.reference;
    const at = TeAlternativesPanel.spanAround(spans, pos, pos);
    if (at && at.kind === this.tab) {
      this.showSpan(at);
      return;
    }
    let range;
    try {
      range = teAltText.rangeFor(this.tab, text, pos, this.editor.documentApi());
    } catch (error) {
      this.targetingRefusal(error);
      return;
    }
    if (!range) {
      this.target = { message: `Put the caret in a ${this.tab} to list its alternatives.` };
      this.span = null;
      return;
    }
    this.setPending(spans, this.tab, range.start, range.end);
  }

  setPending(spans, kind, start, end) {
    const text = this.surface.getText();
    const clash = spans.find((s) => start < s.anchor.end && s.anchor.start < end);
    this.span = null;
    if (clash) {
      this.target = {
        message: `This ${kind} overlaps a ${clash.kind} that already has alternatives. ` +
          `Open the ${TE_ALT_KIND_LABEL[clash.kind]} tab to see them.`,
      };
      return;
    }
    this.target = { pending: { kind, start, end, text: text.slice(start, end) } };
  }

  showSpan(span) {
    this.span = span;
    this.tab = span.kind;
    this.reference = span.anchor.start;
    this.target = { spanId: span.id };
    this.lastSpan = { id: span.id, kind: span.kind, start: span.anchor.start, end: span.anchor.end };
  }

  /** Re-read the model for the current target (after edits, undo, redo). */
  refresh() {
    try {
      this.refreshTarget();
    } catch (error) {
      this.targetingRefusal(error);
      this.render();
    }
  }

  refreshTarget() {
    if (!this.opened || this.destroyed) return;
    const spans = this.liveSpans();
    const t = this.target || {};
    if (t.spanId) {
      const span = spans.find((s) => s.id === t.spanId);
      if (span) {
        this.showSpan(span);
      } else if (this.lastSpan) {
        // The span went away (its last alternative removed, or undone):
        // offer its text again as a pending span of the same kind.
        const text = this.surface.getText();
        const { kind, start } = this.lastSpan;
        const range = teAltText.rangeFor(kind, text, Math.min(start, text.length), this.editor.documentApi());
        this.tab = kind;
        if (range) this.setPending(spans, kind, range.start, range.end);
        else this.resolveTab(spans);
      }
    } else if (t.pending) {
      const p = t.pending;
      const span = spans.find((s) => s.anchor.start === p.start && s.anchor.end === p.end);
      if (span) this.showSpan(span);
      else if (this.surface.getText().slice(p.start, p.end) !== p.text) this.resolveTab(spans);
      else this.setPending(spans, p.kind, p.start, p.end);
    } else {
      this.resolveTab(spans);
    }
    this.render();
  }

  scheduleRefresh() {
    if (!this.opened || this.destroyed || this.frame) return;
    this.frame = requestAnimationFrame(() => {
      this.frame = 0;
      this.refresh();
    });
  }

  /** Flush a pending refresh now (tests, and after operations). */
  flush() {
    if (this.frame) {
      cancelAnimationFrame(this.frame);
      this.frame = 0;
    }
    this.refresh();
  }

  /**
   * While the surface has focus, moving the caret into another span shows
   * that span. Moving into plain text keeps the current target, so an undo
   * that leaves the caret beside the span (or a click to read the text)
   * does not lose it.
   */
  onSelectionChange() {
    if (!this.opened || this.destroyed || this.retargetFrame) return;
    if (document.activeElement !== this.surface.root) return;
    this.retargetFrame = requestAnimationFrame(() => {
      this.retargetFrame = 0;
      if (!this.opened || document.activeElement !== this.surface.root) return;
      const sel = this.surface.getSelectionOffsets();
      if (this.span && this.span.anchor.start <= sel.start && sel.start <= this.span.anchor.end) return;
      const at = TeAlternativesPanel.spanAround(this.liveSpans(), sel.start, sel.start);
      if (!at || (this.span && at.id === this.span.id)) return;
      this.savedSelection = sel;
      this.showSpan(at);
      this.render();
    });
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------

  /** [{ text, source, active }] for the lines shown (pending: the original only). */
  lines() {
    if (this.span) {
      return this.span.alts.map((a, i) => ({ text: a.text, source: a.source, model: a.model, active: i === this.span.active }));
    }
    if (this.target && this.target.pending) {
      return [{ text: this.target.pending.text, source: 'original', active: true }];
    }
    return [];
  }

  activeLineIndex() {
    if (this.span) return this.span.active;
    if (this.target && this.target.pending) return 1;
    return -1;
  }

  render() {
    this.renderCount += 1;
    for (const kind of TE_ALT_KINDS) {
      const on = kind === this.tab;
      const tab = this.tabs[kind];
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
      tab.classList.toggle('te-alt-tab--active', on);
    }
    this.tabpanel.setAttribute('aria-labelledby', this.tabs[this.tab].id);
    // Keep focus (and any uncommitted draft) on the same line across the
    // rebuild; removing the focused input must not commit it.
    const focused = this.list.contains(document.activeElement) ? document.activeElement : null;
    const focusedIndex = focused ? this.lineInputs().indexOf(focused) : -1;
    const focusedNew = !!focused && focused.classList.contains('te-alt-input--new');
    const draft = focused && focused.value !== focused.dataset.committed ? focused.value : null;
    this.rendering = true;
    try {
      this.list.textContent = '';
    } finally {
      this.rendering = false;
    }
    const t = this.target || {};
    if (t.message) {
      this.setStatus(t.message);
      this.list.hidden = true;
      if (focused) this.tabs[this.tab].focus();
      return;
    }
    this.list.hidden = false;
    const lines = this.lines();
    const total = lines.length;
    lines.forEach((line, i) => this.list.appendChild(this.renderLine(line, i, total)));
    this.list.appendChild(this.renderNewLine());
    if (t.pending) {
      this.setStatus(`New ${t.pending.kind}: type a first alternative and press Enter.`);
    } else if (!this.statusSticky) {
      // The routine count is for screen readers only: the video shows no
      // status line (issue #107). Messages that ask for something stay visible.
      this.setStatus(`${TE_ALT_KIND_LABEL[this.tab]}: ${total} alternatives, ${this.span.active + 1} of ${total} active.`, false, { quiet: true });
    }
    this.statusSticky = false;
    if (focused) {
      const inputs = this.lineInputs();
      const input = focusedNew ? inputs[inputs.length - 1] : inputs[Math.min(focusedIndex, inputs.length - 1)];
      if (draft !== null && (focusedNew || !input.readOnly)) input.value = draft;
      input.focus();
    }
  }

  renderLine(line, index, total) {
    const li = document.createElement('li');
    li.className = 'te-alt-line';
    li.dataset.index = String(index);
    li.dataset.source = line.source;
    if (line.active) li.classList.add('te-alt-line--active');
    const glyph = document.createElement('i');
    glyph.setAttribute('aria-hidden', 'true');
    glyph.className = line.source === 'ai'
      ? 'te-alt-glyph te-alt-glyph--ai fa-solid fa-robot'
      : 'te-alt-glyph te-alt-glyph--human fa-solid fa-circle';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'te-alt-input';
    input.value = line.text;
    input.dataset.committed = line.text;
    input.spellcheck = false;
    input.setAttribute('autocomplete', 'off');
    const who = line.source === 'ai'
      ? (line.model === 'kg' ? 'knowledge graph synonym' : 'suggested by AI')
      : line.source === 'original' ? 'original, read-only' : 'written by you';
    input.setAttribute('aria-label', `Alternative ${index + 1} of ${total}, ${who}${line.active ? ', active' : ''}`);
    if (index === 0) input.readOnly = true;
    li.append(glyph, input);
    if (index > 0) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'te-alt-delete';
      del.tabIndex = -1;
      del.setAttribute('aria-label', `Delete alternative ${index + 1}`);
      del.title = 'Delete';
      const x = document.createElement('i');
      x.className = 'fa-solid fa-xmark';
      x.setAttribute('aria-hidden', 'true');
      del.appendChild(x);
      li.appendChild(del);
    }
    return li;
  }

  renderNewLine() {
    const li = document.createElement('li');
    li.className = 'te-alt-line te-alt-line--new';
    const glyph = document.createElement('i');
    glyph.setAttribute('aria-hidden', 'true');
    glyph.className = 'te-alt-glyph te-alt-glyph--new fa-solid fa-plus';
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'te-alt-input te-alt-input--new';
    input.dataset.committed = '';
    input.placeholder = 'New alternative';
    input.spellcheck = false;
    input.setAttribute('autocomplete', 'off');
    input.setAttribute('aria-label', 'New alternative: type it and press Enter');
    li.append(glyph, input);
    return li;
  }

  setStatus(message, sticky = false, { quiet = false } = {}) {
    this.statusEl.textContent = message || '';
    this.statusEl.classList.toggle('te-alt-status--quiet', quiet);
    if (sticky) this.statusSticky = true;
  }

  lineInputs() {
    return Array.from(this.list.querySelectorAll('.te-alt-input'));
  }

  focusedLineIndex() {
    const inputs = this.lineInputs();
    return inputs.indexOf(document.activeElement);
  }

  focusLine(index) {
    const inputs = this.lineInputs();
    if (inputs.length === 0) {
      const tab = this.tabs[this.tab];
      if (tab) tab.focus();
      return;
    }
    const input = inputs[Math.max(0, Math.min(index, inputs.length - 1))];
    input.focus();
    try {
      input.setSelectionRange(input.value.length, input.value.length);
    } catch (err) {
      // Not every input type supports selection ranges.
    }
  }

  // ---------------------------------------------------------------------
  // Operations (model first, through the editor)
  // ---------------------------------------------------------------------

  /** Run `fn`, reporting a refusal in the status line instead of throwing. */
  attempt(fn) {
    try {
      return fn();
    } catch (err) {
      this.setStatus(`Not changed: ${err && err.message ? err.message : err}`, true);
      this.render();
      return null;
    }
  }

  /**
   * Show the result of an operation. The model returns the span as it now
   * is, so that is rendered directly (no second model read); a span the
   * operation removed, or no change, falls back to a refresh.
   */
  after(change) {
    if (this.frame) {
      cancelAnimationFrame(this.frame);
      this.frame = 0;
    }
    if (change && change.after) {
      this.showSpan(change.after);
      this.render();
    } else {
      this.refresh();
    }
    return change;
  }

  /** Add `text` (Enter on the empty line). Creates the span when pending. */
  addAlternative(text, { source = 'human' } = {}) {
    const value = String(text);
    if (!value) return null;
    const t = this.target || {};
    if (t.pending) {
      const p = t.pending;
      return this.attempt(() => this.after(
        this.editor.alternativeOp('create_span', p.kind, p.start, p.end, value, source)));
    }
    if (!t.spanId) return null;
    return this.attempt(() => {
      const change = this.editor.alternativeOp('add', t.spanId, value, source);
      if (!change) this.setStatus(`“${value}” is already in the list.`, true);
      return this.after(change);
    });
  }

  /** Replace line `index`; empty text deletes it. */
  editAlternative(index, text) {
    const t = this.target || {};
    if (!t.spanId || index < 1) return null;
    if (String(text) === '') return this.removeAlternative(index);
    return this.attempt(() => this.after(this.editor.alternativeOp('edit', t.spanId, index, String(text))));
  }

  removeAlternative(index) {
    const t = this.target || {};
    if (!t.spanId || index < 1) return null;
    return this.attempt(() => this.after(this.editor.alternativeOp('remove', t.spanId, index)));
  }

  moveAlternative(from, to) {
    const t = this.target || {};
    if (!t.spanId) return null;
    return this.attempt(() => this.after(this.editor.alternativeOp('move', t.spanId, from, to)));
  }

  /** Make line `index` active, with a live document update (R-4.5). */
  setActiveIndex(index) {
    const t = this.target || {};
    if (!t.spanId || !this.span || index < 0 || index >= this.span.alts.length) return null;
    if (index === this.span.active) return null;
    return this.attempt(() => {
      const change = this.activate(t.spanId, index);
      this.refresh();
      return change;
    });
  }

  /**
   * Make an alternative active through issue #9's swapAlternative: model
   * first, the a/an fix-up, one `swap` history step.
   */
  activate(spanId, index) {
    return this.editor.swapAlternative(spanId, index);
  }

  /** Commit line `input` if its text changed. Returns true if it did. */
  commitLine(input) {
    if (!input || input.readOnly) return false;
    if (input.classList.contains('te-alt-input--new')) return this.commitNewLine(input);
    if (input.value === input.dataset.committed) return false;
    const index = Number(input.closest('.te-alt-line').dataset.index);
    return this.editAlternative(index, input.value) !== null;
  }

  /**
   * Commit text put in the add line without typing (typing makes it live,
   * see onLineInput): it is added as an alternative (or creates the pending
   * span with it) and made active, as one undo step. Whitespace-only text is
   * ignored. Returns true if something was added.
   */
  commitNewLine(input) {
    const value = input.value;
    if (!value.trim()) return false;
    // Cleared first, so the re-render does not carry it over as a draft.
    input.value = '';
    // History trimming waits until the steps are folded (see liftLimit).
    const limit = this.liftLimit();
    const base = this.historyTop();
    if (this.addActive(value) !== -1) this.foldSince(base);
    this.restoreLimit(limit);
    return true;
  }

  // ---------------------------------------------------------------------
  // The new alternative, live while it is typed (issue #106, R-4.3)
  // ---------------------------------------------------------------------
  //
  // The first character typed in the add line adds the alternative (or
  // creates the pending span with it) and makes it active, so the document
  // shows it at once; each further keystroke edits it, model first, and the
  // document follows. Focus moves to its line, which stays the one being
  // typed in. Enter, leaving the line, the arrows, a tab change or closing
  // the panel keep it, with every step folded into ONE undo step. Escape
  // cancels it: the steps are undone, so the alternative goes and the
  // previous active one and its text come back. Emptying the line (or
  // leaving only spaces) cancels it the same way and leaves the add line
  // with what was typed.

  /** The surface history entry now on top (where a live addition began). */
  historyTop() {
    return this.surface.history[this.surface.historyIndex] || null;
  }

  /** How many history steps were recorded after entry `base` (-1: gone). */
  stepsSince(base) {
    const at = this.surface.history.indexOf(base);
    return at === -1 ? -1 : this.surface.historyIndex - at;
  }

  /** Fold the steps recorded after `base` into one undo step. */
  foldSince(base) {
    const steps = this.stepsSince(base);
    if (steps > 1) this.surface.squashHistory(steps, 'alternatives');
    return steps;
  }

  /**
   * Add `value` and make it active. Returns its line index, or -1 when the
   * model refused (a duplicate, an overlap; the status line says why).
   */
  addActive(value) {
    const change = this.addAlternative(value);
    if (!change || !this.span) return -1;
    const index = this.span.alts.findIndex((a, i) => i > 0 && a.text === value);
    if (index === -1) return -1;
    this.setActiveIndex(index);
    return index;
  }

  /** Line index of a line input (the add line: lines().length). */
  lineIndexOf(input) {
    if (input.classList.contains('te-alt-input--new')) return this.lines().length;
    return Number(input.closest('.te-alt-line').dataset.index);
  }

  onLineInput(e) {
    if (this.destroyed || !this.opened || this.rendering || e.isComposing) return;
    const input = e.target;
    if (!(input instanceof HTMLInputElement) || input.readOnly) return;
    if (input.classList.contains('te-alt-input--new')) {
      if (!this.live) this.startLive(input);
      return;
    }
    if (this.live && this.lineIndexOf(input) === this.live.index) this.updateLive(input);
  }

  startLive(input) {
    const value = input.value;
    const t = this.target || {};
    if (!value.trim() || (!t.spanId && !t.pending)) return;
    const caret = [input.selectionStart, input.selectionEnd];
    // History trimming waits until the addition is folded, from before its
    // first step, so `base` (and the state before it) is never shifted out,
    // even when the history is already at its limit.
    const limit = this.liftLimit();
    const base = this.historyTop();
    input.value = '';
    const index = this.whileBusy(() => this.addActive(value));
    if (index === -1) {
      // Refused: the typed text stays in the add line.
      this.restoreLimit(limit);
      this.restoreLine(this.lines().length, value, caret);
      return;
    }
    this.live = { spanId: this.span.id, index, base, refused: null, limit };
    this.restoreLine(index, null, caret);
  }

  updateLive(input) {
    const value = input.value;
    const caret = [input.selectionStart, input.selectionEnd];
    if (!value.trim()) {
      this.cancelLive({ keep: value, caret });
      return;
    }
    if (value === input.dataset.committed) return;
    const { index } = this.live;
    const change = this.whileBusy(() => this.editAlternative(index, value));
    // A refused edit (a duplicate) keeps the typed text in the line; the
    // model keeps the last text it accepted until the line is fixed.
    this.live.refused = change ? null : value;
    this.restoreLine(index, value, caret);
  }

  whileBusy(fn) {
    const was = this.liveBusy;
    this.liveBusy = true;
    try {
      return fn();
    } finally {
      this.liveBusy = was;
    }
  }

  /**
   * Keep the live addition as it is: one undo step. If the line still holds
   * text the model refused, the line is put back to the text it kept, and
   * the status line says so.
   */
  finishLive() {
    if (!this.live) return;
    const { base, index, refused } = this.live;
    this.endLive();
    this.foldSince(base);
    this.surface.trimHistory();
    if (refused !== null) {
      const input = this.lineInputs()[index];
      const kept = input ? input.dataset.committed : '';
      if (input) input.value = kept;
      this.setStatus(`“${refused}” is already in the list; kept “${kept}”.`, true);
    }
  }

  /** Forget the live addition (trimming resumes after the fold). */
  endLive() {
    this.surface.historyLimit = this.live.limit;
    this.live = null;
  }

  /** Stop history trimming; returns the limit to restore. */
  liftLimit() {
    const limit = this.surface.historyLimit;
    this.surface.historyLimit = Infinity;
    return limit;
  }

  /** Put the history limit back and apply it. */
  restoreLimit(limit) {
    this.surface.historyLimit = limit;
    this.surface.trimHistory();
  }

  /**
   * Undo the live addition (Escape, or an emptied line). `keep` is put back
   * in the add line, which gets focus with `caret`.
   */
  cancelLive({ keep = '', caret = null } = {}) {
    if (!this.live) return;
    const { base } = this.live;
    this.endLive();
    const steps = this.foldSince(base);
    if (steps >= 1) {
      this.surface.undo();
      // Cancelled, not undone: redo does not bring it back.
      this.surface.forgetRedo();
    }
    this.surface.trimHistory();
    this.flush();
    if (this.opened) this.restoreLine(this.lines().length, keep, caret);
  }

  /** Focus line `index`, optionally with `value`, and put the caret back. */
  restoreLine(index, value, caret) {
    const inputs = this.lineInputs();
    const input = inputs[Math.max(0, Math.min(index, inputs.length - 1))];
    if (!input) return;
    if (value !== null && value !== undefined && input.value !== value) input.value = value;
    input.focus();
    const end = input.value.length;
    try {
      input.setSelectionRange(Math.min(caret ? caret[0] : end, end), Math.min(caret ? caret[1] : end, end));
    } catch (err) {
      // Not every input type supports selection ranges.
    }
  }

  /** Commit the focused line, if any (see commitLine). */
  commitFocused() {
    const active = document.activeElement;
    if (!this.list || !(active instanceof HTMLInputElement) || !this.list.contains(active)) return false;
    return this.commitLine(active);
  }

  /**
   * Uncommitted text in the lines: [{ value, index, isNew, spanId, pending }]
   * (index is the line, the empty line's being lines().length).
   */
  pendingDrafts() {
    if (!this.list) return [];
    const t = this.target || {};
    const inputs = this.lineInputs();
    const out = [];
    inputs.forEach((input, index) => {
      const isNew = input.classList.contains('te-alt-input--new');
      if (input.readOnly || input.value === (input.dataset.committed || '')) return;
      if (isNew && !input.value.trim()) return;
      out.push({
        value: input.value,
        index,
        isNew,
        spanId: t.spanId || null,
        pending: t.pending ? { ...t.pending } : null,
      });
    });
    return out;
  }

  // ---------------------------------------------------------------------
  // Events
  // ---------------------------------------------------------------------

  onLineBlur(e) {
    if (this.destroyed || !this.opened || this.rendering) return;
    const input = e.target;
    if (!(input instanceof HTMLInputElement) || !input.isConnected) return;
    if (this.liveBusy) return;
    if (this.live && !input.classList.contains('te-alt-input--new') && this.lineIndexOf(input) === this.live.index) {
      this.finishLive();
    }
