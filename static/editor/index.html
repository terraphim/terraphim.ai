    if (input.value === (input.dataset.committed || '')) return;
    // Leaving a line commits it, the empty line included (a tab, the
    // document, another line). The commit re-renders the list, so focus
    // moving to another line is put back on that line afterwards.
    const to = e.relatedTarget;
    const inputs = this.lineInputs();
    const toIndex = to && this.list.contains(to) ? inputs.indexOf(to) : -1;
    const toNew = toIndex !== -1 && to.classList.contains('te-alt-input--new');
    if (!this.commitLine(input) || toIndex === -1) return;
    this.focusLine(toNew ? this.lines().length : toIndex);
  }

  onListClick(e) {
    const del = e.target.closest && e.target.closest('.te-alt-delete');
    if (!del) return;
    const index = Number(del.closest('.te-alt-line').dataset.index);
    this.removeAlternative(index);
    this.focusLine(Math.min(index, this.lineInputs().length - 1));
  }

  onLineKeyDown(e) {
    const input = e.target;
    if (!(input instanceof HTMLInputElement) || e.isComposing) return;
    const isNew = input.classList.contains('te-alt-input--new');
    const index = isNew ? this.lines().length : Number(input.closest('.te-alt-line').dataset.index);
    const count = this.lines().length;
    const plain = !e.ctrlKey && !e.metaKey && !e.shiftKey;
    if (e.key === 'Enter' && plain && !e.altKey && this.live && this.live.refused !== null && index === this.live.index) {
      // Enter does not keep text the model refused: the line stays live
      // until it is changed (or Escape cancels it).
      e.preventDefault();
      this.setStatus(`“${this.live.refused}” is already in the list.`, true);
      return;
    }
    if ((e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') && plain) this.finishLive();
    if (e.key === 'Enter' && plain && !e.altKey) {
      e.preventDefault();
      if (isNew) {
        if (!this.commitNewLine(input)) return;
        this.focusLine(this.lines().length);
      } else {
        this.commitLine(input);
        this.focusLine(this.lines().length);
      }
      return;
    }
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && plain) {
      const step = e.key === 'ArrowUp' ? -1 : 1;
      if (e.altKey) {
        e.preventDefault();
        if (isNew || index < 1) return;
        const to = index + step;
        if (to < 1 || to >= count) return;
        if (this.commitLine(input)) return;
        this.moveAlternative(index, to);
        this.focusLine(to);
        return;
      }
      e.preventDefault();
      this.commitLine(input);
      // Text committed from the empty line is now the last alternative.
      const next = (isNew ? this.lines().length : index) + step;
      if (next < 0) return;
      if (next >= this.lines().length) {
        this.focusLine(this.lines().length);
        return;
      }
      if (this.span) this.setActiveIndex(next);
      this.focusLine(next);
    }
  }

  onPanelKeyDown(e) {
    if (this.destroyed || e.isComposing) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      // A new alternative being typed is cancelled (issue #106). Otherwise
      // close() commits the focused line: Escape never discards an edit of
      // an existing line (undo reverses the commit).
      if (this.live) this.cancelLive();
      this.close({ restoreFocus: true });
      return;
    }
    const mod = e.ctrlKey || e.metaKey;
    if (!mod) return;
    if (typeof teShortcutMatches === 'function' && teShortcutMatches(e, 'ctrl+shift+a')) {
      e.preventDefault();
      this.close({ restoreFocus: true });
      return;
    }
    const key = (e.key || '').toLowerCase();
    const undo = key === 'z' && !e.shiftKey && !e.altKey;
    const redo = (key === 'z' && e.shiftKey && !e.altKey) || (key === 'y' && !e.shiftKey && !e.altKey);
    if (!undo && !redo) return;
    // A live addition is one step: undo removes all of it.
    this.finishLive();
    const input = e.target instanceof HTMLInputElement ? e.target : null;
    // Typing not yet committed is the input's own to undo.
    if (input && input.value !== (input.dataset.committed || '')) return;
    e.preventDefault();
    const index = this.focusedLineIndex();
    if (undo) this.surface.undo();
    else this.surface.redo();
    this.flush();
    this.focusLine(index === -1 ? this.activeLineIndex() : Math.min(index, this.lines().length));
  }

  onTabKeyDown(e) {
    const order = TE_ALT_KINDS;
    let i = order.indexOf(this.tab);
    if (e.key === 'ArrowRight') i = (i + 1) % order.length;
    else if (e.key === 'ArrowLeft') i = (i + order.length - 1) % order.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = order.length - 1;
    else if (e.key === 'ArrowDown') {
      e.preventDefault();
      this.focusLine(this.activeLineIndex());
      return;
    } else return;
    e.preventDefault();
    this.setTab(order[i], { focusTab: true });
  }

  /** Switch granularity (R-4.2) around the reference point. */
  setTab(kind, { focusTab = false } = {}) {
    if (!TE_ALT_KINDS.includes(kind)) throw new Error(`Unknown tab ${kind}`);
    this.finishLive();
    this.commitFocused();
    this.tab = kind;
    if (this.opened) {
      this.resolveTab();
      this.render();
    }
    if (focusTab) this.tabs[kind].focus();
  }

  // ---------------------------------------------------------------------
  // Teardown
  // ---------------------------------------------------------------------

  /**
   * Tear down. Never changes the document (the host may already have
   * saved): uncommitted text in the lines is reported instead, as one
   * bubbling `te:alt-drafts` CustomEvent from the surface root with
   * detail { editor, drafts } (see pendingDrafts()), and returned. With
   * nothing pending there is no event and the array is empty.
   */
  destroy() {
    if (this.destroyed) return [];
    // A live addition is already in the document: keep it as one step.
    this.finishLive();
    const drafts = this.pendingDrafts();
    if (drafts.length && this.surface.root) {
      this.surface.root.dispatchEvent(new CustomEvent('te:alt-drafts', {
        bubbles: true,
        detail: { editor: this.editor, drafts: drafts.map((d) => ({ ...d })) },
      }));
    }
    this.destroyed = true;
    this.opened = false;
    if (this.frame) cancelAnimationFrame(this.frame);
    if (this.retargetFrame) cancelAnimationFrame(this.retargetFrame);
    this.frame = 0;
    this.retargetFrame = 0;
    this.abortController.abort();
    if (this.offChange) this.offChange();
    if (this.offMenu) this.offMenu();
    if (this.host) this.host.classList.remove('te-alt-open');
    if (this.root) this.root.remove();
    this.root = null;
    return drafts;
  }
}

window.TeAlternativesPanel = TeAlternativesPanel;

    <!-- Overflow panel (issue #12): after the chrome and selection menu, before editor.js. -->
    <script>/*
 * Overflow panel: stash, pull back, drag into the page (issue #12; spec
 * R-6.1 to R-6.5, R-7.3)
 * =====================================================================
 *
 * TeOverflowPanel (`editor.overflow`)
 * -----------------------------------
 * A right-hand panel (`<aside role="complementary">`, labelled by its
 * "Overflow" title in the cursive display face, lavender) holding one
 * free-form monospace text area (R-6.1, R-6.2). It is toggled by the XYZ
 * corner control (the chrome dispatches `te:overflow`), which gets
 * `aria-expanded` and `aria-controls`, and by Ctrl+Shift+D (exactly those
 * modifiers; the chrome's OVERFLOW_TOGGLE_KEY, shown in the XYZ tooltip as in
 * the demo at 3:52) from anywhere in the editor or the panel, in Write_On
 * mode only. As in the demo, the panel runs full height against the right
 * edge and the corner controls stay on top of it: the keyboard glyph opens
 * the shortcut reference and the XYZ tag, lit while the panel is open,
 * closes it.
 *
 *   editor.overflow.open({ focus })    // -> true when shown (Write_On only)
 *   editor.overflow.close({ restoreFocus })
 *   editor.overflow.toggle()
 *   editor.overflow.isOpen()
 *   editor.overflow.text()             // the overflow text in the model
 *   editor.overflow.stash(start, end)  // R-6.3, a move (see below)
 *   editor.overflow.pullBack()         // R-6.4, Ctrl+Enter (see below)
 *   editor.overflow.flush()            // write waiting panel input now
 *   editor.overflow.refresh()          // re-read the model into the panel
 *
 * Data. The overflow is document state, kept by the WASM model
 * (`Annotations::overflow`), saved in the annotation block and never
 * exported (R-6.5, R-9.3). What the author types is written to the model
 * after a short debounce (`delay`, default 250 ms), on blur, and before any
 * model read (MarkdownEditor.alignDocumentModel calls flush(), which costs
 * nothing when no input is waiting), so a save always includes it. Typing in
 * the panel is not part of the document's undo history; the text area keeps
 * its own native undo.
 *
 * Modes. The panel UI exists only in Write_On mode: the XYZ control is a
 * Write_On control, open() refuses in plain mode, and switching to plain
 * closes the panel. The stash menu item and Ctrl+Shift+X are offered only in
 * Write_On mode too, so text never moves somewhere the author cannot see.
 * The data itself is the same in both modes: a document opened or saved in
 * plain mode keeps its overflow.
 *
 * Stash (R-6.3, R-7.3). "Stash this in Overflow" (Ctrl+Shift+X) is
 * registered in the selection menu (slot `stash`). It calls
 * MarkdownEditor.stashRange: the text is removed from the page and appended
 * to the end of the overflow (after a blank line when the overflow is not
 * empty) as ONE undo step; undo puts the text back and takes it out of the
 * overflow, redo does both again. The stashed text is identified by its
 * recorded position in the overflow (the end of the overflow before the
 * stash), never by searching for it: text typed after it, even an identical
 * copy, is kept; if text was changed before it, or it was edited itself,
 * undo leaves the overflow unchanged and shows a notice (`warningKind`
 * 'overflow') instead of removing some other copy.
 * Annotations inside the stashed text follow the normal edit rules: spans
 * whose text is removed are detached and set aside (saved, with the usual
 * notice), ghosts inside it are set aside, and both re-attach when undo
 * brings the text back. The overflow itself is plain text and carries no
 * annotations. The panel opens (without taking focus) so the stash is seen.
 * Refused while a malformed annotation block is preserved: its save writes
 * the raw block back, so the overflow could not be saved; the panel is then
 * read-only and says why.
 *
 * Pull back (R-6.4) is a COPY: the text goes into the page and stays in the
 * overflow, so nothing can be lost (the spec calls it "use"; the author
 * deletes it from the panel when done; terraphim-lsp copies too). Ctrl+Enter
 * in the text area inserts the selected panel text, or the current line when
 * nothing is selected, without its own line breaks at either end, at the
 * document caret (at the end of a document selection, which is never
 * replaced), as one undo step through the normal edit path. It is separated
 * exactly as terraphim-lsp separates a pulled paragraph (the model's
 * `overflow_pull_back_text`): as it is in the middle of a line; at the start
 * or end of a line, or on a blank line, a paragraph of its own with one
 * blank line on each side, in the document's line ending. Focus and the
 * panel selection stay in the panel.
 *
 * Drag. Dragging selected panel text into the page pulls it back the same
 * way at the drop point (one undo step); the drag allows only `copy`, so the
 * text area never deletes its text. Text dropped from anywhere else is
 * inserted by EditorSurface as it is.
 * Dragging a page selection onto the panel stashes it (a move, the same
 * single undo step as Ctrl+Shift+X); the drop is accepted as `copy` so the
 * browser never deletes the page text behind the model's back.
 *
 * Keyboard and ARIA. Escape anywhere in the panel closes it and returns
 * focus to where it was before the panel was opened (the XYZ control), or
 * to the page. The text area is labelled and described by the footer hint.
 *
 * Lifecycle. Listeners use the editor's AbortController signal plus the
 * panel's own; destroy() removes the DOM, the menu item, the body attribute
 * and every listener. Load order: after blocks.js, before editor.js, which
 * creates the panel in MarkdownEditor.initialize().
 */

class TeOverflowPanel {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.delay = options.delay === undefined ? 250 : options.delay;
    this.destroyed = false;
    this.timer = null;
    this.returnFocus = null;
    this.pageDrag = null;
    this.panelDrag = null;
    this.pointerDrag = null;
    this.readOnly = false;
    this.unregisterItem = () => {};

    this.abortController = new AbortController();
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal: this.abortController.signal });
    }
    this.mount = options.mount || (editor.input && editor.input.closest('.editor-container')) || document.body;
    this.build();
    this.listen();
    this.offChange = this.surface ? this.surface.onChange((change) => this.onSurfaceChange(change)) : () => {};
    if (editor.selectionMenu && typeof editor.selectionMenu.register === 'function') {
      this.unregisterItem = editor.selectionMenu.register(this.stashItem());
    }
    this.refresh();
  }

  static get HINT() {
    return 'ctrl+⏎ or drag into the page to use';
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  build() {
    const n = TeOverflowPanel.nextId = (TeOverflowPanel.nextId || 0) + 1;
    const root = document.createElement('aside');
    root.className = 'te-overflow';
    root.id = `te-overflow-${n}`;
    root.setAttribute('role', 'complementary');
    root.setAttribute('aria-labelledby', `te-overflow-title-${n}`);
    root.hidden = true;

    const header = document.createElement('div');
    header.className = 'te-overflow-header';
    const title = document.createElement('h2');
    title.className = 'te-overflow-title';
    title.id = `te-overflow-title-${n}`;
    title.textContent = 'Overflow';
    const tools = document.createElement('div');
    tools.className = 'te-overflow-tools';
    const button = (cls, icon, label) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `te-overflow-button ${cls}`;
      b.setAttribute('aria-label', label);
      b.title = label;
      const i = document.createElement('i');
      i.className = icon;
      i.setAttribute('aria-hidden', 'true');
      b.appendChild(i);
      tools.appendChild(b);
      return b;
    };
    this.closeButton = button('te-overflow-close', 'fa-solid fa-xmark', 'Close Overflow');
    header.append(title, tools);

    const note = document.createElement('p');
    note.className = 'te-overflow-note';
    note.setAttribute('role', 'status');
    note.hidden = true;

    const area = document.createElement('textarea');
    area.className = 'te-overflow-text';
    area.spellcheck = false;
    area.setAttribute('aria-label', 'Overflow text');
    area.setAttribute('aria-describedby', `te-overflow-hint-${n}`);
    area.placeholder = 'Select text on the page and press Ctrl+Shift+X to stash it here, or just write.';

    const hint = document.createElement('p');
    hint.className = 'te-overflow-hint';
    hint.id = `te-overflow-hint-${n}`;
    hint.textContent = TeOverflowPanel.HINT;

    root.append(header, note, area, hint);
    this.mount.appendChild(root);
    this.root = root;
    this.area = area;
    this.note = note;
  }

  listen() {
    const signal = this.abortController.signal;
    const on = (el, type, fn, opts = {}) => el.addEventListener(type, fn, { signal, ...opts });

    on(document, 'te:overflow', (e) => {
      if (e.detail && e.detail.editor && e.detail.editor !== this.editor) return;
      this.toggle();
    });
    on(document, 'te:mode-change', (e) => {
      if (e.detail && e.detail.editor && e.detail.editor !== this.editor) return;
      if (e.detail && e.detail.mode !== 'write-on') this.close();
    });
    on(this.closeButton, 'click', () => this.close());
    // Ctrl+Shift+D, from the editor or the panel (which may be mounted
    // outside it). Capture phase, so a focused control cannot swallow it; the
    // browser's own binding is overridden only when the panel acts.
    const toggleKey = typeof OVERFLOW_TOGGLE_KEY === 'string' ? OVERFLOW_TOGGLE_KEY : 'ctrl+shift+d';
    const onToggleKey = (e) => {
      if (e.defaultPrevented || typeof teShortcutMatches !== 'function' || !teShortcutMatches(e, toggleKey)) return;
      if (!this.isOpen() && !this.usable()) return;
      e.preventDefault();
      e.stopPropagation();
      this.toggle();
    };
    const keyScope = this.editor.root || this.mount;
    on(keyScope, 'keydown', onToggleKey, { capture: true });
    if (!keyScope.contains(this.root)) on(this.root, 'keydown', onToggleKey, { capture: true });
    on(this.root, 'keydown', (e) => {
      if (e.key === 'Escape' && !e.isComposing) {
        e.preventDefault();
        e.stopPropagation();
        this.close();
      }
    });
    on(this.area, 'input', () => this.schedule());
    on(this.area, 'blur', () => this.flush());
    on(this.area, 'keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        this.pullBack();
      }
    });
    // Panel text dragged out is copied, never moved out of the panel; in
    // the page it is pulled back (separated) at the drop point.
    on(this.area, 'dragstart', (e) => {
      if (e.dataTransfer) e.dataTransfer.effectAllowed = 'copy';
      const start = Math.min(this.area.selectionStart, this.area.selectionEnd);
      const end = Math.max(this.area.selectionStart, this.area.selectionEnd);
      this.panelDrag = start === end ? null : { start, end, text: this.area.value.slice(start, end) };
    });
    on(this.area, 'dragend', () => { this.panelDrag = null; });
    // A page selection dragged onto the panel is stashed.
    if (this.surface) {
      on(this.surface.root, 'dragstart', () => {
        const sel = this.surface.getSelectionOffsets();
        this.pageDrag = sel.start === sel.end
          ? null
          : { start: sel.start, end: sel.end, text: this.surface.getText().slice(sel.start, sel.end) };
      });
      on(this.surface.root, 'dragend', () => { this.pageDrag = null; });
      // Captured before EditorSurface's own drop handling, which inserts
      // the dropped text as it is.
      // A custom pull-back target must accept its owned text drag before
      // the browser dispatches drop (plaintext-only editing does not do so).
      on(this.surface.root, 'dragover', (e) => {
        if (!this.panelDrag || !e.dataTransfer || !Array.from(e.dataTransfer.types).includes('text/plain')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      on(this.surface.root, 'drop', (e) => this.onPageDrop(e), { capture: true });
    }
    on(this.root, 'dragover', (e) => {
      if (!this.pageDrag || !this.canStash()) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });
    on(this.root, 'drop', (e) => this.onPanelDrop(e));
    // Some text selections turn into selection gestures rather than HTML
    // drags. Only a cross-panel release may complete this fallback.
    if (this.surface) {
      on(document, 'pointerdown', () => { this.pointerDrag = null; }, { capture: true });
      on(this.surface.root, 'pointerdown', (e) => this.beginPointerStash(e));
      on(document, 'pointermove', (e) => {
        const drag = this.pointerDrag;
        if (!drag || e.pointerId !== drag.id) return;
        if (!(e.buttons & 1)) { this.pointerDrag = null; return; }
        if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) >= 5) drag.moved = true;
      });
      on(document, 'pointerup', (e) => this.finishPointerStash(e));
      on(document, 'pointercancel', () => { this.pointerDrag = null; });
      on(document, 'dragstart', () => { this.pointerDrag = null; }, { capture: true });
      on(document, 'keydown', (e) => { if (e.key === 'Escape') this.pointerDrag = null; }, { capture: true });
      on(window, 'blur', () => { this.pointerDrag = null; });
    }
  }

  /** Snapshot an existing selection only when pressed inside its actual range. */
  beginPointerStash(e) {
    this.pointerDrag = null;

   * which the Write_On layout uses to keep the column clear of it, and on
   * <body> only where the chrome owns the page (#77: an embedded editor
   * never touches <body>).

    if (!chrome || chrome.pageMode !== false) targets.push(document.body);

  /** Can the panel be shown: Write_On mode (or no chrome) and a model? */
  usable() {
    if (this.destroyed || !this.api()) return false;
    const chrome = this.editor.chrome;
    return !chrome || typeof chrome.isWriteOn !== 'function' || chrome.isWriteOn();
  }

  canStash() {
    if (!this.usable()) return false;
    const api = this.api();
    return typeof api.stash_document_range === 'function' && typeof this.editor.stashRange === 'function' &&
      !this.preservedBlock();

  schedule() {
    if (this.destroyed || this.readOnly) return;
    if (this.timer !== null) clearTimeout(this.timer);
    this.timer = setTimeout(() => {

      this.write();

  /** Is panel input waiting for its debounce? */
  pending() {
    return this.timer !== null;
  }

  /** Write waiting panel input to the model now (no-op when none waits). */
  flush() {
    if (this.timer === null) return;
    clearTimeout(this.timer);
    this.timer = null;
    this.write();
  }

  write() {
    const api = this.api();
    if (!api || this.readOnly) return;
    const result = api.set_document_overflow(this.area.value);
    if (result && result.ok) this.changed('edit');
  }

  /** Re-read the model into the panel (dropping waiting input). */
  refresh() {
    if (this.destroyed) return;
    this.pointerDrag = null;
    if (this.timer !== null) {
      clearTimeout(this.timer);
      this.timer = null;
    }
    const api = this.api();
    const value = api ? api.document_overflow() : '';
    if (this.area.value !== value) this.area.value = value;
    this.readOnly = this.preservedBlock();
    this.area.readOnly = this.readOnly;
    this.note.hidden = !this.readOnly;
    this.note.textContent = this.readOnly
      ? 'Overflow is read-only: the annotation block at the end of this file could not be read. Repair it to stash again.'
      : '';
  }

  onSurfaceChange(change) {
    if (this.destroyed || !change) return;
    this.pointerDrag = null;
    // A different document was opened, or a stash was done, undone or
    // redone: the model holds the overflow to show.
    if (change.source === 'open' || (change.edit && change.edit.overflow)) {

      if (change.edit && change.edit.overflow && change.source !== 'stash') this.changed(change.source);

  /** Tell storage owners the overflow changed. */

    this.surface.root.dispatchEvent(new CustomEvent('te:overflow-change', {
      bubbles: true,
      detail: { editor: this.editor, action, overflow: this.area.value },

  // ---------------------------------------------------------------------
  // Opening and closing
  // ---------------------------------------------------------------------

  control() {
    const chrome = this.editor.chrome;
    return chrome && chrome.root ? chrome.root.querySelector('[data-control="overflow"]') : null;

  }

  /** Show the panel (Write_On mode only). Returns whether it is open. */

      this.returnFocus = active && active !== document.body && !this.root.contains(active) ? active : null;

      this.setPageFlag(true);
      this.syncControl();

    return true;
  }

  /** Hide the panel; focus inside it returns to where it came from. */
  close({ restoreFocus = true } = {}) {
    this.pointerDrag = null;
    if (this.destroyed || this.root.hidden) return;
    this.flush();
    const hadFocus = this.root.contains(document.activeElement);
    this.root.hidden = true;
    this.setPageFlag(false);
    this.syncControl();
    if (restoreFocus && hadFocus) {
      const back = this.returnFocus;
      if (back && back.isConnected && back.getClientRects().length > 0) back.focus({ preventScroll: true });
      else if (this.surface) this.surface.focus();
    }
    this.returnFocus = null;
  }

  toggle() {
    if (this.isOpen()) this.close();
    else this.open();
  }

  syncControl() {
    const control = this.control();
    if (!control) return;
    control.setAttribute('aria-controls', this.root.id);
    control.setAttribute('aria-expanded', this.isOpen() ? 'true' : 'false');
  }

  // ---------------------------------------------------------------------
  // Stash and pull back
  // ---------------------------------------------------------------------

  /** The selection menu item (slot `stash`, R-7.3). */
  stashItem() {
    return {
      id: 'stash',
      label: 'Stash this in Overflow',
      key: 'ctrl+shift+x',
      available: (ctx) => !ctx.collapsed && this.canStash(),
      run: (ctx) => this.stash(ctx.start, ctx.end),
    };
  }

  /**
   * Stash [start, end) (a move, one undo step; see the header) and show the
   * panel without taking focus. Returns the model outcome, or
   * { ok: false, error } when refused (nothing changes).
   */
  stash(start, end) {
    if (!this.canStash()) return { ok: false, error: 'Stashing is not available here' };
    let outcome;
    try {
      outcome = this.editor.stashRange(start, end);
    } catch (err) {
      console.warn('Could not stash:', err);
      return { ok: false, error: String(err && err.message ? err.message : err) };
    }
    this.open({ focus: false });
    this.area.scrollTop = this.area.scrollHeight;
    this.changed('stash');
    return { ok: true, ...outcome };
  }

  /**
   * The panel text pull back uses: the selection, or the current line when
   * nothing is selected. Returns { text, start, end } or null when empty.
   */
  pullBackText() {
    const value = this.area.value;
    let start = Math.min(this.area.selectionStart, this.area.selectionEnd);
    let end = Math.max(this.area.selectionStart, this.area.selectionEnd);
    if (start === end) {
      start = value.lastIndexOf('\n', start - 1) + 1;
      const nl = value.indexOf('\n', end);
      end = nl === -1 ? value.length : nl;
    }
    const text = value.slice(start, end);
    return text ? { text, start, end } : null;
  }

  /**
   * Ctrl+Enter (R-6.4): copy the panel selection (or current line) into the
   * page at the document caret, separated as terraphim-lsp separates it, as
   * one undo step. Focus and the panel selection stay in the panel. Returns
   * { start, end } of the inserted text in the page, or null when there is
   * nothing to insert.
   */
  pullBack() {
    if (this.destroyed || !this.surface) return null;
    const picked = this.pullBackText();
    if (!picked) return null;
    return this.pullBackAt(this.surface.getSelectionOffsets().end, picked);
  }

  /** Copy `picked` ({ text, start, end } of the panel) into the page at `at`. */
  pullBackAt(at, picked) {
    const { selectionStart, selectionEnd, selectionDirection } = this.area;
    const focused = document.activeElement === this.area;
    let start = at;
    let text = picked.text;
    const api = this.api();
    if (api && typeof api.overflow_pull_back_text === 'function') {
      // The model reads the overflow: panel input still waiting goes first.
      this.flush();
      try {
        ({ start, text } = api.overflow_pull_back_text(at, picked.start, picked.end));
      } catch (err) {
        console.warn('Could not pull back:', err);
        return null;
      }
    }
    const edit = this.surface.replaceRange(start, start, text, { source: 'overflow' });
    if (focused) {
      this.area.focus({ preventScroll: true });
      this.area.setSelectionRange(selectionStart, selectionEnd, selectionDirection);
    }
    return { start: edit.start, end: edit.start + edit.insertedText.length };
  }

  /** Selected panel text dropped in the page: pulled back at the drop point. */
  onPageDrop(e) {
    const drag = this.panelDrag;
    this.panelDrag = null;
    if (!drag) return;
    const data = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
    if (data !== drag.text || this.area.value.slice(drag.start, drag.end) !== drag.text) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    this.pullBackAt(this.surface.dropOffset(e), drag);
  }

  onPanelDrop(e) {
    const drag = this.pageDrag;
    this.pageDrag = null;
    if (!drag) return;
    const data = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
    if (data && data !== drag.text) return;
    if (this.surface.getText().slice(drag.start, drag.end) !== drag.text) return;
    e.preventDefault();
    this.stash(drag.start, drag.end);
  }

  // ---------------------------------------------------------------------
  // Lifecycle
  // ---------------------------------------------------------------------

  /** Write waiting input, remove the DOM, the menu item and every listener. */
  destroy() {
    if (this.destroyed) return;
    this.flush();
    this.destroyed = true;
    this.unregisterItem();
    this.offChange();
    this.abortController.abort();
    if (!this.root.hidden) this.setPageFlag(false);
    const control = this.control();
    if (control) {
      control.removeAttribute('aria-expanded');
      control.removeAttribute('aria-controls');
    }
    this.root.remove();
  }
}

    <!-- Save, open, drafts and the Markdown export view (issues #76, #73): before editor.js, which instantiates it. -->
    <script>/*
 * Save, open, autosave drafts and the Markdown export view (issues #76, #73)
 * ==========================================================================
 *
 * MarkdownEditor creates one TePersistence in initialize() (after the
 * chrome and the Overflow panel) and passes its AbortController signal;
 * every listener uses that signal and MarkdownEditor.destroy() calls
 * destroy(), which also removes the DOM created here, revokes object URLs
 * and strips the dirty prefix from document.title. Design notes:
 * docs/design/persistence.md.
 *
 * Entry points (the Write_On corner controls, the plain toolbar's File
 * group and the keyboard all go through these; the keys act anywhere on the
 * page when `config.standalone` is true, as on index.html, and otherwise
 * only while focus is in the editor, its chrome, panels or dialogs):
 *
 *   save()          Ctrl+S / Cmd+S, floppy   dispatches cancelable te:save
 *   open()          Ctrl+O / Cmd+O, folder   dispatches cancelable te:open
 *   showMarkdown()  M↓, toolbar Markdown     dispatches cancelable te:markdown
 *
 * Each event bubbles from the chrome root (or the surface when there is no
 * chrome) with `detail.editor`; a host page that stores documents itself
 * calls preventDefault() and the default action below does not run.
 *
 * Save (default action of te:save). editor.saveDocument() serialises the
 * body plus the annotation block (and dispatches te:saved {text}); the text
 * is then written:
 *   - with the File System Access API (window.showSaveFilePicker, Chromium):
 *     the first save asks for a file (suggested name from the document key,
 *     else the first heading, else untitled.md); later saves write to the
 *     same handle without asking. Opening a file through the picker, or
 *     dropping one in Chromium, keeps its handle, so saving writes back.
 *   - otherwise (Firefox, Safari, or config.fileSystemAccess === false): a
 *     download of the .md through a Blob and an <a download>.
 * te:written {name, method: 'file' | 'download'} follows a completed write.
 * save() returns the saved text synchronously (null when cancelled or when
 * the document model is unavailable); `lastWrite` is the write's promise,
 * resolving to true when the text was written.
 *
 * Open (default action of te:open). window.showOpenFilePicker (accepting
 * .md, .markdown and .txt) or, without it, a hidden <input type=file>. A
 * Markdown or text file dropped anywhere on the editor (the surface, its
 * container, the panels, or on a standalone page the Write_On page) opens
 * too; only drops that
 * carry Files are handled, so text drags (the page, the Overflow panel) are
 * untouched. The file is read first; if the document has unsaved changes a
 * dialog then offers Save first / Discard changes / Cancel (Escape cancels).
 * The text goes through editor.openDocument(text, name), so alternatives,
 * ghosts and overflow are restored; the file name becomes the document key.
 * te:opened {name, text} follows. A host that calls editor.openDocument()
 * itself gets the same bookkeeping (documentChanged(): clean state, drafts
 * re-keyed, no file handle); a host that cancels te:save and stores the
 * text itself calls editor.persistence.markClean() once it is stored.
 *
 * Dirty state. An edit marks the document dirty at once (a dot on the save
 * controls, "• " before document.title, te:dirty-change {dirty}); after
 * `config.autosaveDelay` ms (default 1000) without edits the serialised
 * document is compared with the last saved or opened one, which also
 * catches annotation-only changes (an alternative added, a ghost, Overflow
 * typing) and clears the flag when an edit is undone.
 *
 * Drafts. On that same tick, on save and on pagehide, the serialised
 * document is kept in localStorage under
 *   terraphim-editor:draft:<draft id>
 * as JSON {v: 1, text, savedAt, name}. The draft id is `fs:<id>` for a file
 * handle (an id kept with the handle in IndexedDB), `file:<name>|<size>|
 * <lastModified>` for a file opened without a handle, and the document key
 * otherwise, so two files with the same name never share a draft. When an editor starts, or a file is
 * opened, and a draft for its key differs from the opened text (and, for a
 * file, is newer than the file's lastModified), a non-blocking notice offers
 * Restore / Discard. While the notice is up the stored draft is only
 * replaced if the new document is changed; Restore uses the copy read when
 * the notice was shown. localStorage access is wrapped in try/catch.
 *
 * Markdown export (default action of te:markdown, issue #73). A dialog with
 * editor.exportDocument() (active alternatives, no ghosted text, no
 * overflow, no annotation block) in a read-only text area, with Copy (the
 * Clipboard API, falling back to selecting the text and execCommand) and
 * Download .md (written like a save, but to a new file each time, named
 * <name>-export.md). Escape closes it and focus returns where it was.
 */

const TE_DRAFT_PREFIX = 'terraphim-editor:draft:';
const TE_DIRTY_TITLE_PREFIX = '• ';
const TE_OPEN_EXTENSIONS = ['.md', '.markdown', '.txt'];
const TE_PICKER_TYPES = [
  {
    description: 'Markdown',
    accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] },
  },
];

/** Whether a File (or { name, type }) is a Markdown or text file we open. */
function teIsOpenableFile(file) {
  if (!file) return false;
  const name = String(file.name || '').toLowerCase();
  if (TE_OPEN_EXTENSIONS.some((ext) => name.endsWith(ext))) return true;
  const type = String(file.type || '');
  return type === 'text/markdown' || type === 'text/plain' || type === 'text/x-markdown';
}

/**
 * The file name suggested for a save: the document key when it is a name
 * (not the `h:` content hash the chrome falls back to), with `.md` added
 * unless it already ends in .md, .markdown or .txt; otherwise a slug of the
 * first ATX heading in `text`; otherwise `untitled.md`. Characters that are
 * not allowed in file names are replaced with `-`.
 */
function teSuggestedFileName(key, text) {
  const clean = (s) => s.replace(/[<>:"/\\|?*\u0000-\u001f]/g, '-').trim();
  if (typeof key === 'string' && key && !key.startsWith('h:')) {
    const base = clean(key.split(/[\\/]/).pop() || '');
    if (base && base !== '.' && base !== '..') {
      const lower = base.toLowerCase();
      return TE_OPEN_EXTENSIONS.some((ext) => lower.endsWith(ext)) ? base : `${base}.md`;
    }
  }
  const heading = /^ {0,3}#{1,6}[ \t]+(.+?)[ \t]*#*[ \t]*$/m.exec(String(text || ''));
  if (heading) {
    const slug = heading[1]
      .toLowerCase()
      .replace(/[^\p{L}\p{N}]+/gu, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 60)
      .replace(/-+$/, '');
    if (slug) return `${slug}.md`;
  }
  return 'untitled.md';
}

/** `notes.md` -> `notes-export.md` (the name for a Markdown export). */
function teExportFileName(name) {
  const m = /^(.*?)(\.(md|markdown|txt))?$/i.exec(name || 'untitled.md');
  return `${m[1] || 'untitled'}-export.md`;
}

/** FNV-1a 32-bit hash, as in chrome.js (used when the chrome is absent). */
function teDraftHash(text) {
  if (typeof window.writeOnHash === 'function') return window.writeOnHash(text);
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i += 1) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

/*
 * File handle ids for draft keys: handles are structured-cloneable, so each
 * one is kept in IndexedDB (database terraphim-editor-files, store handles)
 * with a random id, and found again with isSameEntry(). Rejects when
 * IndexedDB is unavailable; the caller then falls back to name, size and
 * modification time.
 */
let teHandleDb = null;

function teIdb(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function teOpenHandleDb() {
  if (!teHandleDb) {
    const req = window.indexedDB.open('terraphim-editor-files', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles', { keyPath: 'id' });
    teHandleDb = teIdb(req).catch((err) => {
      teHandleDb = null;
      throw err;
    });
  }
  return teHandleDb;
}

async function teHandleId(handle) {
  if (!window.indexedDB || !handle || typeof handle.isSameEntry !== 'function') throw new Error('no handle store');
  const db = await teOpenHandleDb();
  const all = await teIdb(db.transaction('handles').objectStore('handles').getAll());
  for (const rec of all) {
    try {
      if (rec.handle && (await rec.handle.isSameEntry(handle))) return rec.id;
    } catch (err) {
      // A stale or foreign entry: skip it.
    }
  }
  const id = window.crypto && typeof window.crypto.randomUUID === 'function'
    ? window.crypto.randomUUID()
    : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
  await teIdb(db.transaction('handles', 'readwrite').objectStore('handles').put({ id, handle }));
  return id;
}

class TePersistence {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.signal = options.signal;
    const config = editor.config || {};
    this.config = config;
    this.fsAccess = config.fileSystemAccess !== false &&
      typeof window.showSaveFilePicker === 'function' &&
      typeof window.showOpenFilePicker === 'function';
    this.autosaveDelay = Number.isFinite(config.autosaveDelay) ? Math.max(0, config.autosaveDelay) : 1000;
    this.destroyed = false;
    this.handle = null;
    this.fileName = null;
    // Bumped whenever a different document is opened (load, a host's
    // openDocument); late save and open completions check it so they never
    // touch the document that replaced theirs.
    this.generation = 0;
    this.openSeq = 0;
    // Where drafts are stored (see draftIdentity()); null while a file
    // handle's id is being looked up.
    this.draftId = null;
    this.identityReady = Promise.resolve();
    // Ctrl/Cmd+S and Ctrl/Cmd+O everywhere on the page only when the editor
    // is the page (index.html sets it); embedded, only with focus inside.
    this.standalone = config.standalone === true;
    this.dirty = false;
    this.timer = null;
    this.quiet = 0;
    this.pendingDraft = null;
    this.lastWrite = Promise.resolve(false);
    this.objectUrls = new Set();
    this.nodes = [];
    this.dialogs = [];

    this.build();
    this.offChange = editor.surface ? editor.surface.onChange(() => this.onEdit()) : () => {};
    this.listen();

    const text = editor.surface ? editor.surface.getText() : '';
    this.key = this.initialKey(text);
    this.draftId = this.key;
    this.cleanText = this.serialise();
    this.checkDraft(null);
  }

  // ---------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------

  on(el, type, fn, opts = {}) {
    el.addEventListener(type, fn, Object.assign({ signal: this.signal }, opts));
  }

  modelAvailable() {
    return typeof window.documentModelAvailable === 'function'
      ? window.documentModelAvailable(this.editor)
      : !!(this.editor.documentApi && this.editor.documentApi());
  }

  /** The document as saved (body plus block), without dispatching te:saved. */
  serialise() {
    if (!this.modelAvailable()) return null;
    try {
      const api = this.editor.documentApi();
      this.editor.alignDocumentModel(api);
      return api.save_document();
    } catch (err) {
      console.error('Serialising the document failed', err);
      return null;
    }
  }

  initialKey(text) {
    const ed = this.editor;
    if (typeof ed.documentKey === 'string' && ed.documentKey) return ed.documentKey;
    if (typeof this.config.documentKey === 'string' && this.config.documentKey) return this.config.documentKey;
    if (ed.chrome && typeof ed.chrome.key === 'string' && ed.chrome.key) return ed.chrome.key;
    return `h:${teDraftHash(text)}`;
  }

  /** Dispatch a bubbling te:* event from the chrome root, or the surface. */
  emit(type, detail = {}, cancelable = false) {
    const chrome = this.editor.chrome;
    if (chrome && !chrome.destroyed && typeof chrome.emit === 'function') {
      return chrome.emit(type, detail, cancelable);
    }
    const ev = new CustomEvent(type, {
      bubbles: true,
      cancelable,
      detail: Object.assign({ editor: this.editor }, detail),
    });
    (this.editor.input || document).dispatchEvent(ev);
    return ev;
  }

  suggestedName() {
    if (this.fileName) return this.fileName;
    const ed = this.editor;
    const key = (typeof ed.documentKey === 'string' && ed.documentKey) || this.config.documentKey || this.key;
    return teSuggestedFileName(key, ed.surface ? ed.surface.getText() : '');
  }

  // ---------------------------------------------------------------------
  // DOM: notice, dialogs, hidden file input, plain toolbar buttons
  // ---------------------------------------------------------------------

  build() {
    const notice = document.createElement('div');
    notice.className = 'te-files-notice';
    notice.setAttribute('role', 'region');
    notice.setAttribute('aria-label', 'Document notice');
    notice.hidden = true;
    const text = document.createElement('span');
    text.className = 'te-files-notice-text';
    text.setAttribute('aria-live', 'polite');
    const actions = document.createElement('span');
    actions.className = 'te-files-notice-actions';
    notice.append(text, actions);
    document.body.appendChild(notice);
    this.nodes.push(notice);
    this.notice = notice;
    this.noticeText = text;
    this.noticeActions = actions;

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.md,.markdown,.txt,text/markdown,text/plain';
    input.className = 'te-files-input';
    input.hidden = true;
    input.tabIndex = -1;
    input.setAttribute('aria-hidden', 'true');
    this.on(input, 'change', () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (file) this.lastOpen = this.openFile(file, null);
    });
    document.body.appendChild(input);
    this.nodes.push(input);
    this.fileInput = input;

    this.buildToolbar();
  }

  /** Open, Save and Markdown buttons at the start of the plain toolbar. */
  buildToolbar() {
    const container = this.editor.input && this.editor.input.closest('.editor-container');
    const toolbar = container && container.querySelector('.toolbar');
    if (!toolbar) return;
    const group = document.createElement('sl-button-group');
    group.setAttribute('label', 'File');
    group.className = 'te-files-toolbar';
    const button = (name, icon, label, tip, onClick) => {
      const tooltip = document.createElement('sl-tooltip');
      tooltip.setAttribute('content', tip);
      const b = document.createElement('sl-button');
      b.setAttribute('size', 'small');
      b.dataset.teFile = name;
      const i = document.createElement('i');
      i.className = icon;
      i.setAttribute('aria-hidden', 'true');
      const span = document.createElement('span');
      span.className = 'te-files-sr';
      span.textContent = label;
      b.append(i, span);
      this.on(b, 'click', onClick);
      tooltip.appendChild(b);
      group.appendChild(tooltip);
      return b;
    };
    button('open', 'fa-regular fa-folder-open', 'Open document', 'Open (Ctrl+O)', () => this.open());
    this.toolbarSave = button('save', 'fa-solid fa-floppy-disk', 'Save document', 'Save (Ctrl+S)', () => this.save());
    button('markdown', 'fa-brands fa-markdown', 'Markdown export', 'Markdown export', () => this.showMarkdown());
    button('knowledge-graph', 'fa-solid fa-share-nodes', 'Knowledge graph', 'Share your alternatives as a knowledge graph', () => this.showKnowledgeGraph());
    const divider = document.createElement('sl-divider');
    divider.setAttribute('vertical', '');
    divider.className = 'te-files-toolbar-divider';
    toolbar.insertBefore(divider, toolbar.firstChild);
    toolbar.insertBefore(group, divider);
    this.nodes.push(group, divider);
  }

  /**
   * Show the notice with `message` and `actions` ([{ label, onClick }]); a
   * null message hides it.
   */
  showNotice(message, actions = [], kind = 'info') {
    if (this.destroyed) return;
    this.noticeActions.replaceChildren();
    if (!message) {
      this.notice.hidden = true;
      this.noticeText.textContent = '';
      delete this.notice.dataset.kind;
      return;
    }
    this.notice.dataset.kind = kind;
    this.noticeText.textContent = message;
    const all = actions.length ? actions : [{ label: 'Dismiss', onClick: () => this.showNotice(null) }];
    for (const action of all) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'te-files-notice-button';
      b.dataset.action = action.name || action.label.toLowerCase();
      b.textContent = action.label;
      this.on(b, 'click', action.onClick);
      this.noticeActions.appendChild(b);
    }
    this.notice.hidden = false;
  }

  /** A native modal <dialog> owned by this module; removed on destroy(). */
  makeDialog(className, titleText) {
    const dialog = document.createElement('dialog');
    dialog.className = `te-files-dialog ${className}`;
    const id = `${className}-title`;
    dialog.setAttribute('aria-labelledby', id);
    const header = document.createElement('div');
    header.className = 'te-files-dialog-header';
    const title = document.createElement('h2');
    title.id = id;
    title.textContent = titleText;
    header.appendChild(title);
    dialog.appendChild(header);
    document.body.appendChild(dialog);
    this.nodes.push(dialog);
    this.dialogs.push(dialog);
    // A click on the backdrop (outside the box) closes it.
    this.on(dialog, 'click', (e) => {
      if (e.target === dialog) dialog.close();
    });
    return { dialog, header };
  }

  openDialog(dialog, focusEl) {
    const back = document.activeElement;
    this.on(dialog, 'close', () => {
      // A dialog replaced by a new one (showMarkdown) leaves focus there.
      if (dialog.dataset.teReplaced) return;
      if (back && back.isConnected && typeof back.focus === 'function') back.focus();
    }, { once: true });
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
    if (focusEl) focusEl.focus();
  }

  dialogButton(parent, label, opts = {}) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `te-files-button ${opts.className || ''}`.trim();
    if (opts.name) b.dataset.action = opts.name;
    if (opts.icon) {
      const i = document.createElement('i');
      i.className = opts.icon;
      i.setAttribute('aria-hidden', 'true');
      b.appendChild(i);
    }
    const span = document.createElement('span');
    span.textContent = label;
    b.appendChild(span);
    if (opts.ariaLabel) b.setAttribute('aria-label', opts.ariaLabel);
    if (opts.onClick) this.on(b, 'click', opts.onClick);
    parent.appendChild(b);
    return b;
  }

  // ---------------------------------------------------------------------
  // Listeners
  // ---------------------------------------------------------------------

  listen() {
    // Ctrl+S / Cmd+S saves and Ctrl+O / Cmd+O opens, and the browser's own
    // Save page and Open file are prevented: anywhere on a standalone page,
    // but in an embedding page only while focus is in the editor, its chrome,
    // panels or dialogs, so the host's own shortcuts keep working.
    this.on(document, 'keydown', (e) => {
      if (this.destroyed || e.defaultPrevented || e.isComposing) return;
      if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
      if (!this.standalone && !this.ownsFocus(e.target)) return;
      const key = (e.key || '').toLowerCase();
      if (key === 's') {
        e.preventDefault();
        this.save();
      } else if (key === 'o') {
        e.preventDefault();
        this.open();
      }
    });
    // Annotation-only changes (panel typing, Overflow) reach the model
    // without a surface edit; check on the debounced tick.
    const nudge = () => this.schedule();
    this.on(document, 'input', nudge);
    this.on(document, 'keyup', nudge);
    this.on(document, 'pointerup', nudge);
    // Keep the latest draft when the page goes away.
    this.on(window, 'pagehide', () => this.flushDraft());
    // Files dropped on the editor open; text drags are left alone.
    this.on(document, 'dragover', (e) => {
      if (!this.isFileDrag(e)) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });
    this.on(document, 'drop', (e) => this.onDrop(e));
  }

  /** Whether `target` is inside the editor, its chrome, panels or dialogs. */
  ownsFocus(target) {
    if (!(target instanceof Node)) return false;
    const el = target.nodeType === 1 ? target : target.parentElement;
    if (!el) return false;
    const container = this.editor.input && (this.editor.input.closest('.editor-container') || this.editor.input);
    if (container && container.contains(el)) return true;
    return !!el.closest(
      '.te-chrome, .te-overflow, .te-alt-panel, .te-blocks, .te-selection-menu, .te-files-dialog, .te-files-notice',
    );
  }

  isFileDrag(e) {
    if (this.destroyed || !e.dataTransfer) return false;
    const types = Array.from(e.dataTransfer.types || []);
    if (!types.includes('Files')) return false;
    return this.inScope(e.target);
  }

  /**
   * Drops on the editor, its chrome and panels, or (on a standalone page
   * only) the bare page: an embedded editor never takes a file dropped on
   * the host page around it (#77).
   */
  inScope(target) {
    if (!(target instanceof Node)) return false;
    if (target === document.body || target === document.documentElement || target === document) return this.standalone;
    const el = target.nodeType === 1 ? target : target.parentElement;
    if (!el) return false;
    const container = this.editor.input && (this.editor.input.closest('.editor-container') || this.editor.input);
    if (container && container.contains(el)) return true;
    return !!el.closest('.te-chrome, .te-overflow, .te-alt-panel, .te-blocks, .te-files-notice');
  }

  onDrop(e) {
    if (!this.isFileDrag(e)) return;
    e.preventDefault();
    const dt = e.dataTransfer;
    const files = Array.from(dt.files || []);
    const index = files.findIndex(teIsOpenableFile);
    if (index < 0) {
      this.showNotice(
        files.length ? `${files[0].name} is not a Markdown or text file.` : 'Nothing to open in that drop.',
        [],
        'error',
      );
      return;
    }
    const file = files[index];
    // In Chromium a dropped file can give a writable handle, so the next
    // save writes back to it; it must be requested during the drop event.
    let handlePromise = null;
    if (this.fsAccess && dt.items) {
      const items = Array.from(dt.items).filter((it) => it.kind === 'file');
      const item = items[index];
      if (item && typeof item.getAsFileSystemHandle === 'function') {
        try {
          handlePromise = item.getAsFileSystemHandle();
        } catch (err) {
          handlePromise = null;
        }
      }
    }
    const go = async () => {
      let handle = null;
      if (handlePromise) {
        try {
          const h = await handlePromise;
          if (h && h.kind === 'file') handle = h;
        } catch (err) {
          handle = null;
        }
      }
      return this.openFile(file, handle);
    };
    this.lastOpen = go();
  }

  // ---------------------------------------------------------------------
  // Dirty state and drafts
  // ---------------------------------------------------------------------

  onEdit() {
    if (this.destroyed || this.quiet > 0 || !this.modelAvailable()) return;
    this.setDirty(true);
    this.schedule();
  }

  schedule() {
    if (this.destroyed || this.quiet > 0 || !this.modelAvailable()) return;
    if (this.timer !== null) clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      this.timer = null;
      this.tick();
    }, this.autosaveDelay);
  }

  /** Compare with the clean text, update the flag and keep the draft. */
  tick() {
    if (this.destroyed) return;
    const text = this.serialise();
    if (text === null) return;
    const dirty = text !== this.cleanText;
    this.setDirty(dirty);
    // While a restore notice is up, only a changed document replaces the
    // stored draft (Restore uses the copy read when the notice appeared).
    if (this.pendingDraft && !dirty) return;
    this.writeDraft(text);
  }

  /** Run a pending tick now (pagehide, and before a dirty check). */
  flushDraft() {
    if (this.timer === null) return;
    clearTimeout(this.timer);
    this.timer = null;
    this.tick();
  }

  isDirty() {
    this.flushDraft();
    return this.dirty;
  }

  setDirty(dirty) {
    if (this.destroyed) return;
    const changed = dirty !== this.dirty;
    this.dirty = dirty;
    // Per keystroke this is only the flag: the DOM changes with it.
    if (!changed) return;
    this.applyTitle(dirty);
    const control = this.editor.chrome && this.editor.chrome.root
      ? this.editor.chrome.root.querySelector('[data-control="save"]')
      : null;
    for (const el of [control, this.toolbarSave]) {
      if (!el) continue;
      el.classList.toggle('te-dirty', dirty);
      if (el === control) el.setAttribute('aria-label', dirty ? 'Save document (unsaved changes)' : 'Save document');
    }
    this.emit('te:dirty-change', { dirty });
  }

  /**
   * Record the current document as saved: clears the dirty state and keeps
   * a draft. For hosts that cancel te:save and store the text themselves.
   */
  markClean() {
    if (this.destroyed) return;
    this.cancelTick();
    const text = this.serialise();
    if (text === null) return;
    this.cleanText = text;
    this.setDirty(false);
    this.writeDraft(text);
  }

  /**
   * editor.openDocument() was called by someone other than this module (a
   * host page loading its own document): take the opened text as clean,
   * re-key drafts to the new document key and forget the file handle.
   * load() and restoreDraft() open quietly and do their own bookkeeping.
   */
  documentChanged(name) {
    if (this.destroyed || this.quiet > 0) return;
    this.generation += 1;
    this.cancelTick();
    this.handle = null;
    this.fileName = typeof name === 'string' && name ? name : null;
    const key = this.editor.documentKey;
    if (typeof key === 'string' && key) this.key = key;
    this.draftId = this.key;
    this.identityReady = Promise.resolve();
    this.cleanText = this.serialise();
    this.setDirty(false);
    this.showNotice(null);
    this.checkDraft(null);
  }

  /**
   * Prefix document.title while dirty. The title before marking is kept and
   * put back when clean, unless the page changed the title meanwhile (the
   * getter collapses whitespace, so string surgery on it is unreliable).
   */
  applyTitle(dirty) {
    if (this.config.dirtyTitle === false) return;
    if (dirty) {
      if (this.markedTitle !== undefined) return;
      this.baseTitle = document.title;
      document.title = TE_DIRTY_TITLE_PREFIX + this.baseTitle;
      this.markedTitle = document.title;
    } else if (this.markedTitle !== undefined) {
      if (document.title === this.markedTitle) document.title = this.baseTitle;
      this.markedTitle = undefined;
    }
  }

  draftKey(key = this.draftId) {
    return TE_DRAFT_PREFIX + key;
  }

  readDraft(key = this.draftId) {
    if (key === null) return null;
    try {
      const raw = window.localStorage.getItem(this.draftKey(key));
      if (!raw) return null;
      const d = JSON.parse(raw);
      return d && typeof d.text === 'string' ? d : null;
    } catch (err) {
      return null;
    }
  }

  writeDraft(text) {
    if (this.draftId === null) return; // the file's identity is still being looked up
    try {
      window.localStorage.setItem(this.draftKey(), JSON.stringify({
        v: 1, text, savedAt: Date.now(), name: this.fileName,
      }));
    } catch (err) {
      // Storage unavailable or full: saving to a file still works.
    }
  }

  removeDraft(key = this.draftId) {
    if (key === null) return;
    try {
      window.localStorage.removeItem(this.draftKey(key));
    } catch (err) {
      // Nothing to do.
    }
  }

  /**
   * Offer to restore the stored draft for the current key when it differs
   * from the opened document and, for a file, is newer than it. With no
   * draft to offer only a restore notice is withdrawn: after load() this
   * runs when the file's draft id has been looked up, which can be after a
   * save straight after the open has shown its own notice.
   */
  checkDraft(file) {
    this.pendingDraft = null;
    const draft = this.readDraft();
    if (!draft || this.cleanText === null || draft.text === this.cleanText) {
      this.hideDraftNotice();
      return;
    }
    if (file && Number.isFinite(file.lastModified) && Number(draft.savedAt) <= file.lastModified) {
      this.hideDraftNotice();
      return;
    }
    this.pendingDraft = draft;
    const when = Number.isFinite(Number(draft.savedAt)) ? new Date(Number(draft.savedAt)) : null;
    const stamp = when
      ? when.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
      : 'an earlier session';
    const whose = draft.name ? draft.name : 'this document';
    this.showNotice(`Unsaved draft of ${whose} from ${stamp} found.`, [
      { name: 'restore', label: 'Restore', onClick: () => this.restoreDraft() },
      { name: 'discard', label: 'Discard', onClick: () => this.discardDraft() },
    ], 'draft');
  }

  hideDraftNotice() {
    if (this.notice.dataset.kind === 'draft') this.showNotice(null);
  }

  restoreDraft() {
    const draft = this.pendingDraft;
    if (!draft || this.destroyed) return false;
    this.pendingDraft = null;
    this.showNotice(null);
    this.quiet += 1;
    try {
      // Keep the key the draft was stored under (a name or the hash).
      this.editor.openDocument(draft.text, this.key);
    } finally {
      this.quiet -= 1;
    }
    this.cancelTick();
    const text = this.serialise();
    this.setDirty(text !== this.cleanText);
    if (text !== null) this.writeDraft(text);
    if (this.editor.surface) this.editor.surface.focus();
    this.emit('te:draft-restored', { text: draft.text });
    return true;
  }

  discardDraft() {
    this.pendingDraft = null;
    this.showNotice(null);
    this.removeDraft();
    // Keep a draft of current unsaved work, if any.
    if (this.dirty) this.tick();
    if (this.editor.surface) this.editor.surface.focus();
  }

  cancelTick() {
    if (this.timer !== null) clearTimeout(this.timer);
    this.timer = null;
  }

  /** Re-key to `name` after a save-as, carrying the Write_On mode with it. */
  rekey(name) {
    if (!name || name === this.key) return;
    this.key = name;
    this.editor.documentKey = name;
    const chrome = this.editor.chrome;
    if (chrome && !chrome.destroyed && typeof chrome.setMode === 'function') {
      chrome.key = name;
      chrome.setMode(chrome.mode);
    }
  }

  /** Move the stored draft from one draft id to another. */
  moveDraft(from, to) {
    if (from === null || to === null || from === to) return;
    const draft = this.readDraft(from);
    if (draft) {
      try {
        window.localStorage.setItem(this.draftKey(to), JSON.stringify(Object.assign(draft, { name: this.fileName })));
      } catch (err) {
        // Storage unavailable: nothing to move.
      }
    }
    this.removeDraft(from);
  }

  /**
   * Where a document's drafts are stored, so two files with the same name
   * never share one:
   *   - a File System Access handle: `fs:<id>`, an id kept with the handle
   *     in IndexedDB and found again with isSameEntry();
   *   - a file without a handle (file input, drop outside Chromium):
   *     `file:<name>|<size>|<lastModified>` as read at open;
   *   - otherwise (unnamed documents, a host's openDocument, downloads):
   *     the document key, as before.
   * Sets `draftId` (null until a handle's id is known; drafts are not
   * written meanwhile) and returns `identityReady`, which resolves once it
   * is set. Only applies if no other document was opened in the meantime.
   */
  setDraftIdentity({ handle = null, name = null, size = null, lastModified = null } = {}, onReady = null) {
    const gen = this.generation;
    const fileKey = name && Number.isFinite(lastModified)
      ? `file:${name}|${Number.isFinite(size) ? size : ''}|${lastModified}`
      : null;
    const fallback = fileKey || this.key;
    if (!handle) {
      this.draftId = fallback;
      this.identityReady = Promise.resolve();
      if (onReady) onReady();
      return this.identityReady;
    }
    this.draftId = null;
    this.identityReady = teHandleId(handle).then((id) => `fs:${id}`, () => fallback).then((key) => {
      if (this.destroyed || gen !== this.generation) return;
      this.draftId = key;
      if (onReady) onReady();
      if (this.dirty) this.tick();
    });
    return this.identityReady;
  }

  // ---------------------------------------------------------------------
  // Save
  // ---------------------------------------------------------------------

  /**
   * Dispatch te:save; unless cancelled, serialise with editor.saveDocument()
   * and write the text (see the header). Returns the text, or null.
   */
  save() {
    if (this.destroyed) return null;
    const available = this.modelAvailable();
    const ev = this.emit('te:save', { available }, true);
    if (ev.defaultPrevented || !available) return null;
    let text;
    try {
      text = this.editor.saveDocument();
    } catch (err) {
      console.error('saveDocument failed', err);
      return null;
    }
    this.cancelTick();
    this.writeDraft(text);
    // The document this save belongs to: if another is opened before the
    // write completes, the write still finishes (to the old file) but the
    // new document's handle, key and clean state are left alone.
    const gen = this.generation;
    const write = this.writeFile(text, this.suggestedName(), { keepHandle: true, generation: gen });
    this.lastWrite = write.then((result) => {
      if (!result || this.destroyed) return false;
      if (gen !== this.generation) {
        this.emit('te:written', { name: result.name, method: result.method, text, stale: true });
        return true;
      }
      if (result.keepDirty) {
        // Only a copy was written (the document's own file refused
        // permission): the document stays dirty, the notice says why.
        this.emit('te:written', { name: result.name, method: result.method, text, copy: true });
        return true;
      }
      this.cleanText = text;
      const now = this.serialise();
      this.setDirty(now !== null && now !== text);
      this.emit('te:written', { name: result.name, method: result.method, text });
      return true;
    });
    return text;
  }

  /**
   * Write `text`. Resolves to { name, method } or null (cancelled or
   * failed). With `keepHandle`, the first picker result is kept and reused.
   * The picker is requested synchronously so the click or key press that
   * started the save still counts as user activation.
   *
   * A kept handle may be read-only: handles from showOpenFilePicker() and
   * dropped files are, until the user grants write access. Before writing,
   * its permission is queried and, unless granted, requested (in the same
   * task chain as the click or key press, within its activation). If it is
   * refused, the text is saved elsewhere and nothing is lost: a save-as
   * picker (the chosen file becomes the document, which is then clean), or,
   * if the picker is refused too, a download of a copy, which leaves the
   * document dirty (`keepDirty`) because its own file is unchanged. A
   * cancelled picker writes nothing. The notice tells the user each time.
   */
  writeFile(text, name, { keepHandle = false, generation = this.generation } = {}) {
    if (!this.fsAccess) return Promise.resolve(this.download(text, name));
    const pick = () => {
      try {
        return window.showSaveFilePicker({ suggestedName: name, types: TE_PICKER_TYPES });
      } catch (err) {
        return Promise.reject(err);
      }
    };
    let handlePromise;
    let refused = null; // the kept file that refused write permission
    if (keepHandle && this.handle) {
      const kept = this.handle;
      handlePromise = this.ensureWritable(kept).then((ok) => {
        if (ok) return kept;
        refused = kept.name;
        return pick();
      });
    } else {
      handlePromise = pick();
    }
    return handlePromise.then(
      async (handle) => {
        try {
          const writable = await handle.createWritable();
          await writable.write(text);
          await writable.close();
        } catch (err) {
          console.error('Writing the file failed', err);
          this.showNotice(`Could not write ${handle.name}: ${err.message || err.name}.`, [], 'error');
          return null;
        }
        if (keepHandle && handle !== this.handle) {
          // The written file's size and time: the draft id falls back to
          // them when the handle cannot be kept in IndexedDB, so two files
          // with the same name still get different ids.
          let meta = {};
          try {
            const written = await handle.getFile();
            meta = { name: written.name, size: written.size, lastModified: written.lastModified };
          } catch (err) {
            meta = { name: handle.name };
          }
          if (generation === this.generation && !this.destroyed && handle !== this.handle) {
            // A first save-as: the chosen file becomes the document. Its
            // draft id is chosen once here and kept for the session (later
            // saves change the file's size and time, not the id).
            const oldDraft = this.draftId;
            this.handle = handle;
            this.fileName = handle.name;
            this.rekey(handle.name);
            this.setDraftIdentity(Object.assign({ handle }, meta), () => this.moveDraft(oldDraft, this.draftId));
          }
        }
        if (refused) this.showNotice(`No permission to write ${refused}: saved as ${handle.name} instead.`, [], 'error');
        return { name: handle.name, method: 'file' };
      },
      (err) => {
        if (err && err.name === 'AbortError') {
          // The user cancelled the picker: nothing written, still dirty.

  /** Download `text` as `name` through a Blob and an <a download>. */

  /** Dispatch te:open; unless cancelled, ask for a file and open it. */

      async ([handle]) => this.openFile(await handle.getFile(), handle),

  /**

   * Resolves to true when it was opened.

  async openFile(file, handle = null) {

  }

  /** Save first / Discard changes / Cancel before replacing a dirty document. */
  askReplace(name) {

      const { dialog } = this.makeDialog('te-files-replace', 'Unsaved changes');

  removeDialog(dialog) {
    dialog.remove();
    this.nodes = this.nodes.filter((n) => n !== dialog);
    this.dialogs = this.dialogs.filter((n) => n !== dialog);
    if (this.replaceDialog === dialog) this.replaceDialog = null;

  }

  // ---------------------------------------------------------------------
  // Markdown export view (issue #73)
  // ---------------------------------------------------------------------

  exportText() {
    if (this.modelAvailable()) {

        return this.editor.exportDocument();
      } catch (err) {
        console.error('exportDocument failed', err);
      }

    return this.editor.surface ? this.editor.surface.getText() : '';
  }

  /** Dispatch te:markdown; unless cancelled, show the export dialog. */

  }

  /** Explain and explicitly share the real document-derived synonym graph. */
  showKnowledgeGraph() {
    if (this.destroyed) return null;

      const old = this.knowledgeGraphDialog;

    }
    const { dialog, header } = this.makeDialog('te-files-graph', 'Knowledge graph');

      name: 'close', className: 'te-files-close', ariaLabel: 'Close knowledge graph',
      onClick: () => dialog.close(),
    });

    note.className = 'te-files-dialog-text';

    const list = document.createElement('ul');
    list.className = 'te-files-concepts';
    list.setAttribute('aria-label', 'Connected alternatives');
    const footer = document.createElement('div');

          name: 'download-graph', className: 'te-files-primary', onClick: () => {
            const result = this.download(graph + '\n', 'knowledge-graph.json', 'application/json;charset=utf-8');

          name: 'download-graph-text', onClick: () => {
            const result = this.download(clean, name);
            status.textContent = `Downloaded ${result.name}. Search this text using your graph.`;
            this.emit('te:written', { ...result, text: clean, export: true });
          },
        });
      }
    } catch (error) {
      status.textContent = String(error.message || error);
    }
    dialog.appendChild(footer);
    this.on(dialog, 'close', () => this.removeDialog(dialog), { once: true });
    this.knowledgeGraphDialog = dialog;
    this.openDialog(dialog, close);
    return dialog;
  }

  /** Copy the export: the Clipboard API, else select and execCommand. */
  async copyExport(area, status) {
    const copied = 'Copied to the clipboard.';
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      try {
        await navigator.clipboard.writeText(area.value);
        status.textContent = copied;
        return 'clipboard';
      } catch (err) {
        // Permission or focus refused: fall back below.
      }
    }
    area.focus();
    area.select();
    let ok = false;
    try {
      ok = document.execCommand('copy');
    } catch (err) {
      ok = false;
    }
    status.textContent = ok
      ? copied
      : 'Copying is blocked here: the text is selected, press Ctrl+C (Cmd+C on a Mac).';
    return ok ? 'execCommand' : 'selected';
  }

  // ---------------------------------------------------------------------
  // Lifecycle
  // ---------------------------------------------------------------------

  /** Remove the DOM, timers and object URLs; restore document.title. */
  destroy() {
    if (this.destroyed) return;
    // Keep the latest unsaved work as a draft before tearing down.
    this.flushDraft();
    this.cancelTick();
    for (const d of this.dialogs) {
      if (d.open) d.close();
    }
    this.destroyed = true;
    this.offChange();
    for (const node of this.nodes) node.remove();
    this.nodes = [];
    this.dialogs = [];
    for (const url of this.objectUrls) URL.revokeObjectURL(url);
    this.objectUrls.clear();
    this.applyTitle(false);
  }
}

window.TePersistence = TePersistence;
window.teSuggestedFileName = teSuggestedFileName;
window.teExportFileName = teExportFileName;
window.teIsOpenableFile = teIsOpenableFile;

    const next = [];
    for (const item of list || []) {
      const s = this.snap(Math.max(0, Math.min(len, item.start | 0)));
      const e = this.snap(Math.max(0, Math.min(len, item.end | 0)));
      if (e <= s) continue;
      next.push({
        id: item.id === undefined ? String(this.nextDecorationId++) : String(item.id),
        start: s,
        end: e,
        className: item.className || '',
        data: item.data,
        attributes: EditorSurface.sanitiseAttributes(item.attributes),
      });
    }
    next.sort((a, b) => a.start - b.start || a.end - b.end);
    const sel = this.getSelectionOffsets();
    this.decorations = next;
    this.render();
    if (this.readSelection() !== null || document.activeElement === this.root) {
      this.setSelectionOffsets(sel.start, sel.end, sel.direction);
    }
    return this.getDecorations();
  }

  /**
   * The decoration attributes that may be set on rendered spans: `role`,
   * `aria-*` and `data-*` names in plain lowercase attribute-name syntax,
   * except `data-te-decoration`, which the surface owns. Anything else
   * (event handlers, `style`, `href`, namespaced names, ...) is dropped with
   * a console warning; this never throws. Returns a new map, or null when
   * nothing is left.
   */
  static sanitiseAttributes(attributes, warn = true) {
    if (!attributes || typeof attributes !== 'object') return null;
    const out = {};
    let any = false;
    for (const [name, value] of Object.entries(attributes)) {
      if (EditorSurface.isSafeAttributeName(name)) {
        out[name] = String(value);
        any = true;
      } else if (warn) {
        console.warn(`EditorSurface: decoration attribute "${name}" is not allowed and was ignored`);
      }
    }
    return any ? out : null;
  }

  static isSafeAttributeName(name) {
    if (typeof name !== 'string' || name === 'data-te-decoration') return false;
    return name === 'role' || /^aria-[a-z]+$/.test(name) || /^data-[a-z0-9_.-]*[a-z0-9_]$/.test(name);
  }

  /** Current decorations (already mapped through any edits). */
  getDecorations() {
    return this.decorations.map((d) => ({ ...d }));
  }

  /** Decorations covering `offset` (start <= offset < end). */
  decorationsAt(offset) {
    return this.decorations.filter((d) => d.start <= offset && offset < d.end).map((d) => ({ ...d }));
  }

  clearDecorations() {
    return this.setDecorations([]);
  }

  /**
   * Subscribe to text changes. The callback receives { text, edit, source }
   * where edit is { start, deletedLength, deletedText, insertedText }.
   * Returns an unsubscribe function.
   */
  onChange(callback) {
    this.changeListeners.add(callback);
    return () => this.changeListeners.delete(callback);
  }

  /**
   * Forget the undo history so the current text becomes the base state.
   * Used when a different document is opened: undo must not step back into
   * the previous file.
   */
  resetHistory() {
    this.history = [];
    this.historyIndex = -1;
    this.record('init', this.lastSelection);
  }

  /**
   * Fold the last `count` history entries into one undo step (the Blocks
   * view uses it to keep a block move and its separator fix-up together).
   * The merged entry keeps every step in order, so undo replays them in
   * reverse (a recorded text move as a move) and redo replays them forward.
   * Returns false, changing nothing, when there are fewer than `count`
   * entries after the base state or one of them has no exact steps.
   */
  squashHistory(count, source = null) {
    const first = this.historyIndex - count + 1;
    if (count < 2 || first < 1) return false;
    const group = this.history.slice(first, this.historyIndex + 1);
    if (group.some((entry) => !entry.edits)) return false;
    const last = group[group.length - 1];
    const merged = {
      ...last,
      source: source || last.source,
      edits: group.flatMap((entry) => entry.edits),
    };
    if (group.some((entry) => entry.ghostHistory || entry.edits.some((step) => step.ghost))) merged.ghostHistory = true;
    this.history.splice(first, count, merged);
    this.historyIndex = first;
    return true;
  }

  /**
   * Enforce historyLimit now (dropping the oldest steps), after it was
   * lifted for a while (the alternatives panel lifts it during a live
   * addition, issue #106, so the steps it folds cannot be shifted out).
   */
  trimHistory() {
    const extra = this.history.length - this.historyLimit;
    if (extra <= 0) return;
    const drop = Math.min(extra, this.historyIndex);
    if (drop <= 0) return;
    this.history.splice(0, drop);
    this.historyIndex -= drop;
  }

  /**
   * Drop the steps redo would replay (the alternatives panel uses it after
   * undoing a cancelled addition, issue #106, so it cannot be redone).
   */
  forgetRedo() {
    this.history.length = this.historyIndex + 1;
  }

  canUndo() {
    if (this.historyOwner) return true;
    return this.historyIndex > 0;
  }

  canRedo() {
    if (this.historyOwner) return true;
    return this.historyIndex < this.history.length - 1;
  }

  undo() {
    if (this.historyOwner) { this.historyOwner.undo(); return true; }
    if (!this.canUndo()) return false;
    const undone = this.history[this.historyIndex];
    if (undone.ghostHistory || (undone.edits && undone.edits.some((step) => step.ghost))) {
      return this.replayGhostHistory(this.historyIndex - 1, 'undo', undone.edits);
    }
    this.historyIndex -= 1;
    const steps = undone.edits ? undone.edits.slice().reverse().map(EditorSurface.invertStep) : null;
    this.restore(this.history[this.historyIndex], 'undo', steps);
    return true;
  }

  redo() {
    if (this.historyOwner) { this.historyOwner.redo(); return true; }
    if (!this.canRedo()) return false;
    const next = this.history[this.historyIndex + 1];
    if (next.ghostHistory || (next.edits && next.edits.some((step) => step.ghost))) {
      return this.replayGhostHistory(this.historyIndex + 1, 'redo', next.edits);
    }
    this.historyIndex += 1;
    const entry = this.history[this.historyIndex];
    this.restore(entry, 'redo', entry.edits);
    return true;
  }

  /** Ghost groups never enter legacy restore/diff or best-effort listeners. */
  replayGhostHistory(index, source, steps) {
    if (!this.ghostHistoryAdapter) return false;
    try {
      if (source === 'undo' && Array.isArray(steps)) steps = steps.slice().reverse().map(EditorSurface.invertStep);
      this.ghostHistoryAdapter.replayGhostHistory(index, source, steps);
      return true;
