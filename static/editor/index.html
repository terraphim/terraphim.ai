  close({ restoreFocus = true } = {}) {
    if (!this.element) return;
    const ctx = this.context;
    if (this.openController) this.openController.abort();
    this.openController = null;
    this.element.remove();
    this.element = null;
    this.visible = [];
    this.activeIndex = -1;
    this.context = null;
    if (this.surface.root) this.surface.root.removeAttribute('aria-controls');
    if (restoreFocus && ctx && !this.surface.destroyed) {
      this.surface.focus();
      const sel = ctx.selection;
      this.surface.setSelectionOffsets(sel.start, sel.end, sel.direction === 'none' ? undefined : sel.direction);
    }
  }

  destroy() {
    if (this.destroyed) return;
    this.close({ restoreFocus: false });
    this.destroyed = true;
    this.items = [];
    this.abortController.abort();
  }
}

window.TeGhostLayer = TeGhostLayer;
window.TeSelectionMenu = TeSelectionMenu;
</script>
    <!-- Trim levels (issue #15), then the Lab popover that hosts them (issue #14): after indicators.js, before editor.js. -->
    <script>/*
 * Trim levels, the faded preview and the status card (issue #15, spec R-8.3
 * to R-8.5)
 * ==========================================================================
 *
 * TeLabTrim is created by TeLabPopover (public/js/lab.js) and fills its
 * `data-slot="trim"` with the five level buttons (R-8.3): Original ·
 * Slight trim ~10% · Tighten more ~20% · Even sharper ~30% · Cut in half
 * ~50%. Reachable as `editor.lab.trim`.
 *
 * Engine and bridge
 * -----------------
 * The spans come from the deterministic trim engine (crates/terraphim_lab,
 * `trim_plan`) through src/lab.rs: `trim_plan_json()` (computed once per
 * version of the body and cached with it), `trim_status(level, kept)` (the
 * card numbers plus the active pieces to fade, keeps applied and outer cuts
 * split around kept ranges) and `trim_make_cuts(level, kept)` (typed edits).
 * Every call aligns the model with the surface first. The card's count line
 * is the engine's `card_text()` verbatim, so it always equals the engine.
 *
 * Preview, never a rewrite (R-8.4)
 * --------------------------------
 * A level fades its active pieces in the `lab-trim` layer of the decoration
 * registry (never `setDecorations` directly), class `te-trim-faded`. That
 * class uses the ghost fade token (`--te-ghost-opacity`) but is not
 * `te-ghost`: trim previews and user ghosts stay distinguishable, and the
 * preview never calls `ghost_range`/`revive_range`, so no ghost is ever
 * written into the document model and user-set ghosts are untouched.
 * Preview items carry no attributes (as with ghosts), so the indicators'
 * `aria-describedby` on shared text is never overwritten; the card and the
 * walk-through line announce what would go. Previewing, keeping, walking,
 * Done and Original never touch the undo history.
 *
 * Keep (R-8.5)
 * ------------
 * While the card is shown, clicking a faded span keeps the OUTERMOST faded
 * cut under the pointer: the rendered segment lists every decoration over
 * it (`data-te-decoration`), each `lab-trim` piece on it covers the whole
 * segment, and the widest of their cuts (by the plan's own range) is kept.
 * Keeping a sentence therefore also keeps the fillers faded inside it. The
 * card and the preview are recomputed with one `trim_status` call. Kept ids
 * survive level changes within one plan; Original forgets them. Keyboard:
 * Walk through, then Keep (or K) on the current cut.
 *
 * Make the cuts
 * -------------
 * `trim_make_cuts` returns the engine's edits on the current body (cuts plus
 * the punctuation, capitalisation, whitespace and emptied-block tidy-ups).
 * They are applied with `EditorSurface.replaceRanges(edits, { source:
 * 'trim' })`: each edit goes through the normal edit path (the model mirrors
 * it with `apply_edit`, so spans and ghosts follow the usual rules) but the
 * whole set is ONE history entry; undo replays the inverses and the model
 * re-attaches the annotations the cuts detached, so text and annotations
 * both come back. A plan whose body no longer matches is refused by the
 * bridge: the plan is recomputed and nothing is cut.
 *
 * Walk through (decision)
 * -----------------------
 * Navigation only: it steps through the active pieces in document order
 * (Previous / Next, ArrowLeft / ArrowRight), marks the current one
 * (`te-trim-current`) and scrolls it into view, announces its reason, and
 * offers Keep (or K). It never cuts one piece at a time: Make the cuts at
 * the end applies whatever is still faded as one undo step. Stop (or
 * Escape) leaves the walk; the card stays.
 *
 * Done (decision)
 * ---------------
 * "Done dismisses the card and leaves the ghosting as is": the card closes
 * and the faded preview stays exactly as it is, with the level still
 * selected in the popover. Done does NOT write ghosts into the document:
 * the preview is transient, as the spec's trim spans are a preview of the
 * cuts, not user ghosts. Picking the selected level again reopens the card.
 * Clicks on faded text only keep while the card is shown.
 *
 * Edits while trimming (decision)
 * -------------------------------
 * Any surface edit that is not the trim's own (source 'trim') ends the trim
 * at once (stale: no keep, no cut) and, on the next tick (never inside the
 * change listener, so typing is not re-rendered mid-input), clears the
 * preview, the kept set and the card; the level returns to Original and a
 * polite live region says why. Stale cuts are never applied.
 *
 * Original, leaving Write_On and destroy() clear everything. Events
 * (bubbling, from the card): `te:trim` { editor, level, status } after the
 * preview changes and `te:trim-cut` { editor, level, edits } after Make the
 * cuts. Listeners use this instance's AbortController (following the
 * Lab's). Load order: before lab.js. Design notes in this header.
 */

let teTrimInstances = 0;

const TE_TRIM_LAYER = 'lab-trim';

const TE_TRIM_HINT = 'Faded words would go. Click one to keep it.';

class TeLabTrim {
  constructor(lab, slot, options = {}) {
    this.lab = lab;
    this.editor = lab.editor;
    this.surface = lab.surface;
    this.registry = lab.registry;
    this.slot = slot;
    this.instance = ++teTrimInstances;
    this.destroyed = false;
    // Selected level id ('original', 'slight', ...).
    this.level = 'original';
    // The cached plan (from trim_plan_json) and the text it was made for.
    this.plan = null;
    this.planText = null;
    this.kept = new Set();
    // Last trim_status result.
    this.status = null;
    this.active = [];
    this.cardOpen = false;
    // Index into this.active while walking, or -1.
    this.walkIndex = -1;
    this.stale = false;
    this.applying = false;
    this.resetTimer = null;

    this.abortController = new AbortController();
    const signal = this.abortController.signal;
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal });
    }

    this.build();
    this.updateProtectionAvailability();

    this.surface.root.addEventListener('click', (e) => this.onSurfaceClick(e), { signal });
    this.offChange = this.surface.onChange((change) => this.onSurfaceChange(change));
  }

  static get LAYER() {
    return TE_TRIM_LAYER;
  }

  api() {
    const api = typeof this.editor.documentApi === 'function' ? this.editor.documentApi() : null;
    return api && typeof api.trim_plan_json === 'function' && typeof api.trim_status === 'function' &&
      typeof api.trim_make_cuts === 'function' ? api : null;
  }

  roleSnapshot() {
    const api = this.api();
    if (!api || typeof api.kg_role_snapshot_json !== 'function') return null;
    try { return JSON.parse(api.kg_role_snapshot_json()); } catch (_) { return null; }
  }

  updateProtectionAvailability() {
    const role = this.roleSnapshot();
    const ready = role && role.loaded === true && role.protectionReady === true && !this.protectionFailure;
    for (const b of this.levelButtons) b.disabled = b.dataset.level !== 'original' && !ready;
    this.protectionNote.textContent = ready ? 'Every local-role occurrence is protected; the target may be unreachable.' :
      (this.protectionFailure || (role && role.protectionError) || 'Load a local role/thesaurus to trim with KG protection.');
    return !!ready;
  }

  onRoleChange() {
    if (this.destroyed) return;
    this.plan = null;
    this.planText = null;
    this.protectionFailure = null;
    this.reset();
    this.updateProtectionAvailability();
    this.announce('Trim cleared: the local role changed.');
  }

  /** True while a level other than Original is previewed. */
  get trimming() {
    return this.level !== 'original';
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  build() {
    const signal = this.abortController.signal;
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    const id = (name) => `te-trim-${name}-${this.instance}`;
    const levels = [
      ['original', 'Original', ''],
      ['slight', 'Slight trim', '~10%'],
      ['tighten', 'Tighten more', '~20%'],
      ['sharper', 'Even sharper', '~30%'],
      ['half', 'Cut in half', '~50%'],
    ];

    // Level buttons in the popover slot: a radio group with a roving tabindex.
    const label = el('span', 'te-trim-label', 'Trim');
    label.id = id('label');
    const group = el('div', 'te-trim-levels');
    group.setAttribute('role', 'radiogroup');
    group.setAttribute('aria-labelledby', label.id);
    this.levelButtons = levels.map(([level, name, target]) => {
      const b = el('button', 'te-trim-level');
      b.type = 'button';
      b.dataset.level = level;
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', level === 'original' ? 'true' : 'false');
      b.tabIndex = level === 'original' ? 0 : -1;
      b.append(el('span', 'te-trim-level-name', name));
      if (target) b.append(el('span', 'te-trim-level-target', target));
      b.addEventListener('click', () => this.select(level, { focusCard: true }), { signal });
      group.appendChild(b);
      return b;
    });
    group.addEventListener('keydown', (e) => this.onLevelKey(e), { signal });
    const protectionNote = el('p', 'te-trim-protection');
    protectionNote.id = id('protection');
    protectionNote.setAttribute('role', 'status');
    group.setAttribute('aria-describedby', protectionNote.id);
    this.protectionNote = protectionNote;
    this.slot.replaceChildren(label, group, protectionNote);
    this.slot.hidden = false;

    // The floating status card (R-8.4), bottom-centre.
    const card = el('section', 'te-trim-card');
    card.id = id('card');
    card.hidden = true;
    card.tabIndex = -1;
    card.setAttribute('aria-labelledby', id('level'));
    const head = el('div', 'te-trim-card-head');
    const levelName = el('strong', 'te-trim-card-level');
    levelName.id = id('level');
    const count = el('span', 'te-trim-card-count');
    count.setAttribute('role', 'status');
    count.setAttribute('aria-live', 'polite');
    head.append(levelName, count);
    // The meter: the document as a bar, the part that would go faded with
    // the same token as the faded words.
    const meter = el('div', 'te-trim-meter');
    meter.setAttribute('aria-hidden', 'true');
    const meterKeep = el('span', 'te-trim-meter-keep');
    meter.append(meterKeep);
    const hint = el('p', 'te-trim-card-hint', TE_TRIM_HINT);
    this.protectionCardNote = el('p', 'te-trim-card-protection');

    const walk = el('div', 'te-trim-walk');
    walk.hidden = true;
    const walkText = el('p', 'te-trim-walk-text');
    walkText.setAttribute('aria-live', 'polite');
    const walkButtons = el('div', 'te-trim-walk-buttons');
    const button = (cls, icon, text, onClick, keys) => {
      const b = el('button', cls);
      b.type = 'button';
      if (icon) {
        const i = el('i', icon);
        i.setAttribute('aria-hidden', 'true');
        b.append(i);
      }
      b.append(el('span', '', text));
      if (keys) b.setAttribute('aria-keyshortcuts', keys);
      b.addEventListener('click', onClick, { signal });
      return b;
    };
    this.prevButton = button('te-trim-prev', 'fa-solid fa-chevron-left', 'Previous', () => this.step(-1), 'ArrowLeft');
    this.keepButton = button('te-trim-keep', 'fa-solid fa-thumbtack', 'Keep', () => this.keepCurrent(), 'K');
    this.nextButton = button('te-trim-next', 'fa-solid fa-chevron-right', 'Next', () => this.step(1), 'ArrowRight');
    this.stopButton = button('te-trim-stop', '', 'Stop', () => this.stopWalk(true), 'Escape');
    walkButtons.append(this.prevButton, this.keepButton, this.nextButton, this.stopButton);
    walk.append(walkText, walkButtons);

    const actions = el('div', 'te-trim-actions');
    this.cutButton = button('te-trim-cut', 'fa-solid fa-scissors', 'Make the cuts', () => this.makeCuts());
    this.walkButton = button('te-trim-walk-start', 'fa-solid fa-shoe-prints', 'Walk through', () => this.startWalk());
    this.doneButton = button('te-trim-done', '', 'Done', () => this.done());
    actions.append(this.cutButton, this.walkButton, this.doneButton);

    card.append(head, meter, hint, this.protectionCardNote, walk, actions);
    card.addEventListener('keydown', (e) => this.onCardKey(e), { signal });
    this.card = card;
    this.levelName = levelName;
    this.count = count;
    this.meterKeep = meterKeep;
    this.walk = walk;
    this.walkText = walkText;

    // Always-present live region for messages when the card is hidden.
    const live = el('div', 'te-trim-live');
    live.setAttribute('role', 'status');
    live.setAttribute('aria-live', 'polite');
    this.live = live;

    const mount = (this.editor.chrome && this.editor.chrome.root) || document.body;
    mount.append(card, live);
  }

  onLevelKey(e) {
    const current = this.levelButtons.indexOf(document.activeElement);
    if (current < 0) return;
    const n = this.levelButtons.length;
    let next = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next = (current + 1) % n;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') next = (current - 1 + n) % n;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = n - 1;
    if (next === null) return;
    e.preventDefault();
    if (this.levelButtons[next].disabled) next = 0;
    this.levelButtons.forEach((b, i) => { b.tabIndex = i === next ? 0 : -1; });
    this.levelButtons[next].focus();
  }

  onCardKey(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      if (this.walkIndex >= 0) this.stopWalk(true);
      else this.done();
      return;
    }
    if (this.walkIndex < 0 || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); this.step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); this.step(-1); }
    else if (e.key === 'k' || e.key === 'K') { e.preventDefault(); this.keepCurrent(); }
  }

  // ---------------------------------------------------------------------
  // Levels and the preview
  // ---------------------------------------------------------------------

  /**
   * Select level `level`. Original restores the pre-trim state; any other
   * level previews its cuts and shows the card (closing the popover).
   * Returns the status, or null.
   */
  select(level, opts = {}) {
    if (this.destroyed) return null;
    if (level === 'original') {
      this.reset();
      return null;
    }
    const api = this.api();
    if (!api || !this.updateProtectionAvailability()) {
      this.announce(this.protectionNote.textContent);
      return null;
    }
    this.cancelPendingReset();
    this.stale = false;
    this.level = level;
    const status = this.refresh();
    if (!status) return null;
    this.cardOpen = true;
    this.lab.close(false);
    this.sync();
    if (opts.focusCard) this.card.focus({ preventScroll: true });
    return status;
  }

  /** The plan for the current text, recomputed when the text changed. */
  ensurePlan(api) {
    const text = this.surface.getText();
    const role = this.roleSnapshot();
    if (!role || role.loaded !== true || role.protectionReady !== true) throw new Error('Load a local role/thesaurus to trim with KG protection.');
    if (this.plan && this.planText === text && this.plan.roleGeneration === role.generation) return this.plan;
    this.plan = api.trim_plan_json();
    if (!this.plan || this.plan.kgProtected !== true || this.plan.roleGeneration !== role.generation) {
      this.plan = null;
      throw new Error('The WASM trim API does not provide current KG protection.');
    }
    this.planText = text;
    this.kept.clear();
    return this.plan;
  }

  /** Recompute the status and the preview (one bridge call when the plan is fresh). */
  refresh() {
    const api = this.api();
    if (!api || !this.trimming) return null;
    let status;
    try {
      this.editor.alignDocumentModel(api);
      this.ensurePlan(api);
      status = api.trim_status(this.level, JSON.stringify(Array.from(this.kept)));
    } catch (err) {
      // A stale plan (the body moved under it): recompute once.
      try {
        this.plan = null;
        this.ensurePlan(api);
        status = api.trim_status(this.level, JSON.stringify([]));
      } catch (err2) {
        this.refuse(err2);
        return null;
      }
    }
    if (!status || status.kgProtected !== true || status.roleGeneration !== this.plan.roleGeneration) {
      this.refuse(new Error('The WASM trim API does not provide current KG protection.'));
      return null;
    }
    this.status = status;
    this.active = Array.from(status.active || []);
    if (this.walkIndex >= this.active.length) this.walkIndex = this.active.length - 1;
    this.draw();
    this.renderCard();
    this.emit('te:trim', { level: this.level, status });
    return status;
  }

  /** Put the active pieces in the registry layer. */
  draw() {
    const current = this.walkIndex >= 0 ? this.active[this.walkIndex] : null;
    const items = this.active.map((c) => ({
      id: `${c.id}-${c.start}`,
      start: c.start,
      end: c.end,
      className: c === current ? 'te-trim-faded te-trim-current' : 'te-trim-faded',
      data: { cut: c.id, reason: c.reason, tier: c.tier },
    }));
    this.keepFocus(() => this.registry.set(TE_TRIM_LAYER, items));
  }

  /** Run `fn` (which re-renders the surface) without losing focus from our UI. */
  keepFocus(fn) {
    const focused = document.activeElement;
    const ours = focused && (this.card.contains(focused) || this.lab.root.contains(focused)) ? focused : null;
    const result = fn();
    if (ours && ours.isConnected && document.activeElement !== ours && !ours.closest('[hidden]')) {
      ours.focus({ preventScroll: true });
    }
    return result;
  }

  /** Show or hide the card (hidden while the popover is open) and mark levels. */
  sync() {
    if (this.destroyed) return;
    this.updateProtectionAvailability();
    for (const b of this.levelButtons) {
      const on = b.dataset.level === this.level;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    }
    this.card.hidden = !(this.cardOpen && !this.lab.isOpen);
    if (this.cardOpen) this.surface.root.dataset.teTrimming = '';
    else delete this.surface.root.dataset.teTrimming;
  }

  renderCard() {
    const status = this.status;
    if (!status) return;
    this.levelName.textContent = status.label;
    this.count.textContent = status.cardText;
    this.protectionCardNote.textContent =
      `Every local-role occurrence is protected (${status.protectionCount}); retention outranks the target.`;
    const before = status.words_before || 0;
    const share = before ? (100 * status.words_after) / before : 100;
    this.meterKeep.style.width = `${share}%`;
    const nothing = this.active.length === 0;
    this.cutButton.disabled = nothing;
    this.walkButton.disabled = nothing;
    if (this.walkIndex >= 0) this.renderWalk();
  }

  // ---------------------------------------------------------------------
  // Keep
  // ---------------------------------------------------------------------

  onSurfaceClick(e) {
    if (!this.cardOpen || this.stale || !this.trimming) return;
    const seg = e.target && e.target.closest ? e.target.closest('[data-te-decoration]') : null;
    if (!seg || !this.surface.root.contains(seg)) return;
    const cut = this.cutAtSegment(seg);
    if (cut !== null) this.keep(cut);
  }

  /** The outermost faded cut covering a rendered segment, or null. */
  cutAtSegment(seg) {
    const ids = (seg.getAttribute('data-te-decoration') || '').split(/\s+/)
      .filter((t) => t.startsWith(`${TE_TRIM_LAYER}:`))
      .map((t) => t.slice(TE_TRIM_LAYER.length + 1));
    if (ids.length === 0) return null;
    const items = this.registry.get(TE_TRIM_LAYER).filter((item) => ids.includes(item.id));
    return this.outermost(items.map((item) => item.data && item.data.cut));
  }

  /** Of the cut ids given, the one whose plan range is widest (outermost). */
  outermost(cutIds) {
    const cuts = this.plan ? this.plan.cuts : [];
    let best = null;
    for (const cid of cutIds) {
      const c = cuts.find((x) => x.id === cid);
      if (!c) continue;
      const width = c.end - c.start;
      const bestWidth = best ? best.end - best.start : -1;
      if (width > bestWidth || (width === bestWidth && c.start < best.start)) best = c;
    }
    return best ? best.id : null;
  }

  /** Keep cut `cutId` (a plan cut id). Returns the new status, or null. */
  keep(cutId) {
    if (this.destroyed || this.stale || !this.trimming) return null;
    if (!this.plan || !this.plan.cuts.some((c) => c.id === cutId)) return null;
    this.kept.add(cutId);
    const status = this.refresh();
    if (status) this.announce(`Kept. ${status.cardText}`);
    return status;
  }

  // ---------------------------------------------------------------------
  // Walk through
  // ---------------------------------------------------------------------

  startWalk() {
    if (this.active.length === 0) return;
    this.walkIndex = 0;
    this.walk.hidden = false;
    this.draw();
    this.renderWalk();
    this.revealCurrent();
    this.nextButton.focus({ preventScroll: true });
  }

  step(delta) {
    if (this.walkIndex < 0 || this.active.length === 0) return;
    const n = this.active.length;
    this.walkIndex = (this.walkIndex + delta + n) % n;
    this.draw();
    this.renderWalk();
    this.revealCurrent();
  }

  /** Keep the cut under the walk cursor (its outermost faded cut). */
  keepCurrent() {
    if (this.walkIndex < 0) return null;
    const piece = this.active[this.walkIndex];
    if (!piece) return null;
    const covering = this.active.filter((c) => c.start <= piece.start && piece.end <= c.end).map((c) => c.id);
    const status = this.keep(this.outermost(covering));
    if (this.active.length === 0) this.stopWalk(true);
    else {
      this.draw();
      this.renderWalk();
      this.revealCurrent();
      if (!this.card.contains(document.activeElement)) this.keepButton.focus({ preventScroll: true });
    }
    return status;
  }

  stopWalk(focus = false) {
    if (this.walkIndex < 0) return;
    this.walkIndex = -1;
    this.walk.hidden = true;
    this.draw();
    if (focus && this.cardOpen) this.walkButton.focus({ preventScroll: true });
  }

  renderWalk() {
    const c = this.active[this.walkIndex];
    if (!c) return;
    const text = this.surface.getText().slice(c.start, c.end).trim();
    const short = text.length > 60 ? `${text.slice(0, 57)}…` : text;
    this.walkText.textContent = `${this.walkIndex + 1} of ${this.active.length}: ${c.reason}, “${short}”`;
  }

  revealCurrent() {
    const c = this.active[this.walkIndex];
    if (!c) return;
    const el = this.surface.root.querySelector(`[data-te-decoration~="${TE_TRIM_LAYER}:${c.id}-${c.start}"]`);
    if (el && typeof el.scrollIntoView === 'function') el.scrollIntoView({ block: 'nearest' });
  }

  // ---------------------------------------------------------------------
  // Make the cuts, Done, Original
  // ---------------------------------------------------------------------

  /**
   * Delete every still-faded span as ONE undo step. Returns the applied
   * edits, or null when refused (stale plan, nothing to cut, no API).
   */
  makeCuts() {
    if (this.destroyed || this.stale || !this.trimming) return null;
    const api = this.api();
    if (!api) return null;
    let made;
    try {
      this.editor.alignDocumentModel(api);
      made = api.trim_make_cuts(this.level, JSON.stringify(Array.from(this.kept)));
    } catch (err) {
      this.refuse(err);
      return null;
    }
    const edits = Array.from(made.edits || []);
    if (edits.length === 0) return null;
    const level = this.level;
    this.applying = true;
    let applied;
    try {
      applied = this.surface.replaceRanges(edits, { source: 'trim' });
    } finally {
      this.applying = false;
    }
    if (this.surface.getText() !== made.text) console.error('trim: surface text differs from the engine result');
    const words = this.status ? this.status.cardText : '';
    this.reset(false);
    this.announce(`Cuts made. ${words}`);
    this.surface.focus();
    this.emit('te:trim-cut', { level, edits: applied });
    return applied;
  }

  /** Protected Done records independent persistent ghosts before retiring UI. */
  done() {
    if (!this.cardOpen) return;
    let committed;
    try {
      committed = this.editor.commitTrimGhosts(this.level, Array.from(this.kept));
    } catch (error) {
      // Unlike B's protection refusal, record/history refusal must not retire
      // a valid plan, kept choices, walk or fades. Role-event clearing remains
      // independently authoritative and is never restored by this handler.
      this.announce(`Done refused: ${error.error || error.message || error}`);
      return false;
    }
    this.stopWalk(false);
    this.plan = null;
    this.planText = null;
    this.reset();
    this.announce(committed ? 'Done: cuts saved as ghosts. Undo restores them.' : 'Done: no cuts to save.');
    return true;
  }

  /** Back to Original: no preview, no kept set, no card. */
  reset(focusPill = false) {
    if (this.destroyed) return;
    this.cancelPendingReset();
    const hadFocus = this.card.contains(document.activeElement);
    this.level = 'original';
    this.kept.clear();
    this.status = null;
    this.active = [];
    this.walkIndex = -1;
    this.walk.hidden = true;
    this.cardOpen = false;
    this.stale = false;
    if (this.surface && !this.surface.destroyed && this.registry.get(TE_TRIM_LAYER).length) {
      this.keepFocus(() => this.registry.clear(TE_TRIM_LAYER));
    }
    this.sync();
    if ((focusPill || hadFocus) && this.lab.pill()) this.lab.pill().focus();
  }

  onSurfaceChange(change) {
    if (this.protectionFailure) {
      this.protectionFailure = null;
      this.updateProtectionAvailability();
    }
    if (this.destroyed || this.applying || !this.trimming) return;
    if (change && change.source === 'trim') return;
    // The plan no longer matches the text: stop at once, clear next tick.
    this.stale = true;
    this.cardOpen = false;
    this.card.hidden = true;
    if (this.resetTimer === null) {
      this.resetTimer = setTimeout(() => {
        this.resetTimer = null;
        if (!this.stale) return;
        this.reset(false);
        this.announce('Trim cleared: the text changed.');
      }, 0);
    }
  }

  cancelPendingReset() {
    if (this.resetTimer !== null) {
      clearTimeout(this.resetTimer);
      this.resetTimer = null;
    }
  }

  announce(text) {
    this.live.textContent = text;
  }

  /** Refusal retires all transient effects, never edits model/history. */
  refuse(error) {
    const message = `Trim is unavailable: ${error && error.message ? error.message : error}`;
    this.plan = null;
    this.planText = null;
    this.protectionFailure = message;
    this.reset();
    this.updateProtectionAvailability();
    this.announce(message);
  }

  emit(type, detail) {
    this.card.dispatchEvent(new CustomEvent(type, {
      bubbles: true,
      detail: Object.assign({ editor: this.editor }, detail),
    }));
  }

  /** Clear the preview, remove the DOM and every listener. */
  destroy() {
    if (this.destroyed) return;
    this.cancelPendingReset();
    if (this.surface && !this.surface.destroyed && this.registry) this.registry.clear(TE_TRIM_LAYER);
    if (this.surface && this.surface.root) delete this.surface.root.dataset.teTrimming;
    this.destroyed = true;
    this.offChange();
    this.abortController.abort();
    this.card.remove();
    this.live.remove();
    this.slot.replaceChildren();
    this.slot.hidden = true;
  }
}

window.TeLabTrim = TeLabTrim;
</script>
    <script>/*
 * The Lab popover and its mark actions (issue #14, spec R-8.1, R-8.2)
 * ===================================================================
 *
 * TeLabPopover opens above the bottom-centre LAB pill when the Write_On
 * chrome dispatches `te:lab` (public/js/chrome.js; the pill only acts in
 * Write_On mode). Header `The Lab guide…` / `what each idea does`, then the
 * six actions in engine order (labels from `wasmBindings.lab_actions()`),
 * then the trim levels of issue #15 (R-8.3 to R-8.5; TeLabTrim in
 * public/js/trim.js fills the `data-slot="trim"` slot and owns the faded
 * preview and the status card, reachable as `lab.trim`), then the results:
 * a legend, proposed fixes with Accept, and Clear marks.
 *
 * Marking never changes text
 * --------------------------
 * An action aligns the WASM model with the surface (the same
 * `editor.alignDocumentModel()` every model read uses), calls
 * `wasmBindings.lab_mark(id)` (src/lab.rs, over crates/terraphim_lab) and
 * puts the marks, unchanged (UTF-16 offsets), in the `lab-marks` layer of
 * `editor.decorations`. It never calls `surface.setDecorations` directly.
 * One action's marks are shown at a time; running another replaces them,
 * running the same one again recomputes them.
 *
 * Each item carries `className` `te-lab-mark te-lab-mark--<kind>` (kebab
 * case: `te-lab-mark--weak-sentence`), allow-listed attributes only
 * (`aria-describedby` pointing at a visually hidden description holding the
 * engine's reason, `data-lab-kind`), and its metadata in `data`
 * ({ kind, reason, proposal, text, score }), which the registry keeps at
 * live offsets.
 *
 * Marks are transient
 * -------------------
 * The registry maps every layer through every surface edit: marks after the
 * edit move, and an edit that lands inside a mark drops it. That is the
 * Lab's definition of "clears on the next edit that touches it"; an
 * insertion exactly at a mark's edge leaves it alone. Marks are not
 * re-run on edits (weakest-sentence ranking is document-wide and would
 * move under the writer's hands); run the action again to refresh them.
 * Leaving Write_On mode clears them. The popover never calls
 * `registry.set` from inside a surface change listener (that would force a
 * re-render mid-input); it only refreshes its own legend.
 *
 * Proposals (alternatives, never rewrites)
 * ----------------------------------------
 * Typo and punctuation marks carry a proposal. They are listed in the
 * popover with an explicit Accept, which checks that the text under the
 * mark is still what was marked, then calls
 * `surface.replaceRange(start, end, proposal, { source: 'lab' })`: exactly
 * the proposal, one undo step (only typing and deleting coalesce), and the
 * accepted mark drops because the edit lands inside it. Undo restores the
 * original text.
 *
 * Accessibility: a non-modal `role="dialog"` labelled by its header; the
 * actions are a `role="menu"` of `menuitemradio` buttons with a roving
 * tabindex (Up/Down, Home/End); Escape closes and returns focus to the LAB
 * pill; a pointer press outside closes. The pill gets `aria-expanded` and
 * `aria-controls`. While the popover is closed and marks are shown, a small
 * chip beside the pill says what is marked and offers Clear marks.
 *
 * Events (bubbling, from the popover): `te:lab-marks` { editor, action,
 * count } after an action runs or marks are cleared (action null), and
 * `te:lab-accept` { editor, start, end, text, proposal } after a proposal is
 * accepted.
 *
 * Lifecycle: every listener uses this instance's AbortController, which
 * follows the editor's signal; destroy() clears the layer, removes the DOM
 * and the pill attributes. Load order: after indicators.js and trim.js,
 * before editor.js. Design notes: docs/design/lab-popover.md
 */

let teLabInstances = 0;

const TE_LAB_LAYER = 'lab-marks';

/** What each idea does: one line per action, shown for the focused action. */
const TE_LAB_HINTS = {
  typos_and_punctuation: 'Proposes fixes for misspellings and punctuation slips. Nothing changes until you accept one.',
  weakest_sentences: 'Marks the most hedged, least central sentences. Paragraph openers are left alone.',
  long_sentences: 'Marks sentences of 30 words or more.',
  convoluted_sentences: 'Marks sentences carrying many clauses, asides and breaks.',
  off_tone: 'Marks informal words that do not fit a professional register.',
  hedges_and_filler: 'Marks hedges and filler words you could fade or cut.',
};

/** Singular and plural names per mark kind, for the legend. */
const TE_LAB_KINDS = {
  typo: ['typo', 'typos'],
  punctuation: ['punctuation slip', 'punctuation slips'],
  weak_sentence: ['weak sentence', 'weak sentences'],
  long_sentence: ['long sentence', 'long sentences'],
  convoluted_sentence: ['convoluted sentence', 'convoluted sentences'],
  off_tone: ['off-tone word', 'off-tone words'],
  hedge: ['hedge', 'hedges'],
  filler: ['filler word', 'filler words'],
};

class TeLabPopover {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.registry = editor.decorations;
    this.instance = ++teLabInstances;
    this.isOpen = false;
    this.destroyed = false;
    // Id of the action whose marks are shown, or null.
    this.action = null;
    this.actions = [];
    this.lastFocusIndex = 0;

    this.abortController = new AbortController();
    const signal = this.abortController.signal;
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal });
    }

    this.build();

    this.editor.root.addEventListener('te:role-change', (e) => {
      if (e.detail && e.detail.editor === this.editor && this.trim) this.trim.onRoleChange();
    }, { signal });

    document.addEventListener('te:lab', (e) => {
      if (!e.detail || !e.detail.editor || e.detail.editor === this.editor) this.toggle();
    }, { signal });
    document.addEventListener('te:mode-change', (e) => {
      if (e.detail && e.detail.editor && e.detail.editor !== this.editor) return;
      if (!e.detail || e.detail.mode !== 'write-on') {
        this.close(false);
        this.clear();
        if (this.trim) this.trim.reset();
      }
    }, { signal });
    document.addEventListener('pointerdown', (e) => this.onOutsidePointer(e), { signal, capture: true });
    window.addEventListener('resize', () => this.position(), { signal });
    // The registry (subscribed first) has already mapped the marks through
    // the edit; only the legend and proposals need refreshing.
    this.offChange = this.surface.onChange(() => {
      if (this.action !== null) this.renderResults();
    });
  }

  static get LAYER() {
    return TE_LAB_LAYER;
  }

  /** The kebab-case class suffix of a mark kind. */
  static kindClass(kind) {
    return `te-lab-mark--${String(kind).replace(/_/g, '-')}`;
  }

  /** "3 weak sentences", from a kind and a count. */
  static describeCount(kind, count) {
    const names = TE_LAB_KINDS[kind] || [String(kind).replace(/_/g, ' '), String(kind).replace(/_/g, ' ')];
    return `${count} ${count === 1 ? names[0] : names[1]}`;
  }

  /** Show spaces in a short proposal so " ," and "," read differently. */
  static visible(text) {
    return String(text).replace(/ /g, '␣');
  }

  api() {
    const api = typeof this.editor.documentApi === 'function' ? this.editor.documentApi() : null;
    return api && typeof api.lab_mark === 'function' && typeof api.lab_actions === 'function' ? api : null;
  }

  pill() {
    const chrome = this.editor.chrome;
    return chrome && chrome.root ? chrome.root.querySelector('[data-control="lab"]') : null;
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  build() {
    const signal = this.abortController.signal;
    const id = (name) => `te-lab-${name}-${this.instance}`;
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const root = el('div', 'te-lab');
    root.id = id('popover');
    root.hidden = true;
    root.setAttribute('role', 'dialog');
    root.setAttribute('aria-modal', 'false');
    root.setAttribute('aria-labelledby', id('title'));
    this.root = root;

    const header = el('div', 'te-lab-header');
    const title = el('h2', 'te-lab-title', 'The Lab guide…');
    title.id = id('title');
    const sub = el('span', 'te-lab-subtitle', 'what each idea does');
    header.append(title, sub);

    const menu = el('div', 'te-lab-actions');
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Lab actions');
    menu.setAttribute('aria-describedby', id('hint'));
    this.menu = menu;

    const api = this.api();
    let actions = [];
    if (api) {
      try {
        actions = Array.from(api.lab_actions() || []);
      } catch (err) {
        console.error('lab_actions failed', err);
      }
    }
    this.actions = actions;
    this.items = actions.map((action, i) => {
      const item = el('button', 'te-lab-action');
      item.type = 'button';
      item.setAttribute('role', 'menuitemradio');
      item.setAttribute('aria-checked', 'false');
      item.tabIndex = i === 0 ? 0 : -1;
      item.dataset.action = action.id;
      // Text only, as in the video (4:56 to 5:30; issue #107).
      const label = el('span', 'te-lab-action-label', action.label);
      const count = el('span', 'te-lab-action-count');
      count.setAttribute('aria-hidden', 'true');
      item.append(label, count);
      item.addEventListener('click', () => this.run(action.id), { signal });
      item.addEventListener('focus', () => this.showHint(action.id), { signal });
      item.addEventListener('mouseenter', () => this.showHint(action.id), { signal });
      menu.appendChild(item);
      return item;
    });
    menu.addEventListener('keydown', (e) => this.onMenuKey(e), { signal });

    const hint = el('p', 'te-lab-hint');
    hint.id = id('hint');
    this.hint = hint;

    // Trim levels (R-8.3 to R-8.5, issue #15): TeLabTrim (trim.js) fills
    // this slot with its buttons and unhides it.
    const trim = el('div', 'te-lab-trim');
    trim.dataset.slot = 'trim';
    trim.hidden = true;
    this.trimSlot = trim;
    this.trim = api && typeof window.TeLabTrim === 'function'
      ? new window.TeLabTrim(this, trim, { signal })
      : null;

    const results = el('div', 'te-lab-results');
    results.hidden = true;
    const legend = el('div', 'te-lab-legend');
    legend.setAttribute('role', 'status');
    legend.setAttribute('aria-live', 'polite');
    const proposals = el('ul', 'te-lab-proposals');
    proposals.setAttribute('aria-label', 'Proposed fixes');
    const clear = el('button', 'te-lab-clear');
    clear.type = 'button';
    const clearIcon = el('i', 'fa-solid fa-eraser');
    clearIcon.setAttribute('aria-hidden', 'true');
    clear.append(clearIcon, el('span', '', 'Clear marks'));
    clear.addEventListener('click', () => this.clear(true), { signal });
    results.append(legend, proposals, clear);
    this.results = results;
    this.legend = legend;
    this.proposals = proposals;
    this.clearButton = clear;
    proposals.addEventListener('click', (e) => {
      const button = e.target.closest('[data-mark]');
      if (button && proposals.contains(button)) this.accept(button.dataset.mark, true);
    }, { signal });

    const note = el('p', 'te-lab-note');
    note.setAttribute('role', 'alert');
    note.hidden = true;
    this.note = note;
    if (!api) {
      note.textContent = 'The Lab needs the WebAssembly document model, which did not load. Reload the page to try again.';
      note.hidden = false;
    }

    root.append(header, menu, hint, trim, results, note);
    root.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        this.close(true);
      }
    }, { signal });

    // Closed-state legend beside the pill.
    const chip = el('div', 'te-lab-chip');
    chip.hidden = true;
    const chipText = el('span', 'te-lab-chip-text');
    chipText.setAttribute('role', 'status');
    const chipClear = el('button', 'te-lab-chip-clear', 'Clear marks');
    chipClear.type = 'button';
    chipClear.addEventListener('click', () => this.clear(), { signal });
    chip.append(chipText, chipClear);
    this.chip = chip;
    this.chipText = chipText;

    // Visually hidden reasons referenced by the marks' aria-describedby.
    const descriptions = el('div', 'te-lab-descriptions');
    this.descriptions = descriptions;

    const mount = (this.editor.chrome && this.editor.chrome.root) || document.body;
    mount.append(root, chip, descriptions);

    const pill = this.pill();
    if (pill) {
      pill.setAttribute('aria-haspopup', 'dialog');
      pill.setAttribute('aria-expanded', 'false');
      pill.setAttribute('aria-controls', root.id);
    }
    this.showHint(actions.length ? actions[0].id : null);
  }

  showHint(actionId) {
    this.hint.textContent = (actionId && TE_LAB_HINTS[actionId]) || '';
  }

  // ---------------------------------------------------------------------
  // Open, close, position
  // ---------------------------------------------------------------------

  toggle() {
    if (this.isOpen) this.close(true);
    else this.open();
  }

  open() {
    if (this.destroyed || this.isOpen) return;
    this.isOpen = true;
    this.root.hidden = false;
    const pill = this.pill();
    if (pill) pill.setAttribute('aria-expanded', 'true');
    this.renderResults();
    if (this.trim) this.trim.sync();
    this.position();
    const checked = this.items.findIndex((item) => item.dataset.action === this.action);
    this.focusItem(checked >= 0 ? checked : 0);
  }

  close(restoreFocus = true) {
    if (!this.isOpen) return;
    const hadFocus = this.root.contains(document.activeElement);
    this.isOpen = false;
    this.root.hidden = true;
    const pill = this.pill();
    if (pill) pill.setAttribute('aria-expanded', 'false');
    this.renderResults();
    if (this.trim) this.trim.sync();
    if (restoreFocus && hadFocus && pill) pill.focus();
  }

  onOutsidePointer(e) {
    if (!this.isOpen) return;
    const t = e.target;
    const pill = this.pill();
    if (this.root.contains(t) || this.chip.contains(t) || (pill && pill.contains(t))) return;
    this.close(false);
  }

  /** Anchor the popover above the pill and the chip beside it. */
  position() {
    if (this.destroyed) return;
    const pill = this.pill();
    if (!pill) return;
    const r = pill.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) return;
    if (this.isOpen) {
      this.root.style.left = `${r.left + r.width / 2}px`;
      this.root.style.bottom = `${Math.max(0, window.innerHeight - r.top + 10)}px`;
    }
    if (!this.chip.hidden) {
      this.chip.style.left = `${r.right + 12}px`;
      this.chip.style.top = `${r.top + r.height / 2}px`;
    }
  }

  focusItem(index) {
    if (this.items.length === 0) return;
    const i = (index + this.items.length) % this.items.length;
    this.items.forEach((item, j) => { item.tabIndex = j === i ? 0 : -1; });
    this.lastFocusIndex = i;
    this.items[i].focus();
  }

  onMenuKey(e) {
    const current = this.items.indexOf(document.activeElement);
    if (current < 0) return;
    let next = null;
    if (e.key === 'ArrowDown') next = current + 1;
    else if (e.key === 'ArrowUp') next = current - 1;
    else if (e.key === 'Home') next = 0;
    else if (e.key === 'End') next = this.items.length - 1;
    if (next === null) return;
    e.preventDefault();
    this.focusItem(next);
  }

  // ---------------------------------------------------------------------
  // Marks
  // ---------------------------------------------------------------------

  /**
   * Run action `id` over the document and show its marks. Returns the
   * engine's marks, or null when the Lab is unavailable or the call failed.
   */
  run(id) {
    if (this.destroyed) return null;
    const api = this.api();
    if (!api) return null;
    let marks;
    try {
      this.editor.alignDocumentModel(api);
      marks = Array.from(api.lab_mark(id) || []);
    } catch (err) {
      console.error('lab_mark failed', err);
      this.note.textContent = `The Lab could not run this action: ${err && err.message ? err.message : err}`;
      this.note.hidden = false;
      return null;
    }
    this.note.hidden = true;
    const text = this.surface.getText();
    const descriptions = document.createDocumentFragment();
    const items = marks.map((m, i) => {
      const markId = `m${i}`;
      const descId = `te-lab-desc-${this.instance}-${markId}`;
      const desc = document.createElement('span');
      desc.id = descId;
      const name = (TE_LAB_KINDS[m.kind] || [m.kind])[0];
      desc.textContent = `Lab: ${name}. ${m.reason}${typeof m.proposal === 'string' ? `. Proposed: “${m.proposal}”` : ''}`;
      descriptions.appendChild(desc);
      return {
        id: markId,
        start: m.start,
        end: m.end,
        className: `te-lab-mark ${TeLabPopover.kindClass(m.kind)}`,
        attributes: { 'aria-describedby': descId, 'data-lab-kind': m.kind },
        data: {
          kind: m.kind,
          reason: m.reason,
          proposal: typeof m.proposal === 'string' ? m.proposal : null,
          text: text.slice(m.start, m.end),
          score: m.score,
        },
      };
    });
    this.descriptions.replaceChildren(descriptions);
    this.action = id;
    this.keepFocus(() => this.registry.set(TE_LAB_LAYER, items));
    for (const item of this.items) {
      item.setAttribute('aria-checked', item.dataset.action === id ? 'true' : 'false');
    }
    this.renderResults();
    this.emit('te:lab-marks', { action: id, count: items.length });
    return marks;
  }

  /**
   * Run `fn` (which re-renders the surface) without losing focus: the
   * surface restores its own selection on render, which would pull focus
   * out of the popover or the chip.
   */
  keepFocus(fn) {
    const focused = document.activeElement;
    const ours = focused && (this.root.contains(focused) || this.chip.contains(focused)) ? focused : null;
    const result = fn();
    if (ours && ours.isConnected && document.activeElement !== ours && !ours.closest('[hidden]')) {
      ours.focus({ preventScroll: true });
    }
    return result;
  }

  /** The shown marks at their live offsets (with `data`). */
  marks() {
    return this.registry ? this.registry.get(TE_LAB_LAYER) : [];
  }

  /** Remove every mark. `focusMenu` keeps focus in the popover. */
  clear(focusMenu = false) {
    if (this.destroyed) return;
    const had = this.action !== null || this.marks().length > 0;
    this.action = null;
    const fromChip = this.chip.contains(document.activeElement);
    if (this.surface && !this.surface.destroyed) this.keepFocus(() => this.registry.clear(TE_LAB_LAYER));
    this.descriptions.replaceChildren();
    for (const item of this.items) item.setAttribute('aria-checked', 'false');
    this.renderResults();
    if (focusMenu && this.isOpen) this.focusItem(this.lastFocusIndex);
    // The chip hides with the marks: hand focus to the pill.
    if (fromChip && this.pill()) this.pill().focus();
    if (had) this.emit('te:lab-marks', { action: null, count: 0 });
  }

  /**
   * Apply the proposal of mark `markId` as one undo step. Returns true if
   * the text changed. Refuses (false) if the mark is gone, has no proposal
   * or no longer covers the text it marked.
   */
  accept(markId, keepFocus = false) {
    const mark = this.marks().find((m) => m.id === String(markId));
    if (!mark || !mark.data || typeof mark.data.proposal !== 'string') return false;
    if (this.surface.getText().slice(mark.start, mark.end) !== mark.data.text) return false;
    const index = Array.from(this.proposals.querySelectorAll('[data-mark]'))
      .findIndex((b) => b.dataset.mark === mark.id);
    this.surface.replaceRange(mark.start, mark.end, mark.data.proposal, { source: 'lab' });
    // The change listener has refreshed the list; keep focus in it.
    if (keepFocus && this.isOpen) {
      const buttons = this.proposals.querySelectorAll('[data-mark]');
      if (buttons.length) buttons[Math.min(Math.max(index, 0), buttons.length - 1)].focus();
      else this.clearButton.focus();
    }
    this.emit('te:lab-accept', {
      start: mark.start, end: mark.end, text: mark.data.text, proposal: mark.data.proposal,
    });
    return true;
  }

  /** Refresh the legend, proposals and the closed-state chip. */
  renderResults() {
    if (this.destroyed) return;
    const marks = this.action === null ? [] : this.marks();
    const counts = new Map();
    for (const m of marks) {
      const kind = m.data ? m.data.kind : '';
      counts.set(kind, (counts.get(kind) || 0) + 1);
    }
    const label = (this.actions.find((a) => a.id === this.action) || {}).label || '';
    const summary = Array.from(counts, ([kind, n]) => TeLabPopover.describeCount(kind, n)).join(', ');

    for (const item of this.items) {
      const count = item.querySelector('.te-lab-action-count');
      count.textContent = item.dataset.action === this.action ? String(marks.length) : '';
    }

    this.results.hidden = this.action === null;
    if (this.action !== null) {
      const legend = this.legend;
      legend.replaceChildren();
      if (marks.length === 0) {
        legend.textContent = `${label}: nothing to mark.`;
      } else {
        for (const [kind, n] of counts) {
          const entry = document.createElement('span');
          entry.className = 'te-lab-legend-entry';
          // The swatch is a live sample drawn with the mark's own class.
          const swatch = document.createElement('span');
          swatch.className = `te-lab-swatch te-lab-mark ${TeLabPopover.kindClass(kind)}`;
          swatch.setAttribute('aria-hidden', 'true');
          swatch.textContent = 'abc';
          entry.append(swatch, document.createTextNode(TeLabPopover.describeCount(kind, n)));
          legend.appendChild(entry);
        }
      }
      const rows = marks.filter((m) => m.data && typeof m.data.proposal === 'string');
      const list = document.createDocumentFragment();
      for (const m of rows) {
        const li = document.createElement('li');
        li.className = 'te-lab-proposal';
        const from = document.createElement('span');
        from.className = 'te-lab-from';
        from.textContent = TeLabPopover.visible(m.data.text);
        const arrow = document.createElement('i');
        arrow.className = 'fa-solid fa-arrow-right-long te-lab-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        const to = document.createElement('span');
        to.className = 'te-lab-to';
        to.textContent = TeLabPopover.visible(m.data.proposal);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'te-lab-accept';
        button.dataset.mark = m.id;
        button.textContent = 'Accept';
        button.setAttribute('aria-label', `Accept: replace “${m.data.text}” with “${m.data.proposal}”`);
        li.append(from, arrow, to, button);
        list.appendChild(li);
      }
      this.proposals.replaceChildren(list);
      this.proposals.hidden = rows.length === 0;
    }

    const showChip = !this.isOpen && marks.length > 0;
    this.chip.hidden = !showChip;
    if (showChip) {
      this.chipText.textContent = summary;
      this.position();
    }
  }

  emit(type, detail) {
    this.root.dispatchEvent(new CustomEvent(type, {
      bubbles: true,
      detail: Object.assign({ editor: this.editor }, detail),
    }));
  }

  /** Clear the marks, remove the DOM, the pill attributes and every listener. */
  destroy() {
    if (this.destroyed) return;
    if (this.surface && !this.surface.destroyed && this.registry) this.registry.clear(TE_LAB_LAYER);
    if (this.trim) this.trim.destroy();
    this.destroyed = true;
    this.isOpen = false;
    this.offChange();
    this.abortController.abort();
    const pill = this.pill();
    if (pill) {
      pill.removeAttribute('aria-haspopup');
      pill.removeAttribute('aria-expanded');
      pill.removeAttribute('aria-controls');
    }
    this.root.remove();
    this.chip.remove();
    this.descriptions.remove();
  }
}

window.TeLabPopover = TeLabPopover;
</script>
    <script>/*
 * Blocks view (issue #19)
 * =======================
 *
 * A third way of looking at the open document, alongside the plain editor
 * and Write_On mode: the Markdown body is shown as a vertical list of
 * top-level blocks (headings, paragraphs, lists, code fences, blockquotes,
 * tables, rules), each rendered with the same Rust converter as the preview
 * and editable on its own. Full design: docs/design/blocks-view.md.
 *
 * Single source of truth
 * ----------------------
 * The view holds no document content of its own. Blocks are parsed on demand
 * from `editor.surface.getText()`, which the document bridge
 * (src/document.rs) keeps identical to the model body; the annotation block
 * never reaches the surface, so it is never shown and never lost. Every
 * block is a contiguous slice of the body (`text` plus the trailing
 * separator `sep`, with any leading blank lines in `lead`), so
 * `BlocksView.serialise(BlocksView.parse(body)) === body` by construction;
 * the block type is classification only.
 *
 * A committed block edit is reduced to the minimal changed region
 * (EditorSurface.diff) and applied with `surface.replaceRange(...,
 * { source: 'blocks' })`. That is the same edit path as typing: the surface
 * maps decorations, mirrors the edit into the span model with `apply_edit`
 * (alternatives and ghosts outside the changed region re-anchor), records
 * one undo step and dispatches `input` so the preview re-renders. Edits are
 * committed on blur, Ctrl+Enter or when leaving the view, never per
 * keystroke.
 *
 * Drafts are never lost
 * ---------------------
 * While a block editor is open the body can still change from outside (an
 * integration calling surface.replaceRange or setText, undo from elsewhere,
 * openDocument). Every surface change event carries the exact edit, and the
 * open editor's range is mapped through it:
 *   - an edit entirely before the block shifts the range; an edit entirely
 *     after it changes nothing. The textarea stays open with its draft and
 *     the other cards are re-rendered around it;
 *   - an edit that overlaps the block, or replaces the whole document
 *     (openDocument, setText), closes the editor and keeps the draft in a
 *     visible, non-blocking notice above the view, with the block text as
 *     it was when editing began (`originalText`). The notice offers
 *     "Replace block" when the block at the draft's position still holds
 *     exactly `originalText`, and "Insert as new paragraph" otherwise (it
 *     then goes after that block, or at the block index after a
 *     whole-document replacement), so unrelated text is never replaced. The
 *     label is recomputed on every change. Either is one undo step.
 *     "Discard" drops the draft.
 * A commit also checks that the block's original text is still at the mapped
 * range; if not, the draft goes to the notice instead of being applied.
 * Kept drafts follow later edits and stay available in both views; through
 * a text move (or its undo/redo) they follow their block, mapped with the
 * model's move rules (mapThroughMove), and an open editor stays open when
 * its block lies wholly inside the moved text or wholly beside it.
 * Escape never discards typed text: closing an editor whose draft differs
 * from the block puts the draft in the same notice; only "Discard" there
 * drops it.
 *
 * Teardown never mutates the document (the host may already have saved):
 * destroy() collects the open editor's draft (if it differs from the block's
 * text) and every kept draft, dispatches one bubbling `te:blocks-drafts`
 * CustomEvent from the surface root with
 *   detail: { editor, drafts: [{ value, originalText, anchor, index, isNew }] }
 * before removing its DOM, and returns the same array (MarkdownEditor.destroy
 * returns it too). With nothing pending there is no event and the array is
 * empty. pendingDrafts() returns the same list without tearing down.
 *
 * Controls
 * --------
 * Plain mode: a "View" button group (Text | Blocks) in the toolbar. Write_On
 * mode has no Blocks control: the toolbar is hidden there by write-on.css,
 * and entering Write_On switches back to the text surface (the Blocks view
 * resumes when plain mode returns with the tools shown). Blocks is not part of the Write_On spec.
 * Plain mode hides the toolbar too unless its tools are shown (Ctrl+Shift+L,
 * issue #86), so hiding the tools does the same: back to the text surface,
 * and Blocks resumes when the tools are shown again. A stored Blocks
 * preference waits for the tools in the same way. setView() itself is not
 * gated by the tools (it is in Write_On).
 *
 * Keyboard (the list uses a roving tabindex):
 *   ArrowUp / ArrowDown / Home / End   move between blocks
 *   Enter or F2                        edit the focused block
 *   Shift+Enter                        add a paragraph below the block
 *   Ctrl+Enter (editing)               commit the edit
 *   Escape (editing)                   close the editor; typed text is kept
 *                                      in the drafts notice, never discarded
 *   Alt+ArrowUp / Alt+ArrowDown        move the focused block up / down
 *   Delete                             delete the block
 *   Tab                                the focused block's action buttons
 *                                      (edit, move up, move down, add
 *                                      below, delete); Escape returns to
 *                                      the block
 *   Ctrl+Z, Ctrl+Shift+Z / Ctrl+Y      undo / redo (the surface history)
 *
 * Alt+Arrow is handled on a focused card only: never inside a block editor
 * (Option+Arrow moves the caret there on macOS) and never on the text
 * surface, whose own Alt+Arrow keys (#9) listen on the surface root, which
 * is hidden while the Blocks view shows.
 *
 * Moving blocks (#58)
 * -------------------
 * moveBlock(index, 'up' | 'down') swaps a block with its neighbour through
 * MarkdownEditor.moveRange, the model-level move (#44), so the spans and
 * ghosts inside the block travel with it; it never falls back to a deletion
 * plus an insertion. Block i's range is its text plus its trailing
 * separator, [start, next block start or end of text); down moves it to the
 * start of block i + 2 (or the end of the text), up moves it to the start of
 * block i - 1. A pure move carries each block's trailing separator with it,
 * so when the two separators differ (the last block has no trailing blank
 * line, or a heading is followed by a single newline) whitespace-only edits
 * put them back in place: the gap between the pair stays between the pair
 * and the document keeps its trailing text. A gap that would separate two
 * blocks without a blank line becomes one blank line. The result is
 * simulated first and must parse into the same blocks in the new order, or
 * the move is refused. A fix-up that would edit inside a span or ghost
 * (mapped through the move) refuses the move too, naming it, before
 * anything changes (fixUpBlocker). The move and its fix-ups are folded into ONE undo
 * step (EditorSurface.squashHistory), whose undo replays the move in the
 * model as a move. A move the model refuses (it would split a span or ghost,
 * typically a ghost across a block boundary) changes nothing and its message
 * is shown in the Blocks notice region (role="status", aria-live). The
 * first block has no Move up button and the last no Move down; the keys are
 * no-ops there. An open block editor is committed first, as for every other
 * structural action, so a draft is applied or (if its block changed) kept in
 * the drafts notice, never lost. Focus follows the moved card.
 *
 * Events: every view change dispatches a bubbling `te:view-change`
 * { view: 'text' | 'blocks', editor } from the blocks container.
 *
 * Preference: the last view is stored per viewer (not per document) in
 * localStorage under `terraphim-editor:view`, wrapped in try/catch. It is a
 * UI preference only; no document content is ever stored.
 *
 * Lifecycle: MarkdownEditor creates the view after the chrome and passes its
 * AbortController signal; every listener uses it. destroy() removes the
 * container, the drafts notice, the toolbar group and the change
 * subscription, and shows the surface again.
 */

const BLOCKS_VIEW_STORAGE_KEY = 'terraphim-editor:view';

const BLOCK_LABELS = {
  heading: 'Heading',
  paragraph: 'Paragraph',
  list: 'List',
  code: 'Code',
  quote: 'Quote',
  table: 'Table',
  rule: 'Rule',
};

const RE_BLANK = /^[ \t\r]*$/;
const RE_FENCE = /^ {0,3}(`{3,}|~{3,})/;
const RE_ATX = /^ {0,3}(#{1,6})(?:[ \t]|\r?$)/;
const RE_RULE = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t\r]*$/;
const RE_SETEXT = /^ {0,3}(=+|-+)[ \t\r]*$/;
const RE_QUOTE = /^ {0,3}>/;
const RE_LIST = /^ {0,3}(?:[-+*]|\d{1,9}[.)])(?:[ \t]|\r?$)/;
const RE_INDENTED = /^(?: {4}|\t)/;
const RE_TABLE_DELIM = /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t\r]*$/;

class BlocksView {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.signal = options.signal;
    this.view = 'text';
    this.destroyed = false;
    this.model = { lead: '', blocks: [] };
    this.focusIndex = 0;
    this.editing = null;
    // Set while this view applies an edit, so the change subscription does
    // not rebuild the DOM under the textarea that is being committed.
    this.applying = false;
    this.dirty = false;
    // Drafts kept after an outside change overlapped an open block editor.
    this.drafts = [];
    this.nextDraftId = 1;
    // Blocks was showing when Write_On mode, or hiding the plain-mode tools,
    // took over.
    this.resumeAfterWriteOn = false;

    this.build();
    this.offChange = this.surface.onChange((change) => this.onSurfaceChange(change));
    this.listen(document, 'te:mode-change', (e) => this.onModeChange(e));
    this.listen(document, 'te:tools-change', (e) => this.onToolsChange(e));

    // Restore the viewer's last view (never in Write_On mode, nor while the
    // plain-mode tools, and so the view toggle, are hidden).
    if (BlocksView.loadPreference() === 'blocks') {
      if (this.writeOnActive() || !this.toolsVisible()) this.resumeAfterWriteOn = true;
      else this.setView('blocks', { persist: false, focus: false });
    }
  }

  // ---------------------------------------------------------------------
  // Parsing (pure; no DOM)
  // ---------------------------------------------------------------------

  /**
   * Split Markdown into top-level blocks. Returns { lead, blocks } where
   * each block is { type, level, start, end, text, sep } with UTF-16
   * offsets; text === source.slice(start, end) and sep runs to the next
   * block (or the end of the source). Lossless for any input.
   */
  static parse(source) {
    const src = String(source);
    const lines = [];
    let at = 0;
    while (at <= src.length) {
      const nl = src.indexOf('\n', at);
      const end = nl < 0 ? src.length : nl;
      lines.push({ start: at, end, text: src.slice(at, end) });
      if (nl < 0) break;
      at = nl + 1;
    }
    const blank = (i) => RE_BLANK.test(lines[i].text);
    const raw = [];
    let i = 0;
    const n = lines.length;
    while (i < n) {
      if (blank(i)) {
        i += 1;
        continue;
      }
      const first = i;
      const line = lines[i].text;
      let type = 'paragraph';
      let level = 0;
      let last = i;
      let m;
      if ((m = RE_FENCE.exec(line))) {
        type = 'code';
        const fence = m[1];
        const close = new RegExp('^ {0,3}' + (fence[0] === '`' ? '`' : '~') + '{' + fence.length + ',}[ \\t\\r]*$');
        last = n - 1;
        for (let j = i + 1; j < n; j += 1) {
          if (close.test(lines[j].text)) {
            last = j;
            break;
          }
        }
      } else if ((m = RE_ATX.exec(line))) {
        type = 'heading';
        level = m[1].length;
      } else if (RE_RULE.test(line)) {
        type = 'rule';
      } else if (RE_QUOTE.test(line)) {
        type = 'quote';
        while (last + 1 < n && !blank(last + 1)) last += 1;
      } else if (RE_LIST.test(line)) {
        type = 'list';
        const kind = BlocksView.listKind(line);
        let j = i + 1;
        while (j < n) {
          if (!blank(j)) {
            last = j;
            j += 1;
            continue;
          }
          // A loose list continues after blank lines when the next content
          // line is indented (a continuation) or is another item.
          let k = j;
          while (k < n && blank(k)) k += 1;
          if (k < n && (/^(?: {2,}|\t)/.test(lines[k].text) || BlocksView.listKind(lines[k].text) === kind)) {
            j = k;
          } else {
            break;
          }
        }
      } else if (RE_INDENTED.test(line)) {
        type = 'code';
        let j = i + 1;
        while (j < n && (blank(j) || RE_INDENTED.test(lines[j].text))) {
          if (!blank(j)) last = j;
          j += 1;
        }
      } else if (line.includes('|') && i + 1 < n && RE_TABLE_DELIM.test(lines[i + 1].text) && lines[i + 1].text.includes('-')) {
        type = 'table';
        last = i + 1;
        while (last + 1 < n && !blank(last + 1)) last += 1;
      } else {
        // Paragraph: runs until a blank line or a line that starts another
        // block; a setext underline turns it into a heading.
        while (last + 1 < n) {
          const next = lines[last + 1].text;
          if (RE_BLANK.test(next)) break;
          const setext = RE_SETEXT.exec(next);
          if (setext) {
            last += 1;
            type = 'heading';
            level = setext[1][0] === '=' ? 1 : 2;
            break;
          }
          if (RE_FENCE.test(next) || RE_ATX.test(next) || RE_QUOTE.test(next) || RE_RULE.test(next)) break;
          if (/^ {0,3}(?:[-+*]|1[.)])[ \t]+\S/.test(next)) break;
          last += 1;
        }
      }
      raw.push({ type, level, start: lines[first].start, end: lines[last].end });
      i = last + 1;
    }
    const blocks = raw.map((b, k) => {
      const nextStart = k + 1 < raw.length ? raw[k + 1].start : src.length;
      return {
        type: b.type,
        level: b.level,
        start: b.start,
        end: b.end,
        text: src.slice(b.start, b.end),
        sep: src.slice(b.end, nextStart),
      };
    });
    const lead = blocks.length ? src.slice(0, blocks[0].start) : src;
    return { lead, blocks };
  }

  /** The marker kind of a list item line ('-', '+', '*', '.' or ')'), or null. */
  static listKind(line) {
    const m = /^ {0,3}(?:([-+*])|\d{1,9}([.)]))(?:[ \t]|\r?$)/.exec(line);
    return m ? m[1] || m[2] : null;
  }

  /** Index of the block in `model` that owns `offset` (text or separator). */
  static indexIn(model, offset) {
    const blocks = model.blocks;
    for (let i = blocks.length - 1; i >= 0; i -= 1) {
      if (offset >= blocks[i].start) return i;
    }
    return 0;
  }

  /** Inverse of parse(): lead plus every block's text and separator. */
  static serialise(model) {
    let out = model.lead || '';
    for (const b of model.blocks) out += b.text + b.sep;
    return out;
  }

  static loadPreference() {
    try {
      return window.localStorage.getItem(BLOCKS_VIEW_STORAGE_KEY);
    } catch (e) {
      return null;
    }
  }

  static savePreference(view) {
    try {
      window.localStorage.setItem(BLOCKS_VIEW_STORAGE_KEY, view);
    } catch (e) {
      // Storage unavailable: the view still works for this session.
    }
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  listen(target, type, fn, options = {}) {
    target.addEventListener(type, fn, { ...options, signal: this.signal });
  }

  build() {
    const root = this.surface.root;

    // Toolbar group: Text | Blocks (plain mode only; the toolbar is hidden in
    // Write_On mode).
    const toolbar = this.editor.toolbar ? this.editor.toolbar.parentNode : null;
    if (toolbar) {
      const divider = document.createElement('sl-divider');
      divider.setAttribute('vertical', '');
      divider.className = 'te-view-divider';
      const group = document.createElement('sl-button-group');
      group.className = 'te-view-toggle';
      group.setAttribute('label', 'View');
      const button = (view, label, icon) => {
        const b = document.createElement('sl-button');
        b.setAttribute('size', 'small');
        b.dataset.view = view;
        b.setAttribute('aria-pressed', 'false');
        b.setAttribute('title', `${label} view`);
        const i = document.createElement('i');
        i.className = `${icon} te-view-icon`;
        i.setAttribute('aria-hidden', 'true');
        b.append(i, document.createTextNode(` ${label}`));
        this.listen(b, 'click', () => this.setView(view));
        group.appendChild(b);
        return b;
      };
      this.textButton = button('text', 'Text', 'fa-solid fa-align-left');
      this.blocksButton = button('blocks', 'Blocks', 'fa-solid fa-layer-group');
      const anchor = this.editor.toolbar.nextSibling;
      toolbar.insertBefore(divider, anchor);
      toolbar.insertBefore(group, anchor);
      this.toggleGroup = group;
      this.toggleDivider = divider;
    }

    const container = document.createElement('div');
    container.className = 'te-blocks';
    container.hidden = true;
    container.setAttribute('aria-label', 'Document blocks');
    const list = document.createElement('div');
    list.className = 'te-blocks-list';
    list.setAttribute('role', 'list');
    list.setAttribute('aria-label', 'Blocks');
    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'te-blocks-add';
    const addIcon = document.createElement('i');
    addIcon.className = 'fa-solid fa-plus';
    addIcon.setAttribute('aria-hidden', 'true');
    add.append(addIcon, document.createTextNode(' Add paragraph'));
    this.listen(add, 'click', () => this.insertBlockAfter(this.model.blocks.length - 1));
    // Messages about refused actions (a move the model would not make). The
    // live region is always rendered (a region that appears together with
    // its text is not reliably announced); only the message box inside it
    // is hidden when there is nothing to say.
    const region = document.createElement('div');
    region.className = 'te-blocks-notice-region';
    region.setAttribute('role', 'status');
    region.setAttribute('aria-live', 'polite');
    const notice = document.createElement('div');
    notice.className = 'te-blocks-notice';
    const noticeText = document.createElement('p');
    noticeText.className = 'te-blocks-notice-text';
    const dismiss = document.createElement('button');
    dismiss.type = 'button';
    dismiss.className = 'te-blocks-notice-dismiss';
    dismiss.setAttribute('aria-label', 'Dismiss message');
    dismiss.title = 'Dismiss message';
    // In the tab order only while a message shows.
    dismiss.tabIndex = -1;
    const dismissIcon = document.createElement('i');
    dismissIcon.className = 'fa-solid fa-xmark';
    dismissIcon.setAttribute('aria-hidden', 'true');
    dismiss.appendChild(dismissIcon);
    this.listen(dismiss, 'click', () => {
      this.showNotice(null);
      this.setCurrent(this.focusIndex, true);
    });
    notice.append(noticeText, dismiss);
    notice.hidden = true;
    region.appendChild(notice);
    this.noticeRegion = region;
    this.noticeElement = notice;
    this.noticeText = noticeText;
    this.noticeDismiss = dismiss;
    container.append(region, list, add);
    root.parentNode.insertBefore(container, root.nextSibling);

    // Kept drafts: above the surface and the blocks, visible in both views.
    const drafts = document.createElement('div');
    drafts.className = 'te-blocks-drafts';
    drafts.hidden = true;
    drafts.tabIndex = -1;
    drafts.setAttribute('role', 'region');
    drafts.setAttribute('aria-label', 'Kept block drafts');
    drafts.setAttribute('aria-live', 'polite');
    root.parentNode.insertBefore(drafts, root);
    this.draftsElement = drafts;
    this.listen(drafts, 'click', (e) => {
      const b = e.target.closest('[data-draft-action]');
      if (!b) return;
      const id = Number(b.dataset.draftId);
      if (b.dataset.draftAction === 'apply') this.applyDraft(id);
      else this.discardDraft(id);
    });
    this.container = container;
    this.list = list;
    this.addButton = add;

    this.listen(list, 'keydown', (e) => this.onKeyDown(e));
    // A move button pressed while a block editor is open must not blur it
    // first: the blur would commit and rebuild the cards under the pointer,
    // and the click would be lost. moveBlock commits the editor itself.
    this.listen(list, 'mousedown', (e) => {
      if (this.editing && e.target.closest('.te-block-action[data-action="up"], .te-block-action[data-action="down"]')) {
        e.preventDefault();
      }
    });
    this.listen(list, 'click', (e) => this.onClick(e));
    this.listen(list, 'dblclick', (e) => {
      const card = e.target.closest('.te-block');
      if (card && !e.target.closest('textarea')) this.editBlock(Number(card.dataset.index));
    });
    this.listen(list, 'focusin', (e) => {
      const card = e.target.closest('.te-block');
      if (card && e.target === card) this.setCurrent(Number(card.dataset.index), false);
    });
  }

  /**
   * Rebuild the cards from the body. An open block editor is kept in place
   * (its card is never detached, so the textarea keeps focus, draft and
   * selection) and the other cards are rebuilt around it. Callers that mean
   * to close the editor clear `this.editing` first.
   */
  render(focus = false) {
    this.dirty = false;
    this.model = BlocksView.parse(this.surface.getText());
    const blocks = this.model.blocks;
    if (this.focusIndex >= blocks.length) this.focusIndex = Math.max(0, blocks.length - 1);
    const cards = blocks.map((b, i) => this.renderCard(b, i, blocks.length));
    const keep = this.editing && this.editing.card.parentNode === this.list ? this.editing : null;
    if (keep) {
      const k = keep.isNew
        ? blocks.filter((b) => b.start < keep.start).length
        : BlocksView.indexIn(this.model, keep.start);
      const kept = keep.card;
      for (const child of Array.from(this.list.children)) {
        if (child !== kept) child.remove();
      }
      cards.forEach((c, i) => {
        if (!keep.isNew && i === k) return;
        if (i < k) this.list.insertBefore(c, kept);
        else this.list.appendChild(c);
      });
      keep.index = k;
      kept.dataset.index = String(k);
      if (keep.selection && document.activeElement === keep.textarea) {
        keep.textarea.setSelectionRange(...keep.selection);
      }
      return;
    }
    this.editing = null;
    const frag = document.createDocumentFragment();
    cards.forEach((c) => frag.appendChild(c));
    if (blocks.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'te-blocks-empty';
      empty.textContent = 'The document is empty. Add a paragraph to start.';
      frag.appendChild(empty);
    }
    this.list.textContent = '';
    this.list.appendChild(frag);
    if (focus) this.focusCard(this.focusIndex);
  }

  renderCard(block, index, total) {
    const card = document.createElement('div');
    card.className = `te-block te-block-${block.type}`;
    card.setAttribute('role', 'listitem');
    card.dataset.index = String(index);
    card.dataset.type = block.type;
    card.tabIndex = index === this.focusIndex ? 0 : -1;
    const label = BLOCK_LABELS[block.type] + (block.level ? ` ${block.level}` : '');
    card.setAttribute(
      'aria-label',
      `${label}, block ${index + 1} of ${total}. Enter to edit, Shift+Enter to add a paragraph below, Alt+Up or Alt+Down to move, Delete to remove, Tab for actions.`,
    );
    card.setAttribute('aria-keyshortcuts', 'Enter F2 Shift+Enter Alt+ArrowUp Alt+ArrowDown Delete');

    const head = document.createElement('div');
    head.className = 'te-block-head';
    const tag = document.createElement('span');
    tag.className = 'te-block-type';
    tag.textContent = block.type === 'heading' ? `H${block.level}` : BLOCK_LABELS[block.type];
    const actions = document.createElement('span');
    actions.className = 'te-block-actions';
    const action = (name, label, icon, keys, hidden = false) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'te-block-action';
      b.dataset.action = name;
      // The first block cannot move up nor the last move down: no button.
      b.hidden = hidden;
      // Roving tabindex: only the focused card's actions are in the tab order.
      b.tabIndex = index === this.focusIndex && !hidden ? 0 : -1;
      b.setAttribute('aria-label', label);
      b.setAttribute('aria-keyshortcuts', keys);
      b.title = label;
      const i = document.createElement('i');
      i.className = icon;
      i.setAttribute('aria-hidden', 'true');
      b.appendChild(i);
      actions.appendChild(b);
    };
    action('edit', 'Edit block (Enter)', 'fa-solid fa-pen', 'Enter F2');
    action('up', 'Move block up (Alt+Up)', 'fa-solid fa-arrow-up', 'Alt+ArrowUp', index === 0);
    action('down', 'Move block down (Alt+Down)', 'fa-solid fa-arrow-down', 'Alt+ArrowDown', index === total - 1);
    action('insert', 'Add paragraph below (Shift+Enter)', 'fa-solid fa-plus', 'Shift+Enter');
    action('delete', 'Delete block (Delete)', 'fa-regular fa-trash-can', 'Delete');
    head.append(tag, actions);

    const body = document.createElement('div');
    body.className = 'te-block-body';
    const html = this.renderMarkdown(block.text);
    if (html === null) {
      const pre = document.createElement('pre');
      pre.className = 'te-block-source';
      pre.textContent = block.text;
      body.appendChild(pre);
    } else {
      // Same converter, and the same trust level, as the live preview: the
