    <script>/* Shared classic-script bootstrap: also safe to concatenate into the embed.
 * Styles/modules are awaited before UI use. No downloads outside the selected
 * asset base, no CDN fallback, no service worker, no host-language mutation.
 */
(() => {
  'use strict';
  if (window.TerraphimRuntimeAssets) return;
  const components = ['input', 'icon', 'button', 'button-group', 'tooltip',
    'split-panel', 'dialog', 'divider', 'badge'];
  const icons = new Set(['type-bold', 'type-italic', 'code', 'link', 'type-h1',
    'type-h2', 'type-h3', 'type-underline', 'question-circle']);
  const styles = new Map();
  let selectedBase = null;
  let promise = null;
  let owned = false;

  function resolveBase(options = {}, scriptURL = document.baseURI) {
    const base = new URL(options.assetBase || '.', options.assetBase ? document.baseURI : scriptURL);
    if (!['http:', 'https:'].includes(base.protocol) || base.username || base.password || base.search || base.hash) {
      throw new TypeError('Runtime assetBase must be an HTTP(S) directory URL without credentials, query or fragment');
    }
    if (base.origin !== new URL(document.baseURI).origin && options.allowExternalAssets !== true) {
      throw new TypeError('Cross-origin runtime assets require allowExternalAssets: true and host CSP/CORS approval');
    }
    if (!base.pathname.endsWith('/')) base.pathname += '/';
    return base.href;
  }

  function loadStyle(url) {
    const href = new URL(url, document.baseURI).href;
    if (styles.has(href)) return styles.get(href);
    const result = new Promise((resolve, reject) => {
      let link = [...document.querySelectorAll('link[rel="stylesheet"]')]
        .find((item) => item.href === href);
      if (link && link.sheet) { resolve(); return; }
      const created = !link;
      if (!link) {
        link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
      }
      const timer = setTimeout(() => fail(), 15000);
      const fail = () => {
        clearTimeout(timer);
        // Failed local styles may be retried, including pre-existing links.
        link.remove();
        reject(new Error(`Runtime stylesheet unavailable: ${href}`));
      };
      link.addEventListener('load', () => { clearTimeout(timer); resolve(); }, { once: true });
      link.addEventListener('error', fail, { once: true });
      if (created) document.head.appendChild(link);
    });
    styles.set(href, result);
    result.catch(() => { if (styles.get(href) === result) styles.delete(href); });
    return result;
  }

  function iconResolver(base) {
    return (name) => typeof name === 'string' && /^[a-z0-9-]+$/.test(name) && icons.has(name)
      ? new URL(`assets/icons/${name}.svg`, base).href : '';
  }

  function load(options = {}, scriptURL = document.baseURI) {
    let base;
    try {
      base = resolveBase(options, scriptURL);
      if (selectedBase && selectedBase !== base) {
        throw new Error('Incompatible runtime assetBase: Shoelace registration is page-global');
      }
      if (!owned && components.some((name) => customElements.get(`sl-${name}`))) {
        throw new Error('Host-owned Shoelace detected; use loadShoelace: false and provide all runtime styles/icons');
      }
    } catch (error) { return Promise.reject(error); }
    if (promise) return promise;
    selectedBase = base;
    const shoelace = new URL('vendor/shoelace/2.12.0/cdn/', base).href;
    const fontawesome = new URL('vendor/fontawesome/6.5.2/css/', base).href;
    promise = (async () => {
      // Await styles first: on a CSS error no global custom elements changed.
      await Promise.all([loadStyle(new URL('themes/light.css', shoelace).href),
        ...['fontawesome', 'solid', 'regular', 'brands'].map((name) => loadStyle(new URL(`${name}.min.css`, fontawesome).href))]);
      const basePath = await import(new URL('utilities/base-path.js', shoelace).href);
      basePath.setBasePath(shoelace);
      const library = await import(new URL('utilities/icon-library.js', shoelace).href);
      library.registerIconLibrary('default', { resolver: iconResolver(shoelace) });
      owned = true;
      await Promise.all(components.map(async (name) => {
        const module = await import(new URL(`components/${name}/${name}.js`, shoelace).href);
        const registered = customElements.get(`sl-${name}`);
        // Shoelace 2.12.0 define() registers a subclass, not module.default.
        if (!registered || !(registered === module.default || registered.prototype instanceof module.default)) {
          throw new Error(`Incompatible Shoelace element sl-${name}; use loadShoelace: false for host-managed components`);
        }
      }));
      return { assetBase: base, shoelaceBase: shoelace };
    })();
    promise.catch(() => { promise = null; });
    return promise;
  }

  window.TerraphimRuntimeAssets = { resolveBase, loadStyle, iconResolver, load, ready: null };
})();
</script>

    <script>/*
 * Write_On mode toggle and corner chrome (issue #7, spec R-2.1, R-7.1-R-7.3)
 * ==========================================================================
 *
 * The plain editor is the default. Plain mode shows the text and a dim
 * `N words M chars` counter in the top-left corner, nothing more (R-2.1,
 * R-7.1; owner decision on issue #86). Clicking the counter
 * toggles Write_On mode, which sets `data-mode="write-on"` on the editor's
 * root (`editor.root`, the `.te-app` element: #app or an embed container,
 * issue #77; the scope used by public/css/tokens.css and
 * public/css/write-on.css) and, on the full page only (root #app or
 * `config.standalone`), on <body> too, so the whole page goes dark. An
 * embedded editor never touches <body>. It also reveals the corner controls:
 *
 *   top-left       N words M chars   toggles Write_On mode (always visible)
 *   top-centre     ●●●               alternatives panel   -> te:open-panel {panel: 'alternatives'}
 *   top-centre     M↓                Markdown view/export -> te:markdown (cancelable), then the export dialog
 *   top-right      keyboard glyph    shortcut reference   -> opens the reference, then te:shortcuts
 *   bottom-left    floppy            save                 -> te:save (cancelable), then save and write the file
 *   bottom-left    folder            open                 -> te:open (cancelable), then pick and open a file
 *   bottom-centre  LAB               Lab                  -> te:lab
 *   bottom-right   XYZ               Overflow panel       -> te:overflow (also Ctrl+Shift+D, see overflow.js)
 *
 * Events are CustomEvents dispatched from the chrome root inside the
 * editor's root; they bubble, so listen on the root or on `document`.
 * `detail.editor` is the MarkdownEditor.
 * te:save, te:open and te:markdown are cancelable. Their default actions
 * belong to editor.persistence (public/js/persistence.js, issues #76 and
 * #73), which dispatches the events itself: save calls
 * editor.saveDocument() (te:saved {text}; save() also returns the text) and
 * writes the file, open picks a file and calls editor.openDocument(text,
 * name), and M↓ shows the export dialog. A host page that stores documents
 * itself calls preventDefault(). Without persistence.js, save falls back to
 * editor.saveDocument() and te:open / te:markdown are only dispatched.
 * Every mode change dispatches te:mode-change {mode: 'plain' | 'write-on'}.
 *
 * Tools (issue #86)
 * -----------------
 * The legacy formatting toolbar and the split live preview are not shown in
 * plain mode. They are still rendered (the preview keeps rendering, and the
 * formatting shortcuts and the `/` palette keep working without them), and
 * Ctrl+Shift+L, pressed anywhere in the editor, or setTools(on) shows them
 * again. The chrome mirrors the state as `data-tools="on" | "off"` on the
 * editor's root; public/css/write-on.css hides both unless it is "on".
 * Write_On hides them regardless. `config.tools: true` starts with them
 * shown. The toggle is not persisted. Every change dispatches
 * te:tools-change {visible}.
 *
 * Toggle persistence (per document)
 * ---------------------------------
 * The mode is stored in localStorage under
 *   terraphim-editor:write-on:<document key>
 * as "1" (Write_On) or "0" (plain); absence means plain. The document key is
 * the first of these that is a non-empty string:
 *   1. editor.documentKey     (the save key or file name, set by persistence)
 *   2. editor.config.documentKey
 *   3. "h:" + FNV-1a 32-bit hash (hex) of the surface text when the chrome is
 *      created, or when documentChanged() is called.
 * localStorage access is wrapped in try/catch, so private browsing or a full
 * quota degrades to an unpersisted toggle. Storing the mode inside the
 * document (the annotation block) is out of scope.
 *
 * Lifecycle: MarkdownEditor creates the chrome in initialize() and passes its
 * AbortController signal; every listener is registered with that signal, and
 * MarkdownEditor.destroy() calls chrome.destroy(), which removes the DOM,
 * the change subscription and the <body> mode attribute.
 */

const WRITE_ON_STORAGE_PREFIX = 'terraphim-editor:write-on:';

/** Shows or hides the toolbar and preview in plain mode (issue #86). */
const TOOLS_TOGGLE_KEY = 'ctrl+shift+l';

/** Toggles the Overflow panel in Write_On mode, as the XYZ tooltip shows (R-6.1). */
const OVERFLOW_TOGGLE_KEY = 'ctrl+shift+d';

/** Selection shortcuts from R-7.3; the editor shortcuts come from config.js. */
const WRITE_ON_SELECTION_SHORTCUTS = [
  { key: 'ctrl+shift+a', desc: 'Alternatives for selection' },
  { key: 'ctrl+shift+g', desc: 'AI alternatives for selection' },
  { key: 'ctrl+/', desc: 'Ghost it / Revive' },
  { key: 'ctrl+shift+x', desc: 'Stash this in Overflow' },
];

/**
 * Whether the editor's Rust document model (issue #6) is usable. Without
 * `window.wasmBindings` the editor still works as a plain Markdown editor
 * (see MarkdownEditor.documentApi()), and the chrome degrades with it.
 */
function documentModelAvailable(editor) {
  try {
    return !!(editor && typeof editor.documentApi === 'function' && editor.documentApi());
  } catch (e) {
    return false;
  }
}

/**
 * Word and character counts for an editor. Uses editor.counts() (issue #6,
 * which includes ghosted text) when the document model is available and
 * falls back to counting the surface text otherwise, or if counts() fails.
 * Chars are Unicode code points. Words follow the editor's one word
 * definition (terraphim_alternatives::words, issue #59), which WORD_RE mirrors
 * for the fallback: runs of letters, digits or `_`, joined by an apostrophe,
 * hyphen, full stop or slash only between word characters. Markdown syntax,
 * punctuation and emoji are not words.
 */
const WORD_RE = /[\p{Alphabetic}\p{N}_]+(?:['\u2019\-./][\p{Alphabetic}\p{N}_]+)*/gu;

function countsFor(editor) {
  if (documentModelAvailable(editor) && typeof editor.counts === 'function') {
    try {
      const c = editor.counts();
      if (c && Number.isFinite(c.words) && Number.isFinite(c.chars)) {
        return { words: c.words, chars: c.chars };
      }
    } catch (e) {
      // Fall through to the surface text.
    }
  }
  const text = editor && editor.surface ? editor.surface.getText() : '';
  const words = (text.match(WORD_RE) || []).length;
  return { words, chars: Array.from(text).length };
}

/** FNV-1a 32-bit hash of a string, as eight hex digits. */
function writeOnHash(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i += 1) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

/** Render `ctrl+shift+a` as `Ctrl+Shift+A`. */
function formatShortcutKey(key) {
  return key
    .split('+')
    .map((part) => (part.length === 1 ? part.toUpperCase() : part.charAt(0).toUpperCase() + part.slice(1)))
    .join('+');
}

class WriteOnChrome {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.signal = options.signal;
    this.mount = options.mount || (editor.input && editor.input.closest('.editor-container')) || document.body;
    this.destroyed = false;
    this.mode = 'plain';
    this.tools = null;
    this.ownsBodyMode = false;
    // Only the full page (the editor rendered into #app, or a standalone
    // editor) puts Write_On on <body>; an embedded editor keeps it on its
    // own root so the host page is never restyled (#77).
    const root = editor.root;
    this.pageMode = !!(editor.config && editor.config.standalone === true) ||
      !root || root === document.body || root.id === 'app';

    this.build();
    this.offChange = editor.surface ? editor.surface.onChange(() => this.refresh()) : () => {};
    this.setTools(!!(editor.config && editor.config.tools === true), { silent: true });
    this.documentChanged();
  }

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------

  build() {
    const listen = (el, type, fn) => el.addEventListener(type, fn, { signal: this.signal });

    const root = document.createElement('div');
    root.className = 'te-chrome';
    this.root = root;

    const counter = document.createElement('button');
    counter.type = 'button';
    counter.className = 'te-chrome-counter';
    counter.setAttribute('aria-pressed', 'false');
    counter.title = 'Toggle Write_On mode';
    const counterText = document.createElement('span');
    counterText.className = 'te-chrome-counter-text';
    const arrow = document.createElement('span');
    arrow.className = 'te-chrome-counter-arrow';
    arrow.setAttribute('aria-hidden', 'true');
    arrow.textContent = '←'; // left arrow, lit in Write_On mode
    counter.append(counterText, arrow);
    listen(counter, 'click', () => this.toggle());
    this.counter = counter;
    this.counterText = counterText;

    const corners = document.createElement('div');
    corners.className = 'te-chrome-corners';
    corners.hidden = true;
    this.corners = corners;

    const group = (where) => {
      const g = document.createElement('div');
      g.className = `te-chrome-group te-chrome-${where}`;
      corners.appendChild(g);
      return g;
    };
    const control = (parent, opts) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `te-chrome-control ${opts.className}`;
      b.dataset.control = opts.name;
      b.setAttribute('aria-label', opts.label);
      b.title = opts.key ? `${opts.label} (${formatShortcutKey(opts.key)})` : opts.label;
      if (opts.key) b.setAttribute('aria-keyshortcuts', formatShortcutKey(opts.key).replace('Ctrl', 'Control'));
      if (opts.icon) {
        const i = document.createElement('i');
        i.className = opts.icon;
        i.setAttribute('aria-hidden', 'true');
        b.appendChild(i);
      } else {
        const span = document.createElement('span');
        span.setAttribute('aria-hidden', 'true');
        span.textContent = opts.text;
        b.appendChild(span);
      }
      // Corner controls act only in Write_On mode; when plain they are
      // hidden, and a programmatic click must not dispatch te:* events.
      listen(b, 'click', (e) => {
        if (!this.isWriteOn()) return;
        opts.onClick(e);
      });
      parent.appendChild(b);
      return b;
    };

    const top = group('top-centre');
    control(top, {
      name: 'alternatives', className: 'te-chrome-dots', text: '●●●',
      label: 'Alternatives panel',
      onClick: () => this.emit('te:open-panel', { panel: 'alternatives' }),
    });
    control(top, {
      name: 'markdown', className: 'te-chrome-markdown', text: 'M↓',
      label: 'Markdown view and export',
      onClick: () => this.markdown(),
    });

    const topRight = group('top-right');
    control(topRight, {
      name: 'shortcuts', className: 'te-chrome-keyboard', icon: 'fa-regular fa-keyboard',
      label: 'Keyboard shortcuts',
      onClick: () => this.openShortcuts(),
    });

    const bottomLeft = group('bottom-left');
    control(bottomLeft, {
      name: 'save', className: 'te-chrome-save', icon: 'fa-solid fa-floppy-disk',
      label: 'Save document',
      onClick: () => this.save(),
    });
    control(bottomLeft, {
      name: 'open', className: 'te-chrome-open', icon: 'fa-regular fa-folder-open',
      label: 'Open document',
      onClick: () => this.open(),
    });

    const bottomCentre = group('bottom-centre');
    control(bottomCentre, {
      name: 'lab', className: 'te-chrome-lab', text: 'LAB',
      label: 'Lab',
      onClick: () => this.emit('te:lab'),
    });

    const bottomRight = group('bottom-right');
    control(bottomRight, {
      name: 'overflow', className: 'te-chrome-overflow', text: 'XYZ',
      label: 'Overflow panel', key: OVERFLOW_TOGGLE_KEY,
      onClick: () => this.emit('te:overflow'),
    });

    root.append(counter, corners, this.buildShortcutReference(listen));
    this.mount.appendChild(root);

    // The tools toggle, from anywhere inside the editor (the surface, a
    // toolbar button, the preview). Exactly Ctrl+Shift+L: Shift is matched
    // as teConfigShortcutMatches does, so Ctrl+L stays the link shortcut.
    // Capture phase, and the event stops here so no other handler sees it.
    const keyScope = this.editor.root || this.mount;
    keyScope.addEventListener('keydown', (e) => {
      if (e.isComposing || e.defaultPrevented) return;
      if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey) return;
      if ((e.key || '').toLowerCase() !== 'l') return;
      e.preventDefault();
      e.stopPropagation();
      this.toggleTools();
    }, { signal: this.signal, capture: true });
  }

  /** The shortcut reference: every R-7.3 shortcut and every config.js shortcut. */
  shortcutEntries() {
    const config = (this.editor && this.editor.config) || {};
    const editorShortcuts = (config.shortcuts || []).map((s) => ({ key: s.key, desc: s.desc }));
    return [
      { title: 'Formatting', items: editorShortcuts },
      { title: 'Selection', items: config.writeOnShortcuts || WRITE_ON_SELECTION_SHORTCUTS },
      { title: 'Editor', items: this.editorShortcuts() },
    ];
  }

  /** The Editor section: the palette, plus save and open (issue #76). */
  editorShortcuts() {
    const items = [
      { key: '/', desc: 'Command palette' },
      { key: TOOLS_TOGGLE_KEY, desc: 'Show or hide the toolbar and preview' },
      { key: OVERFLOW_TOGGLE_KEY, desc: 'Show or hide the Overflow panel' },
    ];
    if (typeof window.TePersistence === 'function') {
      items.push({ key: 'ctrl+s', desc: 'Save' }, { key: 'ctrl+o', desc: 'Open' });
    }
    return items;
  }

  buildShortcutReference(listen) {
    const dialog = document.createElement('dialog');
    dialog.className = 'te-chrome-shortcuts';
    dialog.setAttribute('aria-labelledby', 'te-chrome-shortcuts-title');

    const header = document.createElement('div');
    header.className = 'te-chrome-shortcuts-header';
    const title = document.createElement('h2');
    title.id = 'te-chrome-shortcuts-title';
    title.textContent = 'Keyboard shortcuts';
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'te-chrome-shortcuts-close';
    close.setAttribute('aria-label', 'Close keyboard shortcuts');
    close.textContent = '×';
    listen(close, 'click', () => dialog.close());
    header.append(title, close);
    dialog.appendChild(header);

    for (const section of this.shortcutEntries()) {
      const h = document.createElement('h3');
      h.textContent = section.title;
      const list = document.createElement('dl');
      for (const item of section.items) {
        const row = document.createElement('div');
        row.className = 'te-chrome-shortcut';
        row.dataset.key = item.key;
        const dt = document.createElement('dt');
        dt.textContent = item.desc;
        const dd = document.createElement('dd');
        const kbd = document.createElement('kbd');
        kbd.textContent = formatShortcutKey(item.key);
        dd.appendChild(kbd);
        row.append(dt, dd);
        list.appendChild(row);
      }
      dialog.append(h, list);
    }

    // A click on the backdrop (outside the dialog box) closes it.
    listen(dialog, 'click', (e) => {
      if (e.target === dialog) dialog.close();
    });
    this.shortcutsDialog = dialog;
    return dialog;
  }

  // ---------------------------------------------------------------------
  // Behaviour
  // ---------------------------------------------------------------------

  emit(type, detail = {}, cancelable = false) {
    const ev = new CustomEvent(type, {
      bubbles: true,
      cancelable,
      detail: Object.assign({ editor: this.editor }, detail),
    });
    this.root.dispatchEvent(ev);
    return ev;
  }

  /**
   * Dispatch te:save; unless it is cancelled, call editor.saveDocument() and
   * return the saved text. Returns null, without throwing, when te:save was
   * cancelled or the document model is unavailable (no `window.wasmBindings`:
   * there is nothing to serialise the annotations with, so te:save is still
   * dispatched for listeners but no save happens and no te:saved follows).
   * The editor dispatches te:saved with the text after a real save. With
   * editor.persistence (issue #76) the whole flow is its save(), which also
   * writes the file (see public/js/persistence.js).
   */
  save() {
    const files = this.editor && this.editor.persistence;
    if (files && !files.destroyed) return files.save();
    const ev = this.emit('te:save', { available: documentModelAvailable(this.editor) }, true);
    if (ev.defaultPrevented || !documentModelAvailable(this.editor)) return null;
    if (typeof this.editor.saveDocument !== 'function') return null;
    try {
      return this.editor.saveDocument();
    } catch (err) {
      console.error('saveDocument failed', err);
      return null;
    }
  }

  /** te:open, then the open flow (editor.persistence) unless cancelled. */
  open() {
    const files = this.editor && this.editor.persistence;
    if (files && !files.destroyed) return files.open();
    this.emit('te:open', {}, true);
    return Promise.resolve(false);
  }

  /** te:markdown, then the export dialog (editor.persistence) unless cancelled. */
  markdown() {
    const files = this.editor && this.editor.persistence;
    if (files && !files.destroyed) return files.showMarkdown();
    this.emit('te:markdown', {}, true);
    return null;
  }

  openShortcuts() {
    const dialog = this.shortcutsDialog;
    if (!dialog.open) {
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else dialog.setAttribute('open', '');
    }
    this.emit('te:shortcuts');
  }

  /** Update the counter text from countsFor(). */
  refresh() {
    if (this.destroyed) return;
    const { words, chars } = countsFor(this.editor);
    this.counterText.textContent = `${words} ${words === 1 ? 'word' : 'words'} ${chars} ${chars === 1 ? 'char' : 'chars'}`;
  }

  /** The document identity used for the persisted toggle (see header). */
  documentKey() {
    const ed = this.editor || {};
    if (typeof ed.documentKey === 'string' && ed.documentKey) return ed.documentKey;
    const configKey = ed.config && ed.config.documentKey;
    if (typeof configKey === 'string' && configKey) return configKey;
    return `h:${writeOnHash(this.initialText)}`;
  }

    <!-- Decoration registry and inline indicators (issue #8): after the
         chrome, before editor.js, which instantiates them. -->
    <script>/*
 * Decoration registry and inline indicators (issue #8, spec R-3.1 to R-3.6)
 * =========================================================================
 *
 * TeDecorationRegistry
 * --------------------
 * EditorSurface has a single decoration list (`setDecorations`), and every
 * call re-renders the surface DOM. Several features decorate the text (the
 * indicators here, ghosts and the selection menu in issue #11), so they do
 * not call `setDecorations` themselves. Each one owns a named *layer* in the
 * registry and replaces that layer's items; the registry merges every layer
 * into one `setDecorations` call:
 *
 *   const reg = editor.decorations;            // created by MarkdownEditor
 *   reg.set('ghosts', [{ id: 'g1', start, end, className: 'te-ghost' }]);
 *   reg.get('ghosts');                         // items as registered
 *   reg.current('ghosts');                     // live offsets (mapped through edits)
 *   reg.clear('ghosts');                       // same as set('ghosts', [])
 *   reg.batch(() => { reg.set('a', ...); reg.set('b', ...); });  // one render
 *   const off = reg.onApply(() => ...);        // after each real re-render
 *
 * Rules:
 * - Item ids are namespaced as `<layer>:<id>` on the surface, so layers
 *   cannot collide; an item without an id gets its index.
 * - Layers merge in registration order; overlapping items from different
 *   layers are fine (the surface splits them and unions their classes).
 * - Decorations the registry does not own (set directly on the surface, as
 *   older code and tests do) are preserved.
 * - Stored layer items follow every surface edit through the same
 *   `EditorSurface.mapRanges()` the surface uses (moved by edits before
 *   them, dropped by an edit inside them), so setting one layer never puts
 *   another back at stale offsets.
 * - If the merged list equals what the surface already has (same ids,
 *   offsets, classes and attributes) nothing is rendered. Because the surface
 *   moves decorations with edits, a layer that recomputes the same ranges
 *   after typing costs no DOM rebuild.
 *
 * TeIndicatorLayer
 * ----------------
 * Draws the "dots under text" for spans with alternatives, in Write_On mode
 * only ([data-mode="write-on"] on the editor root). Spans with only their original (R-2.7)
 * and set-aside spans get nothing.
 *
 * - Underline (R-3.1): CSS `text-decoration` on the decoration span classes
 *   `te-ind-word` and `te-ind-sentence` (public/css/write-on.css), so it
 *   moves with the text at no cost. Paragraph spans (`te-ind-paragraph`)
 *   have no underline (R-3.4). Headlines (a sentence span on a line starting
 *   with `#`) also get `te-ind-headline`: bold, slightly larger (R-3.5).
 * - Dots (R-3.2, R-3.3) and the paragraph gutter rule (R-3.4) are elements
 *   in an overlay (`.te-indicators`, aria-hidden, absolutely positioned and
 *   out of flow, so line height never changes) beside the surface. Positions
 *   come from the client rects of each span's *current* surface decoration,
 *   recomputed at most once per animation frame after a change, resize,
 *   scroll, or a change to the editor root's layout attributes (an
 *   alternatives or Overflow panel opening moves the column without
 *   resizing it, issue #107). Word rows are centred under the word; sentence and headline rows
 *   end at the right end of the underline; paragraphs get a rule in the left
 *   gutter and a dot column to its left. The first dot is the original;
 *   exactly one dot (the active alternative) is lit in the full accent.
 * - Model reads: the span list comes from `editor.annotations()` (the WASM
 *   document bridge). It re-syncs the body, so it runs only on a trailing
 *   debounce after typing (`delay`, default 120 ms, the preview's default),
 *   never per keystroke. `flush()` runs a pending refresh and layout now.
 * - Accessibility: the 40% underline and dim dots are below 3:1 contrast, so
 *   the active dot uses the full accent and every indicated span carries
 *   `aria-describedby` pointing at a visually hidden description such as
 *   "Word: 7 alternatives, 5 of 7 active".
 * - Dot clicks (R-3.6, where jumping to an alternative is only inferred)
 *   dispatch a bubbling, cancelable `te:dot` CustomEvent with detail
 *   { editor, spanId, index, kind, active }. Unless a listener calls
 *   preventDefault(), the default action jumps to that alternative through
 *   `editor.swapAlternative` (issue #9).
 * - In-place cycling (issue #9, R-2.4, R-3.6): while the pointer is over an
 *   indicated span's text, ArrowUp/ArrowDown (no modifiers) make the
 *   previous/next alternative active, wrapping at either end. With the caret
 *   (or the whole selection) inside or at the edge of an indicated span,
 *   Alt+ArrowUp/Alt+ArrowDown do the same for keyboard users. Any other
 *   arrow key, or an arrow with nothing hovered, is left to the browser.
 *   Each swap is one undo step; see docs/design/cycling.md.
 *
 * TeHeadingLayer
 * --------------
 * R-3.5 for every ATX heading, with or without alternatives (issue #84), in
 * Write_On and ordinary plain mode (not the raw tools view). The `headings`
 * registry layer holds two items per
 * heading line outside fenced code: `h<n>` over the whole line (class
 * `te-heading`: bold, same face and colour, 1.15em) and `m<n>` over its
 * marker, the leading `#`s and the spaces after them (`te-heading-marker`).
 *
 * - The marker is hidden with `font-size: 0`, so it stays in the surface's
 *   Text nodes: the document text, `root.textContent`, offsets, selection,
 *   word counts, save and export all keep it, and the heading starts flush
 *   with the body as in the video. While the selection touches a heading
 *   line its marker is shown, dimmed (`te-heading-marker--shown`), so the
 *   caret before the `#` is visible and a `#` being typed never vanishes.
 *   That class is toggled on the rendered marker spans directly (never
 *   through the registry), so caret moves re-render nothing, and is put back
 *   after every render.
 * - The line ranges are recomputed from the surface text on the animation
 *   frame after a change. The registry ignores an identical list, so typing
 *   in a body paragraph re-renders nothing; typing in a heading re-renders
 *   once, before the next paint.
 * - `TeIndicatorLayer.isHeadline` uses the same marker rule, so a headline
 *   span with alternatives (`te-ind-headline`) is always a heading too. The
 *   surface unions the classes of overlapping decorations on one flat span,
 *   so the two never compound the size.
 *
 *   editor.headings.ranges()   // -> [{ start, end, markerEnd }] heading lines
 *   editor.headings.flush()    // recompute and redraw now
 *
 * Load order: after chrome.js and before editor.js, which instantiates both
 * classes in MarkdownEditor.initialize() when they exist. Full design notes:
 * docs/design/indicators.md
 */

const TE_LAYER_NAME = /^[a-z][a-z0-9-]*$/;

/**

 * one to six `#`, then the spaces or tabs after them), or 0 if the line is
 * not a heading. A bare `#` line is an empty heading.
 */
function teHeadingMarkerLength(line) {
  const m = /^ {0,3}#{1,6}(?:[ \t]+|$)/.exec(line);
  return m ? m[0].length : 0;
}

class TeDecorationRegistry {
  constructor(surface) {
    this.surface = surface;
    // Layer name -> items as registered (unprefixed). A cleared layer stays
    // registered so its prefix is still recognised as owned.
    this.layers = new Map();
    this.batchDepth = 0;
    this.pending = false;
    this.applyListeners = new Set();
    // Number of real setDecorations calls made, for tests and diagnostics.
    this.renderCount = 0;
    // Keep stored items in step with the surface: every surface edit is
    // reported with the edit that moved its decorations.
    this.offChange = surface.onChange((change) => this.mapEdit(change && change.edit));
  }

  /** Move or drop stored items exactly as the surface moves its decorations. */
  mapEdit(edit) {
    if (!edit) return;
    for (const [name, items] of this.layers) {
      if (items.length) this.layers.set(name, EditorSurface.mapRanges(items, edit));
    }
  }

  /** Stop following surface edits. */
  destroy() {
    this.offChange();
  }

  /** Replace the items of layer `name`. Returns true if the surface re-rendered. */
  set(name, items) {
    if (typeof name !== 'string' || !TE_LAYER_NAME.test(name)) {
      throw new Error(`Invalid decoration layer name: ${name}`);
    }
    this.layers.set(name, (items || []).map((item, i) => ({
      id: item.id === undefined || item.id === null ? String(i) : String(item.id),
      start: item.start,
      end: item.end,
      className: item.className || '',
      data: item.data,
      // Sanitised as the surface will (warning once, here), so comparisons
      // with the surface's decorations are like for like.
      attributes: EditorSurface.sanitiseAttributes(item.attributes),
    })));
    return this.apply();
  }

  clear(name) {
    return this.set(name, []);
  }

  /** Items of layer `name`, with offsets moved through later edits. */
  get(name) {
    return (this.layers.get(name) || []).map((d) => ({ ...d }));
  }

  /** Registered layer names, in merge order. */
  names() {
    return Array.from(this.layers.keys());
  }

  /** Is this surface decoration id owned by a registered layer? */
  owns(id) {
    const sep = String(id).indexOf(':');
    return sep > 0 && this.layers.has(String(id).slice(0, sep));
  }

  /**
   * The surface decorations of layer `name` with their live offsets (moved
   * through edits since the last render; an edit inside one drops it) and
   * unprefixed ids.
   */
  current(name) {
    const prefix = `${name}:`;
    return this.surface.getDecorations()
      .filter((d) => d.id.startsWith(prefix))
      .map((d) => ({ ...d, id: d.id.slice(prefix.length) }));
  }

  /** Run `fn` and render once at the end, however many layers it sets. */
  batch(fn) {
    this.batchDepth += 1;
    try {
      fn();
    } finally {
      this.batchDepth -= 1;
    }
    if (this.batchDepth === 0 && this.pending) return this.apply();
    return false;
  }

  /** Subscribe to real re-renders; returns an unsubscribe function. */
  onApply(callback) {
    this.applyListeners.add(callback);
    return () => this.applyListeners.delete(callback);
  }

  /** The merged list: unowned surface decorations, then every layer. */
  merged() {
    const out = this.surface.getDecorations().filter((d) => !this.owns(d.id));
    for (const [name, items] of this.layers) {
      for (const item of items) out.push({ ...item, id: `${name}:${item.id}` });
    }
    return out;
  }

  static signature(d) {
    return `${d.start}|${d.end}|${d.className || ''}|${d.attributes ? JSON.stringify(d.attributes) : ''}`;
  }

  /** Push the merged list to the surface unless it is already there. */
  apply() {
    if (this.batchDepth > 0) {
      this.pending = true;
      return false;
    }
    this.pending = false;
    const surface = this.surface;
    if (!surface || surface.destroyed) return false;
    const len = surface.getText().length;
    // Compare after the same clamping the surface applies.
    const next = this.merged().filter((d) => {
      const s = Math.max(0, Math.min(len, d.start | 0));
      const e = Math.max(0, Math.min(len, d.end | 0));
      return e > s;
    });
    const have = new Map(surface.getDecorations().map((d) => [d.id, TeDecorationRegistry.signature(d)]));
    const same = have.size === next.length
      && next.every((d) => have.get(d.id) === TeDecorationRegistry.signature(d));
    if (same) return false;
    surface.setDecorations(next);
    this.renderCount += 1;
    for (const listener of this.applyListeners) {
      try {
        listener();
      } catch (err) {
        console.error('Decoration apply listener failed', err);
      }
    }
    return true;
  }
}

    const swap = change && change.edit && (change.edit.swap || change.edit.kg);

      const count = span.alts.length;
      const activeIndex = Math.max(0, Math.min(count - 1, span.active | 0));
      const id = String(span.id);
      seen.add(id);
      const descId = `te-ind-desc-${this.instance}-${id}`;
      const fromKg = span.source === 'kg';
      const key = `${kind}|${headline}|${count}|${activeIndex}|${fromKg}`;
      let entry = this.spans.get(id);
      if (!entry || entry.key !== key) {
        if (entry) this.removeSpanElements(entry);
        entry = this.buildSpan(id, kind, headline, count, activeIndex, descId, key);
        if (fromKg) {
          // Derived from the knowledge graph (issue #13): the dots are the
          // concept's synonyms.
          entry.el.dataset.source = 'kg';
          entry.desc.textContent += ' (knowledge graph synonyms)';
        }
        this.spans.set(id, entry);
      }
      const classes = ['te-ind', `te-ind-${kind}`];
      if (headline) classes.push('te-ind-headline');
      items.push({
        id,
        start: span.anchor.start,
        end: span.anchor.end,
        className: classes.join(' '),
        attributes: { 'aria-describedby': descId },
      });
    }
    for (const [id, entry] of this.spans) {
      if (!seen.has(id)) {
        this.removeSpanElements(entry);
        this.spans.delete(id);
      }
    }
    this.ownApply = true;
    try {
      this.registry.set(TeIndicatorLayer.LAYER, items);
    } finally {
      this.ownApply = false;
    }
    // New or rebuilt indicators start hidden; place them now even when the
    // decorations were unchanged and the surface did not re-render.
    this.layout();
  }

  buildSpan(id, kind, headline, count, activeIndex, descId, key) {
    const el = document.createElement('div');
    const dots = document.createElement('div');
    dots.className = kind === 'paragraph' ? 'te-ind-col' : 'te-ind-dots';
    for (let i = 0; i < count; i += 1) {
      const dot = document.createElement('span');
      dot.className = i === activeIndex ? 'te-ind-dot te-ind-dot--active' : 'te-ind-dot';
      dot.dataset.index = String(i);
      dots.appendChild(dot);
    }
    if (kind === 'paragraph') {
      el.className = 'te-ind-para';
      const rule = document.createElement('div');
      rule.className = 'te-ind-rule';
      el.appendChild(rule);
    } else {
      el.className = kind === 'word' ? 'te-ind-row te-ind-row--centre' : 'te-ind-row te-ind-row--end';
    }
    el.appendChild(dots);
    el.dataset.spanId = id;
    el.dataset.kind = headline ? 'headline' : kind;
    el.hidden = true;
    this.overlay.appendChild(el);

    const desc = document.createElement('span');
    desc.id = descId;
    desc.textContent = TeIndicatorLayer.describe(headline ? 'headline' : kind, count, activeIndex);
    this.descriptions.appendChild(desc);
    return { id, kind, headline, count, activeIndex, key, el, desc };
  }

  removeSpanElements(entry) {
    entry.el.remove();
    entry.desc.remove();
  }

  removeAllSpans() {
    for (const entry of this.spans.values()) this.removeSpanElements(entry);
    this.spans.clear();
  }

  // ---------------------------------------------------------------------
  // Geometry
  // ---------------------------------------------------------------------

  /** Client rects of the text in [start, end), without empty fragments. */
  rects(start, end) {
    const range = this.surface.rangeForOffsets(start, end);
    return Array.from(range.getClientRects()).filter((r) => r.width > 0 && r.height > 0);
  }

  /** Position every indicator from the live decoration offsets. */
  layout() {
    if (!this.active || this.destroyed || !this.host || this.spans.size === 0) return;
    this.layoutCount += 1;
    const live = new Map(this.registry.current(TeIndicatorLayer.LAYER).map((d) => [d.id, d]));
    const hostRect = this.host.getBoundingClientRect();
    const originX = hostRect.left + this.host.clientLeft - this.host.scrollLeft;
    const originY = hostRect.top + this.host.clientTop - this.host.scrollTop;
    const root = this.surface.root;
    const rootRect = root.getBoundingClientRect();
    const contentLeft = rootRect.left + root.clientLeft + (parseFloat(getComputedStyle(root).paddingLeft) || 0);
    for (const entry of this.spans.values()) {
      const deco = live.get(entry.id);
      const rects = deco ? this.rects(deco.start, deco.end) : [];
      if (rects.length === 0) {
        entry.el.hidden = true;
        continue;
      }
      entry.el.hidden = false;
      const first = rects[0];
      const last = rects[rects.length - 1];
      let x;
      let y;
      if (entry.kind === 'paragraph') {
        x = contentLeft;
        y = first.top;
        entry.el.style.height = `${Math.max(0, last.bottom - first.top)}px`;
      } else if (entry.kind === 'word') {
        const left = Math.min(...rects.map((r) => r.left));
        const right = Math.max(...rects.map((r) => r.right));
        x = (left + right) / 2;
        y = Math.max(...rects.map((r) => r.bottom));
      } else {
        x = last.right;
        y = last.bottom;
      }
      entry.el.style.left = `${x - originX}px`;
      entry.el.style.top = `${y - originY}px`;
    }
  }

  onDotClick(e) {
    const dot = e.target.closest('.te-ind-dot');
    if (!dot || !this.overlay.contains(dot)) return;
    const holder = dot.closest('[data-span-id]');
    const entry = holder && this.spans.get(holder.dataset.spanId);
    if (!entry) return;
    const index = Number(dot.dataset.index);
    const active = index === entry.activeIndex;
    const event = new CustomEvent('te:dot', {
      bubbles: true,
      cancelable: true,
      detail: {
        editor: this.editor,
        spanId: entry.id,
        index,
        kind: entry.headline ? 'headline' : entry.kind,
        active,
      },
    });
    this.overlay.dispatchEvent(event);
    // Default action (issue #9): jump to that alternative.
    if (!event.defaultPrevented && !active) this.jump(entry.id, index);
  }

  // ---------------------------------------------------------------------
  // In-place cycling (issue #9)
  // ---------------------------------------------------------------------

  /** Track the pointer and the indicated span under it (its text, not its dots). */
  onPointer(e) {
    if (!this.active) return;
    this.pointer = { x: e.clientX, y: e.clientY };
    this.hoverHeld = false;
    this.hoverSpan = this.spanOfElement(e.target);
  }

  clearHover() {
    this.hoverSpan = null;
    this.pointer = null;
    this.hoverHeld = false;
  }

  /**
   * The indicated span whose rendered text holds `el`, or null. Walks out
   * through nested decorations (a Lab mark inside an indicated span, say).
   */
  spanOfElement(el) {
    const prefix = `${TeIndicatorLayer.LAYER}:`;
    const root = this.surface.root;
    let node = el && el.closest ? el.closest('[data-te-decoration]') : null;
    while (node && root.contains(node) && node !== root) {
      const token = (node.getAttribute('data-te-decoration') || '').split(' ').find((t) => t.startsWith(prefix));
      if (token) return token.slice(prefix.length);
      node = node.parentElement ? node.parentElement.closest('[data-te-decoration]') : null;
    }
    return null;
  }

  /** The indicated span rendered under the last pointer position, or null. */
  spanAtPointer() {
    if (!this.pointer || typeof document.elementsFromPoint !== 'function') return null;
    const root = this.surface.root;
    for (const el of document.elementsFromPoint(this.pointer.x, this.pointer.y)) {
      if (el === root || !root.contains(el)) continue;
      const id = this.spanOfElement(el);
      if (id !== null) return id;
    }
    return null;
  }

  /**
   * The hovered span id, if it is still indicated and the pointer is still
   * over its rendered text (or the hover is held across a swap of it).
   * A hover that fails the check is dropped.
   */
  hoveredSpan() {
    const id = this.hoverSpan;
    if (id === null || !this.spans.has(id)) return null;
    if (this.hoverHeld || this.spanAtPointer() === id) return id;
    this.hoverSpan = null;
    this.hoverHeld = false;
    return null;
  }

  /**
   * The indicated span holding the whole selection (a caret at either edge
   * of the span counts as inside), or null.
   */
  spanAtSelection() {
    const sel = this.surface.getSelectionOffsets();
    const live = this.registry.current(TeIndicatorLayer.LAYER);
    const hit = live.find((d) => d.start <= sel.start && sel.end <= d.end);
    return hit && this.spans.has(hit.id) ? hit.id : null;
  }

  commandMenuOpen() {
    const menu = this.editor.commandMenu;
    return !!menu && menu.isConnected && menu.style.display !== 'none';
  }

  onCycleKey(e) {
    if (!this.active || this.destroyed || e.isComposing) return;
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    if (e.ctrlKey || e.metaKey || e.shiftKey || this.commandMenuOpen()) return;
    // Bring the span list up to date before choosing (a refresh may still
    // be waiting after typing, undo or redo).
    if (this.pending()) this.flush();
    const id = e.altKey ? this.spanAtSelection() : this.hoveredSpan();
    if (id === null) return;
    e.preventDefault();
    this.cycle(id, e.key === 'ArrowDown' ? 1 : -1);
  }

  /**
   * Make the alternative `step` places from the active one active, wrapping
   * at either end (ArrowDown from the last returns to the original).
   * Returns the model outcome, or null if nothing changed.
   */
  cycle(spanId, step) {
    if (this.pending()) this.flush();
    const entry = this.spans.get(String(spanId));
    if (!entry || entry.count < 2) return null;
    const next = (((entry.activeIndex + step) % entry.count) + entry.count) % entry.count;
    return this.jump(entry.id, next);
  }

  /** Make alternative `index` of `spanId` active. A refused swap changes nothing. */
  jump(spanId, index) {
    if (typeof this.editor.swapAlternative !== 'function') return null;
    try {
      return this.editor.swapAlternative(spanId, index);
    } catch (err) {
      console.warn('Could not swap the alternative', err);
      return null;
    }
  }
}


class TeHeadingLayer {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.registry = editor.decorations;
    this.active = false;
    this.destroyed = false;
    this.frame = 0;
    this.selectionFrame = 0;
    // Heading lines as last computed: [{ start, end, markerEnd }].
    this.headings = [];
    // Indexes of the headings whose marker is shown.
    this.shown = new Set();

    this.abortController = new AbortController();
    const signal = this.abortController.signal;
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal });
    }
    this.offChange = this.surface.onChange(() => this.schedule());
    // Every render rebuilds the marker spans; put the shown class back.
    this.offApply = this.registry.onApply(() => this.applyShown(true));
    document.addEventListener('selectionchange', () => this.scheduleSelection(), { signal });
    const refreshMode = (e) => {
      if (!e.detail || !e.detail.editor || e.detail.editor === this.editor) {
        this.setActive(this.shouldStyle());
      }
    };
    document.addEventListener('te:mode-change', refreshMode, { signal });
    document.addEventListener('te:tools-change', refreshMode, { signal });
    // Changing decorations replaces Text nodes: wait until the surface has
    // committed composition before applying a pending mode/tools change.
    this.surface.root.addEventListener('compositionend', () => {
      this.setActive(this.shouldStyle());
    }, { signal });
    this.setActive(this.shouldStyle());
  }

  static get LAYER() {
    return 'headings';
  }

  /** Heading lines of `text` outside fenced code: [{ start, end, markerEnd }]. */
  static scan(text) {
    const out = [];
    let fence = null;
    let start = 0;
    while (start <= text.length) {
      const nl = text.indexOf('\n', start);
      const end = nl < 0 ? text.length : nl;
      const line = text.slice(start, end);
      const f = /^ {0,3}(`{3,}|~{3,})/.exec(line);
      if (fence) {
        if (f && f[1][0] === fence[0] && f[1].length >= fence.length && /^ {0,3}[`~]+[ \t]*$/.test(line)) fence = null;
      } else if (f && !(f[1][0] === '`' && line.slice(f[0].length).includes('`'))) {
        fence = f[1];
      } else {
        const marker = teHeadingMarkerLength(line);
        if (marker > 0) out.push({ start, end, markerEnd: start + marker });
      }
      if (nl < 0) break;
      start = nl + 1;
    }
    return out;
  }

  isWriteOn() {
    const chrome = this.editor.chrome;
    const root = this.editor.root || this.surface.root.closest('.te-app');
    return chrome && typeof chrome.isWriteOn === 'function'
      ? chrome.isWriteOn() : !!root && root.dataset.mode === 'write-on';
  }

  shouldStyle() {
    const chrome = this.editor.chrome;
    const root = this.editor.root || this.surface.root.closest('.te-app');
    const tools = chrome && typeof chrome.toolsVisible === 'function'
      ? chrome.toolsVisible() : !!root && root.dataset.tools === 'on';
    return this.isWriteOn() || !tools;
  }

  setActive(on) {
    if (this.destroyed || this.surface.composing) return;
    on = !!on;
    if (on === this.active) {
      if (on) this.flush();
      return;
    }
    this.active = on;
    if (on) {
      this.flush();
    } else {
      this.cancelPending();
      this.headings = [];
      this.shown.clear();
      this.registry.clear(TeHeadingLayer.LAYER);
    }
  }

  schedule() {
    if (!this.active || this.frame) return;
    this.frame = requestAnimationFrame(() => {
      this.frame = 0;
      this.refresh();
    });
  }

  scheduleSelection() {
    if (!this.active || this.selectionFrame) return;
    this.selectionFrame = requestAnimationFrame(() => {
      this.selectionFrame = 0;
      this.applyShown(false);
    });
  }

  cancelPending() {
    if (this.frame) cancelAnimationFrame(this.frame);
    if (this.selectionFrame) cancelAnimationFrame(this.selectionFrame);
    this.frame = 0;
    this.selectionFrame = 0;
  }

  /** Recompute and redraw now. */
  flush() {
    if (!this.active) return;
    if (this.frame) cancelAnimationFrame(this.frame);
    this.frame = 0;
    this.refresh();
  }

  /** Heading lines as last computed. */
  ranges() {
    return this.headings.map((h) => ({ ...h }));
  }

  refresh() {
    if (!this.active || this.destroyed || this.surface.composing) return;
    this.headings = TeHeadingLayer.scan(this.surface.getText());
    const items = [];
    this.headings.forEach((h, i) => {
      if (h.end > h.start) items.push({ id: `h${i}`, start: h.start, end: h.end, className: 'te-heading' });
      items.push({ id: `m${i}`, start: h.start, end: h.markerEnd, className: 'te-heading-marker' });
    });
    // An identical list renders nothing (the registry compares).
    this.registry.set(TeHeadingLayer.LAYER, items);
    this.applyShown(true);
  }

  /** Indexes of the headings on the lines the selection touches. */
  touched() {
    const out = new Set();
    const root = this.surface.root;
    const sel = document.getSelection();
    if (!sel || sel.rangeCount === 0 || !root.contains(sel.anchorNode) || !root.contains(sel.focusNode)) return out;
    const { start, end } = this.surface.getSelectionOffsets();
    this.headings.forEach((h, i) => {
      // A caret at the very end of the line is on it too.
      if (start <= h.end && end >= h.start) out.add(i);
    });
    return out;
  }

  /**
   * Show the markers of the heading lines under the selection, hide the
   * rest. `force` re-applies after a render rebuilt the spans.
   */
  applyShown(force) {
    if (!this.active || this.destroyed) return;
    const next = this.touched();
    const same = next.size === this.shown.size && [...next].every((i) => this.shown.has(i));
    if (same && !force) return;
    this.shown = next;
    const root = this.surface.root;
    for (const el of root.querySelectorAll('.te-heading-marker')) {
      const ids = (el.getAttribute('data-te-decoration') || '').split(' ');
      const id = ids.find((d) => d.startsWith(`${TeHeadingLayer.LAYER}:m`));
      const i = id ? Number(id.slice(TeHeadingLayer.LAYER.length + 2)) : -1;
      el.classList.toggle('te-heading-marker--shown', next.has(i));
    }
    // The marker's width moves the text after it: re-place the dots.
    if (!same && this.editor.indicators && typeof this.editor.indicators.scheduleLayout === 'function') {
      this.editor.indicators.scheduleLayout();
    }
  }

  destroy() {
    if (this.destroyed) return;
    this.cancelPending();
    if (this.active && this.surface && !this.surface.destroyed) this.registry.clear(TeHeadingLayer.LAYER);
    this.destroyed = true;
    this.active = false;
    this.offChange();
    this.offApply();
    this.abortController.abort();
  }
}

window.TeDecorationRegistry = TeDecorationRegistry;
window.TeIndicatorLayer = TeIndicatorLayer;
window.TeHeadingLayer = TeHeadingLayer;

    <!-- Ghost layer and selection context menu (issue #11). -->
    <script>/*
 * Ghost layer and selection context menu (issue #11; spec R-5.1 to R-5.3,
 * R-7.3, R-7.4)
 * ========================================================================
 *
 * TeGhostLayer (`editor.ghosts`)
 * ------------------------------
 * Ghosting is an independent layer of body ranges kept by the WASM document
 * model (decision 2026-10-04): a ghost may cover or partly overlap spans
 * with alternatives, touching or overlapping ghosts merge, reviving part of
 * a ghost trims or splits it, and ghosts follow edits (they are elastic).
 * The model does all of that; this class only asks it and draws the result.
 *
 *   editor.ghosts.ghost(start, end)    // -> { ok, id, annotations } | { ok: false, error, kind }
 *   editor.ghosts.revive(start, end)   // -> { ok, changed, annotations } | { ok: false, ... }
 *   editor.ghosts.toggle()             // Ctrl+/ on the current selection
 *   editor.ghosts.targetFor({ start, end })  // -> { action: 'ghost' | 'revive', start, end } | null
 *   editor.ghosts.flush()              // read the model and redraw now
 *
 * - Offsets are UTF-16 code units, as everywhere on the surface.
 * - Drawing: the `ghosts` layer of the decoration registry (indicators.js),
 *   items with the class `te-ghost` and no attributes, so the indicators'
 *   `aria-describedby` on shared text is never overwritten. The fade
 *   (public/css/selection-menu.css) uses `--te-ghost-opacity` on the text
 *   colour, so the selection highlight and indicator underlines on ghosted
 *   text stay visible: ghosted text is still readable, selectable, editable
 *   and counted (R-5.1, decision 3). Export drops it (R-9.3).
 * - Refresh: after `ghost`/`revive` the layer is redrawn at once from the
 *   annotations the call returns (no second model read). Typing elsewhere
 *   needs no model read: the registry moves the decorations with the text,
 *   and a trailing debounce (`delay`, default 120 ms like the indicators)
 *   confirms against the model. An edit inside a ghost drops its surface
 *   decoration (EditorSurface.mapRanges) while the model resizes the ghost,
 *   so that case is redrawn on the next animation frame instead. When the
 *   model has no ghosts at all (live or set aside) no edit can create one,
 *   so typing reads nothing.
 * - Undo: ghosts are annotations, not text, so ghost and revive are not
 *   entries in the surface's text undo history. Ctrl+/ (or the menu) is the
 *   reversal. Text undo/redo still moves ghosts, because the model mirrors
 *   every replayed edit.
 * - Every change dispatches a bubbling `te:ghosts-change` CustomEvent from
 *   the surface with detail { editor, action, start, end, id, changed,
 *   ghosts }, so whoever owns storage can mark the document as changed.
 *
 * TeSelectionMenu (`editor.selectionMenu`)
 * ----------------------------------------
 * The R-7.3 context menu: a dark rounded panel (tokens `--te-color-popover`,
 * `--te-radius-popover`, `--te-font-mono`, `--te-color-text-dim`) with the
 * label on the left and the dim shortcut on the right. Available in plain
 * and Write_On mode alike.
 *
 * - Opens on `contextmenu` over a non-empty selection in the surface, and on
 *   the Menu key or Shift+F10 (positioned under the selection). Right-click
 *   or Ctrl+/ with a collapsed caret inside a ghost offers Revive for the
 *   whole ghost (R-5.2: "right-click ghosted text"). With nothing to offer
 *   the native menu is left alone.
 * - Items are pluggable and appear in the R-7.3 order (`SLOTS`). An item
 *   that is not implemented, or not available for the selection, is not
 *   rendered at all (hidden, never disabled). Only Ghost it / Revive is
 *   built in; #10, #13 and #12 register theirs:
 *
 *     editor.selectionMenu.register({
 *       id: 'alternatives',              // slot from SLOTS (or any new id)
 *       label: 'Alternatives for selection',   // or (ctx) => string
 *       key: 'ctrl+shift+a',             // shortcut, also handled on the surface
 *       available: (ctx) => true,        // ctx: { editor, start, end, collapsed, text }
 *       run: (ctx) => { ... },
 *     });
 *
 * - Keyboard: ArrowUp/ArrowDown (wrapping), Home/End, Enter/Space run the
 *   item, Escape or Tab close and return focus and the selection to the
 *   surface. ARIA `menu`/`menuitem`, `aria-keyshortcuts` on each item.
 * - Closes on a click outside, any scroll, a resize or focus leaving it.
 *   Listeners use the editor's AbortController signal (plus one per open
 *   menu, aborted on close); `destroy()` removes the menu and all of them.
 *
 * Shortcuts (R-7.4): `ctrl+/` matches Ctrl (not Cmd) with `/` (by `key`, or
 * by `code` "Slash"; Shift is ignored for punctuation so layouts where `/`
 * needs Shift work). Letter shortcuts need the exact Shift state. config.js binds
 * ctrl+b/i/k/l/h; MarkdownEditor matches those with the exact modifiers,
 * Shift included (teConfigShortcutMatches in editor.js), so a ctrl+a/g/x
 * entry there would not fire on the R-7.3 Ctrl+Shift item. The command
 * palette ignores `/` with Ctrl, and the surface only takes Ctrl/Cmd+Z/Y.
 * tests/web_shortcuts.rs asserts the two sets are disjoint. See
 * docs/design/ghosts-and-menu.md.
 *
 * Load order: after indicators.js (the registry) and before editor.js,
 * which instantiates both classes in MarkdownEditor.initialize().
 */

class TeGhostLayer {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.registry = editor.decorations;
    this.delay = options.delay === undefined ? 120 : options.delay;
    this.destroyed = false;
    this.timer = null;
    this.frame = 0;
    // Live ghosts as last read: [{ id, start, end }].
    this.ghosts = [];
    // Live plus set-aside ghosts in the model at the last read; while it is
    // zero, edits cannot produce a ghost and nothing is read.
    this.modelGhosts = 0;
    // Items in the registry layer after the last refresh or edit.
    this.count = 0;
    // Diagnostics for tests: model refreshes run.
    this.refreshCount = 0;

    this.abortController = new AbortController();
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal: this.abortController.signal });
    }
    this.offChange = this.surface.onChange(() => this.onSurfaceChange());
    this.flush();
  }

  static get LAYER() {
    return 'ghosts';
  }

  /** The WASM document API, if it offers ghosting. */
  api() {
    const editor = this.editor;
    const api = typeof editor.documentApi === 'function' ? editor.documentApi() : null;
    return api && typeof api.ghost_range === 'function' && typeof api.revive_range === 'function'
      ? api
      : null;
  }

  available() {
    return !this.destroyed && !!this.api();
  }

  // ---------------------------------------------------------------------
  // Scheduling
  // ---------------------------------------------------------------------

  onSurfaceChange() {
    if (this.destroyed) return;
    const now = this.registry.get(TeGhostLayer.LAYER).length;
    const dropped = now < this.count;
    this.count = now;
    if (dropped) {
      // The edit landed inside a ghost: the model resized it, the surface
      // dropped it. Redraw before the next paint.
      if (this.timer !== null) {
        clearTimeout(this.timer);
        this.timer = null;
      }
      if (!this.frame) {
        this.frame = requestAnimationFrame(() => {
          this.frame = 0;
          this.refresh();
        });
      }
    } else if (this.modelGhosts > 0 && !this.frame) {
      if (this.timer !== null) clearTimeout(this.timer);
      this.timer = setTimeout(() => {
        this.timer = null;
        this.refresh();
      }, this.delay);
    }
  }

  cancelPending() {
    if (this.timer !== null) {
      clearTimeout(this.timer);
      this.timer = null;
    }
    if (this.frame) {
      cancelAnimationFrame(this.frame);
      this.frame = 0;
    }
  }

  /** Is a debounced or per-frame refresh waiting? */
  pending() {
    return this.timer !== null || this.frame !== 0;
  }

  /** Read the model and redraw now. */
  flush() {
    this.refresh();
  }

  // ---------------------------------------------------------------------
  // Model
  // ---------------------------------------------------------------------

  /** Live ghosts from the model (body aligned first), as [{ id, start, end }]. */
  read() {
    this.refresh();
    return this.ghosts.map((g) => ({ ...g }));
  }

  /**
   * Redraw from `annotations` (as returned by ghost_range/revive_range or
   * editor.annotations()); reads the model when none are given.
   */
  refresh(annotations) {
    if (this.destroyed || !this.surface || this.surface.destroyed) return;
    this.cancelPending();
    let ann = annotations;
    if (!ann && this.api()) {
      try {
        ann = this.editor.annotations();
      } catch (err) {
        ann = null;
      }
    }
    if (!ann && !this.api()) return;
    this.refreshCount += 1;
    const live = ann && Array.isArray(ann.ghosts) ? ann.ghosts : [];
    const setAside = ann && ann.setAside && Array.isArray(ann.setAside.ghosts) ? ann.setAside.ghosts.length : 0;
    this.ghosts = live
      .filter((g) => g && g.anchor)
      .map((g) => ({ id: String(g.id), start: g.anchor.start, end: g.anchor.end }));
    this.modelGhosts = this.ghosts.length + setAside;
    this.registry.set(TeGhostLayer.LAYER, this.ghosts.map((g) => ({
      id: g.id,
      start: g.start,
      end: g.end,
      className: 'te-ghost',
    })));
    this.count = this.registry.get(TeGhostLayer.LAYER).length;
  }

  /** The live ghost containing [start, end) (inclusive ends), if any. */
  containing(start, end, ghosts = this.ghosts) {
    return ghosts.find((g) => g.start <= start && end <= g.end) || null;
  }

  /**
   * What Ctrl+/ does for `sel` ({ start, end }), read from the model:
   * - a selection lying entirely inside one ghost is revived (touching
   *   ghosts merge, so "entirely ghosted" always means one ghost);
   * - any other non-empty selection is ghosted (merging with neighbours);
   * - a collapsed caret inside a ghost revives that whole ghost;
   * - otherwise null (nothing to do).
   */
  targetFor(sel) {
    if (!this.available() || !sel) return null;
    const start = Math.min(sel.start, sel.end);
    const end = Math.max(sel.start, sel.end);
    const ghosts = this.read();
    if (start === end) {
      const g = this.containing(start, end, ghosts);
      return g ? { action: 'revive', start: g.start, end: g.end, whole: true } : null;
    }
    return this.containing(start, end, ghosts)
      ? { action: 'revive', start, end }
      : { action: 'ghost', start, end };
  }

  ghost(start, end) {
    return this.change('ghost', start, end);
  }

  revive(start, end) {
    return this.change('revive', start, end);
  }

  /** Run a target from targetFor(). */
  apply(target) {
    if (!target) return { ok: false, error: 'Nothing to ghost or revive', kind: 'empty' };
    return this.change(target.action, target.start, target.end);
  }

  /** Ctrl+/: ghost or revive the current selection (see targetFor()). */
  toggle(sel = this.surface.getSelectionOffsets()) {
    return this.apply(this.targetFor(sel));
  }

  change(action, start, end) {
    const api = this.destroyed ? null : this.api();
    if (!api) return { ok: false, error: 'The WASM document API does not offer ghosting', kind: 'unavailable' };
    const s = Math.max(0, Math.min(start, end) | 0);
    const e = Math.max(0, Math.max(start, end) | 0);
    // The model must hold exactly the surface text before ranges are used.
    this.editor.alignDocumentModel(api);
    const result = action === 'ghost' ? api.ghost_range(s, e) : api.revive_range(s, e);
    if (!result || !result.ok) {
      console.warn(`Could not ${action} ${s}..${e}:`, result && result.error);
      return result || { ok: false, error: 'No result', kind: 'other' };
    }
    this.refresh(result.annotations);
    this.surface.root.dispatchEvent(new CustomEvent('te:ghosts-change', {
      bubbles: true,
      detail: {
        editor: this.editor,
        action,
        start: s,
        end: e,
        id: result.id === undefined ? null : result.id,
        changed: result.changed === undefined ? true : !!result.changed,
        ghosts: this.ghosts.map((g) => ({ ...g })),
      },
    }));
    return result;
  }

  /** Remove the layer's decorations and stop listening. */
  destroy() {
    if (this.destroyed) return;
    this.cancelPending();
    if (this.surface && !this.surface.destroyed) this.registry.clear(TeGhostLayer.LAYER);
    this.destroyed = true;
    this.offChange();
    this.abortController.abort();
  }
}

/** Display text and aria-keyshortcuts value for a shortcut such as 'ctrl+shift+a'. */
function teShortcutLabels(key) {
  const parts = String(key).split('+').filter(Boolean);
  const name = { ctrl: 'Ctrl', shift: 'Shift', alt: 'Alt', meta: 'Cmd' };
  const aria = { ctrl: 'Control', shift: 'Shift', alt: 'Alt', meta: 'Meta' };
  const last = parts[parts.length - 1] || '';
  const keyText = last.length === 1 ? last.toUpperCase() : last;
  return {
    text: parts.slice(0, -1).map((p) => name[p] || p).concat(keyText).join('+'),
    aria: parts.slice(0, -1).map((p) => aria[p] || p).concat(keyText).join('+'),
  };
}

/** Does keydown `e` match a shortcut such as 'ctrl+/' or 'ctrl+shift+a'? */
function teShortcutMatches(e, key) {
  const parts = String(key).toLowerCase().split('+').filter(Boolean);
  const want = parts[parts.length - 1];
  if (!want || e.isComposing) return false;
  const mods = new Set(parts.slice(0, -1));
  // Exactly the modifiers named: Ctrl means Ctrl on every platform (R-7.3);
  // Cmd is not an alias (Safari binds Cmd+/, macOS browsers Cmd+Shift+A/G).
  if (mods.has('ctrl') !== e.ctrlKey) return false;
  if (mods.has('meta') !== e.metaKey) return false;
  if (mods.has('alt') !== e.altKey) return false;
  const pressed = (e.key || '').toLowerCase();
  if (/^[a-z0-9]$/.test(want)) {
    if (mods.has('shift') !== e.shiftKey) return false;
    return pressed === want || e.code === `Key${want.toUpperCase()}` || e.code === `Digit${want}`;
  }
  // Punctuation: Shift may be needed to type it on some layouts.
  const codes = { '/': 'Slash', '.': 'Period', ',': 'Comma', ';': 'Semicolon' };
  return pressed === want || (codes[want] !== undefined && e.code === codes[want] && !e.shiftKey);
}

let teSelectionMenuInstances = 0;

class TeSelectionMenu {
  constructor(editor, options = {}) {
    this.editor = editor;
    this.surface = editor.surface;
    this.instance = ++teSelectionMenuInstances;
    this.items = [];
    this.element = null;
    this.visible = [];
    this.activeIndex = -1;
    this.context = null;
    this.openController = null;
    this.destroyed = false;

    this.abortController = new AbortController();
    const signal = this.abortController.signal;
    if (options.signal) {
      if (options.signal.aborted) this.abortController.abort();
      else options.signal.addEventListener('abort', () => this.destroy(), { signal });
    }
    const root = this.surface.root;
    root.addEventListener('contextmenu', (e) => this.onContextMenu(e), { signal });
    root.addEventListener('keydown', (e) => this.onSurfaceKeyDown(e), { signal });

    if (editor.ghosts) this.register(TeSelectionMenu.ghostItem(editor));
  }

  /** R-7.3 order. Items with other ids follow, in registration order. */
  static get SLOTS() {
    return ['alternatives', 'ai-alternatives', 'ghost', 'stash'];
  }

  /** The built-in Ghost it / Revive item (R-5.1, R-5.2). */
  static ghostItem(editor) {
    return {
      id: 'ghost',
      key: 'ctrl+/',
      label: (ctx) => (ctx.ghost && ctx.ghost.action === 'revive' ? 'Revive' : 'Ghost it'),
      available: (ctx) => {
        const layer = editor.ghosts;
        if (!layer || !layer.available()) return false;
        if (ctx.ghost === undefined) ctx.ghost = layer.targetFor(ctx);
        return !!ctx.ghost;
      },
      run: (ctx) => editor.ghosts.apply(ctx.ghost || editor.ghosts.targetFor(ctx)),
    };
  }

  /** Add (or replace, by id) a menu item. Returns an unregister function. */
  register(item) {
    if (!item || typeof item.id !== 'string' || typeof item.run !== 'function') {
      throw new Error('A selection menu item needs an id and a run function');
    }
    this.unregister(item.id);
    this.items.push(item);
    const slots = TeSelectionMenu.SLOTS;
    const rank = (it) => {
      const i = slots.indexOf(it.id);
      return i === -1 ? slots.length : i;
    };
    // Stable: registration order breaks ties.
    this.items = this.items.map((it, i) => [it, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map((x) => x[0]);
    return () => this.unregister(item.id);
  }

  unregister(id) {
    this.items = this.items.filter((it) => it.id !== id);
  }

  /** Registered item ids, in menu order. */
  ids() {
    return this.items.map((it) => it.id);
  }

  isOpen() {
    return !!this.element;
  }

  /** The action context for selection `sel` ({ start, end }). */
  contextFor(sel) {
    const start = Math.min(sel.start, sel.end);
    const end = Math.max(sel.start, sel.end);
    return {
      editor: this.editor,
      start,
      end,
      collapsed: start === end,
      text: this.surface.getText().slice(start, end),
      selection: { start: sel.start, end: sel.end, direction: sel.direction },
    };
  }

  /** Items available for `ctx`, in menu order. */
  availableItems(ctx) {
    return this.items.filter((it) => {
      try {
        return typeof it.available !== 'function' || !!it.available(ctx);
      } catch (err) {
        console.error(`Selection menu item "${it.id}" failed`, err);
        return false;
      }
    });
  }

  // ---------------------------------------------------------------------
  // Opening
  // ---------------------------------------------------------------------

  onContextMenu(e) {
    if (this.destroyed) return;
    if (this.isOpen()) {
      // The Menu key fires keydown (which opened the menu) and contextmenu.
      e.preventDefault();
      return;
    }
    let sel = this.surface.getSelectionOffsets();
    const pointer = !(e.clientX === 0 && e.clientY === 0) && e.button !== -1;
    if (sel.start === sel.end && pointer) {
      const at = this.offsetAtPoint(e.clientX, e.clientY);
      if (at >= 0) sel = { start: at, end: at, direction: 'none' };
    }
    const point = pointer ? { x: e.clientX, y: e.clientY } : null;
    if (this.open(sel, point)) e.preventDefault();
  }

  onSurfaceKeyDown(e) {
    if (this.destroyed || e.isComposing) return;
    if (e.key === 'ContextMenu' || (e.key === 'F10' && e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey)) {
      if (this.open(this.surface.getSelectionOffsets(), null)) e.preventDefault();
      return;
    }
    if (!(e.ctrlKey || e.metaKey)) return;
    const item = this.items.find((it) => it.key && teShortcutMatches(e, it.key));
    if (!item) return;
    const ctx = this.contextFor(this.surface.getSelectionOffsets());
    if (this.availableItems(ctx).includes(item)) {
      e.preventDefault();
      this.run(item, ctx);
    }
  }

  /** UTF-16 offset of the text at viewport point (x, y), or -1. */
  offsetAtPoint(x, y) {
    let node = null;
    let offset = 0;
    if (document.caretRangeFromPoint) {
      const r = document.caretRangeFromPoint(x, y);
      if (r) {
        node = r.startContainer;
        offset = r.startOffset;
      }
    } else if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (p) {
        node = p.offsetNode;
        offset = p.offset;
      }
    }
    return node ? this.surface.pointToOffset(node, offset) : -1;
  }

  /**
   * Open the menu for selection `sel` at viewport `point` ({ x, y }; under
   * the selection when null). Returns false, and shows nothing, when no
   * item is available.
   */
  open(sel, point = null) {
    if (this.destroyed) return false;
    this.close({ restoreFocus: false });
    const ctx = this.contextFor(sel);
    const items = this.availableItems(ctx);
    if (items.length === 0) return false;
    this.context = ctx;
    this.visible = items;

    const menu = document.createElement('div');
    menu.className = 'te-selection-menu';
    menu.id = `te-selection-menu-${this.instance}`;
    menu.setAttribute('role', 'menu');
    menu.setAttribute('aria-label', 'Selection actions');
    menu.setAttribute('aria-orientation', 'vertical');
    menu.tabIndex = -1;
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'te-selection-menu-item';
      row.setAttribute('role', 'menuitem');
      row.tabIndex = -1;
      row.dataset.item = item.id;
      row.dataset.index = String(i);
      const label = document.createElement('span');
      label.className = 'te-selection-menu-label';
      label.textContent = typeof item.label === 'function' ? item.label(ctx) : String(item.label || item.id);
      row.appendChild(label);
      if (item.key) {
        const keys = teShortcutLabels(item.key);
        row.setAttribute('aria-keyshortcuts', keys.aria);
        const hint = document.createElement('span');
        hint.className = 'te-selection-menu-key';
        hint.setAttribute('aria-hidden', 'true');
        hint.textContent = keys.text;
        row.appendChild(hint);
      }
      menu.appendChild(row);
    });
    document.body.appendChild(menu);
    this.element = menu;
    this.surface.root.setAttribute('aria-controls', menu.id);
    this.position(point || this.selectionPoint(ctx));

    this.openController = new AbortController();
    const signal = this.openController.signal;
    menu.addEventListener('keydown', (e) => this.onMenuKeyDown(e), { signal });
    // Keep the surface selection while pressing an item.
    menu.addEventListener('mousedown', (e) => e.preventDefault(), { signal });
    menu.addEventListener('click', (e) => {
      const row = e.target.closest('.te-selection-menu-item');
      if (row && menu.contains(row)) this.activate(Number(row.dataset.index));
    }, { signal });
    menu.addEventListener('mousemove', (e) => {
      const row = e.target.closest('.te-selection-menu-item');
      if (row && menu.contains(row)) this.setActive(Number(row.dataset.index));
    }, { signal });
    menu.addEventListener('focusout', (e) => {
      if (!e.relatedTarget || !menu.contains(e.relatedTarget)) {
        // Focus left for something else (Tab, a click elsewhere): close
        // without pulling focus back.
        if (e.relatedTarget) this.close({ restoreFocus: false });
      }
    }, { signal });
    const outside = (e) => {
      if (this.element && !this.element.contains(e.target)) this.close({ restoreFocus: false });
    };
    document.addEventListener('mousedown', outside, { signal, capture: true });
    document.addEventListener('touchstart', outside, { signal, capture: true, passive: true });
    // Any scroll (capture catches scrolling containers) or resize closes it.
    window.addEventListener('scroll', () => this.close({ restoreFocus: false }), { signal, capture: true, passive: true });
    window.addEventListener('resize', () => this.close({ restoreFocus: false }), { signal });
    window.addEventListener('blur', () => this.close({ restoreFocus: false }), { signal });

    this.setActive(0);
    return true;
  }

  /**
   * Viewport point under the last line of the selection, at its left edge.
   * Decorations split a line into several rects, so the whole line is used.
   */
  selectionPoint(ctx) {
    const range = this.surface.rangeForOffsets(ctx.start, ctx.end);
    const rects = Array.from(range.getClientRects()).filter((r) => r.width > 0 && r.height > 0);
    if (rects.length > 0) {
      const lastTop = Math.max(...rects.map((r) => r.top));
      const line = rects.filter((r) => r.bottom > lastTop);
      const bottom = Math.max(...line.map((r) => r.bottom));
      // Client rects cover the glyph box; clear the line box (half-leading)
      // so the menu never covers the selection highlight.
      const glyph = bottom - Math.min(...line.map((r) => r.top));
      const lineHeight = parseFloat(getComputedStyle(this.surface.root).lineHeight) || glyph;
      return {
        x: Math.min(...line.map((r) => r.left)),
        y: bottom + Math.max(0, (lineHeight - glyph) / 2) + 4,
      };
    }
    const caret = this.surface.getCaretRect(ctx.end);
    return { x: caret.left, y: caret.bottom + 4 };
  }

  /** Place the menu at `point`, kept inside the viewport. */
  position(point) {
    const menu = this.element;
    const margin = 8;
    const box = menu.getBoundingClientRect();
    const vw = document.documentElement.clientWidth || window.innerWidth;
    const vh = document.documentElement.clientHeight || window.innerHeight;
    let left = point.x;
    let top = point.y;
    if (left + box.width > vw - margin) left = vw - margin - box.width;
    if (top + box.height > vh - margin) top = Math.max(margin, point.y - box.height - 8);
    menu.style.left = `${Math.max(margin, left)}px`;
    menu.style.top = `${Math.max(margin, top)}px`;
  }

  rows() {
    return this.element ? Array.from(this.element.querySelectorAll('.te-selection-menu-item')) : [];
  }

  setActive(index) {
    const rows = this.rows();
    if (rows.length === 0) return;
    const i = ((index % rows.length) + rows.length) % rows.length;
    this.activeIndex = i;
    rows.forEach((row, j) => row.classList.toggle('te-selection-menu-item--active', j === i));
    if (document.activeElement !== rows[i]) rows[i].focus({ preventScroll: true });
  }

  onMenuKeyDown(e) {
    const n = this.visible.length;
    switch (e.key) {
      case 'ArrowDown':
        this.setActive(this.activeIndex + 1);
        break;
      case 'ArrowUp':
        this.setActive(this.activeIndex - 1);
        break;
      case 'Home':
        this.setActive(0);
        break;
      case 'End':
        this.setActive(n - 1);
        break;
      case 'Enter':
      case ' ':
        this.activate(this.activeIndex);
        break;
      case 'Escape':
      case 'Tab':
        this.close({ restoreFocus: true });
        break;
      default: {
        // An item's own shortcut works while the menu is open.
        const index = this.visible.findIndex((it) => it.key && teShortcutMatches(e, it.key));
        if (index === -1) return;
        this.activate(index);
      }
    }
    e.preventDefault();
    e.stopPropagation();
  }

  /** Run visible item `index` on the selection the menu was opened for. */
  activate(index) {
    const item = this.visible[index];
    const ctx = this.context;
    if (!item || !ctx) return;
    this.close({ restoreFocus: true });
    this.run(item, ctx);
  }

  run(item, ctx) {
    try {
      return item.run(ctx);
    } catch (err) {
      console.error(`Selection menu item "${item.id}" failed`, err);
      return undefined;
    }
  }

  /** Close the menu; with restoreFocus, focus the surface and reselect. */
