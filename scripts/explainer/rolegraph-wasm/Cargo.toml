[package]
name = "terraphim-rolegraph-wasm"
version = "1.0.0"
edition = "2021"
authors = ["Terraphim Contributors"]
description = "WebAssembly bindings for terraphim_rolegraph"
license = "Apache-2.0"
repository = "https://github.com/terraphim/terraphim-ai"

# Standalone package, not part of parent workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
terraphim_rolegraph = { path = ".." }
terraphim_automata = { path = "../../terraphim_automata" }
terraphim_types = { path = "../../terraphim_types" }
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
log = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
# Disable wasm-opt: the bundled wasm-opt is too old for the WASM
# features produced by recent Rust toolchains.
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
