{% extends "base.html" %}

{% block title %}
{{ config.title }} | {{ page.title }}
{% endblock %}

{% block content %}
<link href="{{ get_url(path='explainers/graph-embeddings/explainer.css', cachebust=true) }}" rel="stylesheet">

<div class="page-header">
  <div class="page-header-inner">
    <h1 class="section-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="section-subtitle">{{ page.description }}</p>
    {% endif %}
  </div>
</div>

<div class="article-container">
  <article class="article-box">
    <div class="prose">
      {{ page.content | safe }}
    </div>
  </article>
</div>
{% endblock %}

{% block custom_js %}
<script src="{{ get_url(path='explainers/graph-embeddings/engine.js', cachebust=true) }}"></script>
<script src="{{ get_url(path='explainers/graph-embeddings/explainer.js', cachebust=true) }}"></script>
{% endblock %}
